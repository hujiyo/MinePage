<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>私信 · MinePage</title>
<link rel="stylesheet" href="/_assets/style.css">
</head>
<body>
<main class="page wide">
  <h1>私信</h1>
  <p class="sub">和创作者直接沟通，注意保护个人隐私。</p>
  <div class="msgLayout" style="margin-top:16px">
    <div class="msgList" id="convList"></div>
    <div class="chatBox">
      <div class="chatHead" id="chatHead"></div>
      <div class="chatBody" id="chatBody"></div>
      <form class="chatFoot" id="chatForm">
        <input id="chatInput" type="text" maxlength="500" placeholder="输入消息，回车发送…" autocomplete="off" disabled>
        <button id="sendButton" type="submit" disabled>发送</button>
      </form>
    </div>
  </div>
</main>
<script src="/_assets/app.js"></script>
<script>
MP.topbar({ active: 'messages' });

const convBox = document.getElementById('convList');
const headBox = document.getElementById('chatHead');
const bodyBox = document.getElementById('chatBody');
const input = document.getElementById('chatInput');
const sendButton = document.getElementById('sendButton');
const target = Number(new URLSearchParams(location.search).get('to'));
let conversations = [];
let selectedId = null;
let thread = null;
let loadingThread = 0;
let sending = false;

function formatTime(value) {
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? '' : date.toLocaleString('zh-CN', { dateStyle: 'short', timeStyle: 'short' });
}

async function api(url, options) {
  const res = await fetch(url, { ...options, headers: { Accept: 'application/json', ...options?.headers } });
  const data = await res.json().catch(() => null);
  if (!res.ok || !data?.ok) {
    if (res.status === 401) {
      MP.forgetSession();
      MP.auth.openLogin({});
    }
    throw new Error(data?.message || '请求失败，稍后再试');
  }
  return data;
}

function setComposerEnabled(enabled) {
  input.disabled = !enabled || sending;
  sendButton.disabled = !enabled || sending;
}

function showBody(message) {
  bodyBox.textContent = '';
  const empty = document.createElement('div');
  empty.className = 'empty';
  empty.textContent = message;
  bodyBox.appendChild(empty);
}

function renderConversations() {
  convBox.textContent = '';
  const items = conversations.slice();
  if (thread && !items.some((c) => c.user.id === thread.user.id)) {
    items.unshift({ user: thread.user, lastMessage: null, unread: 0 });
  }
  if (!items.length) {
    convBox.innerHTML = '<div class="empty">暂无会话</div>';
    return;
  }
  items.forEach((c) => {
    const item = document.createElement('div');
    item.className = 'msgItem' + (c.user.id === selectedId ? ' on' : '');
    item.tabIndex = 0;
    item.setAttribute('role', 'button');
    item.setAttribute('aria-label', '查看与' + c.user.name + '的私信');
    item.innerHTML = '<span class="avatar sm">' + MP.esc(c.user.name.charAt(0)) + '</span>'
      + '<div class="mi"><div class="nm"><span>' + MP.esc(c.user.name) + (c.unread ? ' <b>· ' + Number(c.unread) + ' 条未读</b>' : '') + '</span>'
      + '<time>' + MP.esc(formatTime(c.lastMessage?.at)) + '</time></div>'
      + '<div class="pv">' + MP.esc(c.lastMessage?.content || '开始新会话') + '</div></div>';
    item.addEventListener('click', () => selectConversation(c.user.id));
    item.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        selectConversation(c.user.id);
      }
    });
    convBox.appendChild(item);
  });
}

function renderThread() {
  if (!thread) return;
  const user = thread.user;
  headBox.textContent = user.name;
  if (user.username) {
    const small = document.createElement('small');
    const link = document.createElement('a');
    link.href = '/u/' + encodeURIComponent(user.username);
    link.textContent = '查看主页';
    small.appendChild(link);
    headBox.appendChild(small);
  }
  bodyBox.textContent = '';
  if (!thread.messages.length) {
    showBody('还没有消息，发一条开始聊天');
    return;
  }
  thread.messages.forEach((message) => {
    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (message.fromMe ? ' me' : '');
    const avatar = document.createElement('span');
    avatar.className = 'avatar xs';
    avatar.textContent = message.fromMe ? '我' : user.name.charAt(0);
    const content = document.createElement('div');
    content.className = 'btxt';
    content.textContent = message.content;
    const time = document.createElement('span');
    time.className = 'bt';
    time.textContent = formatTime(message.at);
    bubble.append(avatar, content, time);
    bodyBox.appendChild(bubble);
  });
  bodyBox.scrollTop = bodyBox.scrollHeight;
}

async function loadConversations() {
  const data = await api('/api/messages');
  conversations = data.conversations;
  renderConversations();
}

async function selectConversation(id) {
  selectedId = id;
  thread = null;
  const request = ++loadingThread;
  setComposerEnabled(false);
  headBox.textContent = '';
  showBody('正在加载消息…');
  renderConversations();
  try {
    const data = await api('/api/messages/' + id);
    if (request !== loadingThread) return;
    thread = data;
    renderThread();
    setComposerEnabled(true);
    try {
      await loadConversations();
    } catch {
      MP.toast('会话列表刷新失败，稍后再试');
    }
  } catch (error) {
    if (request !== loadingThread) return;
    showBody(error.message || '消息加载失败，稍后再试');
  }
}

document.getElementById('chatForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  const content = input.value.trim();
  if (!content || !thread || sending) return;
  const id = selectedId;
  sending = true;
  setComposerEnabled(true);
  try {
    await api('/api/messages/' + id, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content }),
    });
    input.value = '';
    await selectConversation(id);
    input.focus();
  } catch (error) {
    MP.toast(error.message || '发送失败，稍后再试');
  } finally {
    sending = false;
    setComposerEnabled(Boolean(thread));
  }
});

async function boot() {
  showBody('正在加载会话…');
  try {
    await loadConversations();
    const first = Number.isSafeInteger(target) && target > 0 ? target : conversations[0]?.user.id;
    if (first) await selectConversation(first);
    else showBody('暂无消息，从创作者主页可以发起私信');
  } catch (error) {
    showBody(error.message || '会话加载失败，稍后再试');
  }
}

boot();
</script>
</body>
</html>
