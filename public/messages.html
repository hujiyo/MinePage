<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>私信 · MinePage</title>
<link rel="stylesheet" href="/_assets/style.css">
</head>
<body>
<main class="page wide">
  <h1>私信</h1>
  <p class="sub">和创作者直接沟通，注意保护个人隐私。</p>

  <div class="msgLayout" style="margin-top:16px">
    <div class="msgList" id="convList"></div>

    <div class="chatBox">
      <div class="chatHead" id="chatHead"></div>
      <div class="chatBody" id="chatBody"></div>
      <form class="chatFoot" id="chatForm">
        <input id="chatInput" type="text" maxlength="500" placeholder="输入消息，回车发送…" autocomplete="off">
        <button type="submit">发送</button>
      </form>
    </div>
  </div>
</main>

<script src="/_assets/app.js"></script>
<script>
MP.topbar({ active: 'messages' });

// ?to=<用户 id> 直接从创作者主页 / 观看页的「私信」跳进来
const TO = Number(new URLSearchParams(location.search).get('to') || 0);

const convBox = document.getElementById('convList');
const headBox = document.getElementById('chatHead');
const bodyBox = document.getElementById('chatBody');
const input = document.getElementById('chatInput');

let me = null;
let convs = [];      // [{ user, lastMessage, unread }]
let curId = TO || 0; // 当前会话的对方 id
let curUser = null;  // 当前会话的对方资料
let messages = [];   // [{ id, fromMe, content, at }]

// ---------------------------------------------------------------- 会话列表

function renderConvs() {
  convBox.textContent = '';

  if (!convs.length) {
    convBox.innerHTML = '<div class="empty" style="padding:24px 14px">还没有私信。去创作者主页点「私信」开始聊天。</div>';
    return;
  }

  convs.forEach((c) => {
    const item = document.createElement('div');
    item.className = 'msgItem' + (c.user.id === curId ? ' on' : '');
    item.innerHTML = '<span class="avatar sm">' + MP.esc(String(c.user.name || '?').charAt(0)) + '</span>'
      + '<div class="mi"><div class="nm"><span>' + MP.esc(c.user.name) + '</span>'
      + '<time>' + MP.esc(MP.timeAgo(c.lastMessage?.at)) + '</time></div>'
      + '<div class="pv">' + MP.esc(c.lastMessage?.content || '') + '</div></div>';
    item.addEventListener('click', () => openConv(c.user.id));
    convBox.appendChild(item);
  });
}

// ---------------------------------------------------------------- 单个会话

function renderChat() {
  if (!curUser) {
    headBox.textContent = '';
    bodyBox.innerHTML = '<div class="empty">选一个会话开始聊天。</div>';
    return;
  }

  headBox.innerHTML = MP.esc(curUser.name)
    + '<small><a href="/qwq/' + encodeURIComponent(curUser.username) + '">查看主页</a></small>';

  bodyBox.textContent = '';
  if (!messages.length) {
    bodyBox.innerHTML = '<div class="empty">还没有消息，打个招呼吧。</div>';
    return;
  }

  messages.forEach((m) => {
    const wrap = document.createElement('div');
    wrap.className = 'bubble' + (m.fromMe ? ' me' : '');
    const av = document.createElement('span');
    av.className = 'avatar xs';
    av.textContent = String(m.fromMe ? me.name : curUser.name).charAt(0);
    const txt = document.createElement('div');
    txt.className = 'btxt';
    txt.textContent = m.content;
    const t = document.createElement('span');
    t.className = 'bt';
    t.textContent = MP.fmtTime(m.at);
    wrap.appendChild(av);
    wrap.appendChild(txt);
    wrap.appendChild(t);
    bodyBox.appendChild(wrap);
  });
  bodyBox.scrollTop = bodyBox.scrollHeight;
}

/** 打开与某人的会话：拉历史（服务端顺手把对方发来的标为已读）。 */
async function openConv(userId) {
  curId = userId;
  renderConvs();

  try {
    const data = await MP.api('/api/messages/' + userId);
    curUser = data.user;
    messages = data.messages;
    // 拉完顺便更新左侧列表的未读小红点
    const conv = convs.find((c) => c.user.id === userId);
    if (conv) conv.unread = 0;
    renderChat();
    refreshConvs();
  } catch (err) {
    curUser = null;
    messages = [];
    headBox.textContent = '';
    bodyBox.innerHTML = '<div class="empty">' + MP.esc(err.message) + '</div>';
  }
}

/** 只刷新左栏（不丢当前会话选中态）。 */
async function refreshConvs() {
  try {
    const data = await MP.api('/api/messages');
    convs = data.conversations;
    renderConvs();
  } catch { /* 静默：左栏刷新失败不影响正在看的会话 */ }
}

// ---------------------------------------------------------------- 发送

document.getElementById('chatForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || !curUser) return;

  input.disabled = true;
  try {
    const data = await MP.api('/api/messages/' + curUser.id, { method: 'POST', body: { content: text } });
    messages.push({ id: data.id, fromMe: true, content: text, at: data.at });
    input.value = '';
    renderChat();
    refreshConvs();
  } catch (err) {
    MP.toast(err.message);
  } finally {
    input.disabled = false;
    input.focus();
  }
});

// ---------------------------------------------------------------- 启动

(async () => {
  me = await MP.requireLogin();
  if (!me) return;
  if (TO === me.id) {
    bodyBox.innerHTML = '<div class="empty">不能和自己私信。</div>';
    return;
  }

  await refreshConvs();

  if (curId) {
    await openConv(curId);
  } else if (convs.length) {
    await openConv(convs[0].user.id);
  } else {
    renderChat();
  }
})();
</script>
</body>
</html>
