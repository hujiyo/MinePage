<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>私信 · MinePage</title>
<link rel="stylesheet" href="/_assets/style.css">
</head>
<body>
<main class="page wide">
  <h1>私信</h1>
  <p class="sub">和创作者直接沟通，注意保护个人隐私。</p>

  <div class="msgLayout" style="margin-top:16px">
    <div class="msgList" id="convList"></div>

    <div class="chatBox">
      <div class="chatHead" id="chatHead"></div>
      <div class="chatBody" id="chatBody"></div>
      <form class="chatFoot" id="chatForm">
        <input id="chatInput" type="text" maxlength="500" placeholder="输入消息，回车发送…" autocomplete="off">
        <button type="submit">发送</button>
      </form>
    </div>
  </div>
</main>

<script src="/_assets/app.js"></script>
<script>
MP.topbar({ active: 'messages' });

// TODO 后端对接：替换为 fetch('/api/messages')；会话数据后端接口已有，前端尚未接线
const CONVS = [];

let cur = 0;

const convBox = document.getElementById('convList');
const headBox = document.getElementById('chatHead');
const bodyBox = document.getElementById('chatBody');
const input = document.getElementById('chatInput');

/**
 * 重建左侧会话列表（当前会话加高亮），每行的预览取该会话最后一条消息的时间和内容。
 * 数据尚未接线（接口已有），没有会话时显示空态文案。
 */
function renderConvs() {
  convBox.textContent = '';
  if (!CONVS.length) {
    convBox.innerHTML = '<div class="empty">暂无会话</div>';
    return;
  }
  CONVS.forEach((c, i) => {
    const last = c.msgs[c.msgs.length - 1];
    const item = document.createElement('div');
    item.className = 'msgItem' + (i === cur ? ' on' : '');
    item.innerHTML = '<span class="avatar sm">' + MP.esc(c.user.name[0]) + '</span>'
      + '<div class="mi"><div class="nm"><span>' + MP.esc(c.user.name) + '</span>'
      + '<time>' + MP.esc(last.at) + '</time></div>'
      + '<div class="pv">' + MP.esc(last.text) + '</div></div>';
    item.addEventListener('click', () => { cur = i; renderConvs(); renderChat(); });
    convBox.appendChild(item);
  });
}

/**
 * 把当前会话的消息渲染进右侧聊天区，并把滚动条拖到底部。
 * 自己发的气泡靠 m.from === 'me' 判断，头像首字显示「我」；对方名字旁挂一个 /u/:username 的个人主页链接。
 * 没有选中会话（CONVS 为空或 cur 越界）时聊天区显示空态。
 */
function renderChat() {
  const c = CONVS[cur];
  if (!c) {
    headBox.textContent = '';
    bodyBox.innerHTML = '<div class="empty">暂无消息，选择一个会话开始聊天</div>';
    return;
  }
  headBox.innerHTML = MP.esc(c.user.name)
    + '<small><a href="/u/' + encodeURIComponent(c.user.username) + '">查看主页</a></small>';

  bodyBox.textContent = '';
  c.msgs.forEach((m) => {
    const wrap = document.createElement('div');
    wrap.className = 'bubble' + (m.from === 'me' ? ' me' : '');
    const av = document.createElement('span');
    av.className = 'avatar xs';
    av.textContent = (m.from === 'me' ? '我' : c.user.name)[0];
    const txt = document.createElement('div');
    txt.className = 'btxt';
    txt.textContent = m.text;
    const t = document.createElement('span');
    t.className = 'bt';
    t.textContent = m.at;
    wrap.appendChild(av);
    wrap.appendChild(txt);
    wrap.appendChild(t);
    bodyBox.appendChild(wrap);
  });
  bodyBox.scrollTop = bodyBox.scrollHeight;
}

document.getElementById('chatForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || !CONVS[cur]) return;
  // TODO 后端对接：POST /api/messages/:username { content }
  CONVS[cur].msgs.push({ from: 'me', text, at: '刚刚' });
  input.value = '';
  renderConvs();
  renderChat();
});

renderConvs();
renderChat();
</script>
</body>
</html>
