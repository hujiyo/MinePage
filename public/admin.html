<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理后台 · MinePage</title>
<link rel="stylesheet" href="/_assets/style.css">
</head>
<body>
<main class="page">
  <h1>管理后台</h1>
  <p class="sub" id="summary"></p>

  <section class="panel">
    <h2>用户</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>账号</th>
          <th>角色</th>
          <th>状态</th>
          <th>注册时间</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="usersBody"></tbody>
    </table>
  </section>

  <section class="panel">
    <h2>页面</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>名字</th>
          <th>归属</th>
          <th>大小</th>
          <th>状态</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="sitesBody"></tbody>
    </table>
  </section>

  <div id="msg" class="result" hidden></div>
</main>

<script src="/_assets/app.js"></script>
<script>
MP.topbar({ active: 'upload' });

const usersBody = document.getElementById('usersBody');
const sitesBody = document.getElementById('sitesBody');
const summary = document.getElementById('summary');
const msg = document.getElementById('msg');

let hideTimer = null;

/** 造一个只放文本的单元格 `<td>`（className 可选）；返回的元素还没挂进表格，由调用方 append。 */
function td(text, className) {
  const cell = document.createElement('td');
  if (className) cell.className = className;
  cell.textContent = text;
  return cell;
}

/** 造一个状态徽章 `<span class="badge">`；kind 是额外修饰类（'ok' / 'bad' / 'admin'），不传就是朴素徽章。 */
function badge(text, kind) {
  const el = document.createElement('span');
  el.className = 'badge' + (kind ? ' ' + kind : '');
  el.textContent = text;
  return el;
}

/** 造一个小按钮（固定 'tiny' 类 + 传入的额外类），handler 直接挂 click；返回的元素同样还没挂载。 */
function tinyButton(label, className, handler) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'tiny ' + className;
  button.textContent = label;
  button.addEventListener('click', handler);
  return button;
}

/** 后端给的 ISO 时间串转成本地时间显示；空值显示 '—'。 */
const fmtTime = (iso) => (iso ? new Date(iso).toLocaleString('zh-CN') : '—');
/** 文件大小的粗略显示：小于 1 KB 直接用 B，否则折算成 KB（只留一位小数）。 */
const fmtSize = (n) => (n < 1024 ? n + ' B' : (n / 1024).toFixed(1) + ' KB');

/**
 * 在页面底部的结果条里显示一条提示。
 * 副作用：3 秒后自动隐藏；连续调用会重置计时器，所以前一条提示会被后一条顶掉。
 */
function showMsg(ok, text) {
  msg.hidden = false;
  msg.className = 'result ' + (ok ? 'ok' : 'err');
  msg.textContent = text;

  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => { msg.hidden = true; }, 3000);
}

/**
 * 带统一错误处理的请求封装：HTTP 状态码非 2xx，或响应体里 ok !== true，都会抛错。
 * 返回的是整个响应体，管理接口的关键字段在 total / users / sites 上。
 * 注意：响应不是合法 JSON 时（例如网关直接回 HTML 错误页），异常来自 res.json() 本身，
 * 消息不是后端的 message，只会是一句 JSON 解析错误。
 */
async function api(url, options) {
  const res = await fetch(url, options);
  const data = await res.json();
  if (!res.ok || !data.ok) throw new Error(data.message || '请求失败');
  return data;
}

/**
 * 用 GET /api/admin/users 返回的用户数组重建用户表（先清空 tbody，空数组时显示一行「还没有用户」）。
 * 账号列优先显示 username，没有才退回 email；操作按钮按当前状态在「封禁 / 解封」之间切换。
 */
function renderUsers(users) {
  usersBody.textContent = '';

  if (users.length === 0) {
    const row = document.createElement('tr');
    const cell = td('还没有用户');
    cell.colSpan = 6;
    cell.className = 'empty';
    row.appendChild(cell);
    usersBody.appendChild(row);
    return;
  }

  users.forEach((user) => {
    const row = document.createElement('tr');
    row.appendChild(td(String(user.id)));
    row.appendChild(td(user.username || user.email, 'wrap'));

    const roleCell = document.createElement('td');
    roleCell.appendChild(badge(user.isAdmin ? '管理员' : '普通用户', user.isAdmin ? 'admin' : ''));
    row.appendChild(roleCell);

    const statusCell = document.createElement('td');
    statusCell.appendChild(
      badge(user.status === 'active' ? '正常' : '已封禁', user.status === 'active' ? 'ok' : 'bad'),
    );
    row.appendChild(statusCell);

    row.appendChild(td(fmtTime(user.createdAt)));

    const actions = document.createElement('td');
    actions.className = 'actions';
    actions.appendChild(
      tinyButton(
        user.status === 'active' ? '封禁' : '解封',
        user.status === 'active' ? 'danger' : 'ghost',
        () => setUserStatus(user.id, user.status === 'active' ? 'banned' : 'active'),
      ),
    );
    row.appendChild(actions);

    usersBody.appendChild(row);
  });
}

/**
 * 用 GET /api/admin/sites 返回的页面数组重建页面表（空数组时显示一行「还没有页面」）。
 * 归属列取 owner_username / owner_email，都没有时显示「（无归属）」；每行带「下线 / 恢复」和「删除」。
 * 删除按钮把整个 site 对象交给 removeSite —— 那边要用 site.name 拼确认文案，所以不能只传 id。
 */
function renderSites(sites) {
  sitesBody.textContent = '';

  if (sites.length === 0) {
    const row = document.createElement('tr');
    const cell = td('还没有页面');
    cell.colSpan = 6;
    cell.className = 'empty';
    row.appendChild(cell);
    sitesBody.appendChild(row);
    return;
  }

  sites.forEach((site) => {
    const row = document.createElement('tr');
    row.appendChild(td(String(site.id)));

    const nameCell = document.createElement('td');
    const link = document.createElement('a');
    link.href = '/' + site.name;
    link.target = '_blank';
    link.rel = 'noopener';
    link.textContent = '/' + site.name;
    nameCell.appendChild(link);
    row.appendChild(nameCell);

    row.appendChild(td(site.owner_username || site.owner_email || '（无归属）', 'wrap'));
    row.appendChild(td(fmtSize(site.size)));

    const statusCell = document.createElement('td');
    statusCell.appendChild(
      badge(site.status === 'active' ? '正常' : '已下线', site.status === 'active' ? 'ok' : 'bad'),
    );
    row.appendChild(statusCell);

    const actions = document.createElement('td');
    actions.className = 'actions';
    actions.appendChild(
      tinyButton(
        site.status === 'active' ? '下线' : '恢复',
        'ghost',
        () => setSiteStatus(site.id, site.status === 'active' ? 'offline' : 'active'),
      ),
    );
    actions.appendChild(document.createTextNode(' '));
    actions.appendChild(tinyButton('删除', 'danger', () => removeSite(site)));
    row.appendChild(actions);

    sitesBody.appendChild(row);
  });
}

/**
 * 封禁 / 解封一个用户：POST /api/admin/users/:id/status。
 * 服务端只认 'active' 和 'banned'，其它值一律当 'active'；也会拒绝管理员封自己。
 * 成功后整页重拉（loadAll），失败把后端消息交给 showMsg。
 */
async function setUserStatus(id, status) {
  try {
    await api('/api/admin/users/' + id + '/status', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: status }),
    });
    showMsg(true, '已更新');
    await loadAll();
  } catch (err) {
    showMsg(false, err.message);
  }
}

/**
 * 下线 / 恢复一个页面：POST /api/admin/sites/:id/status。
 * 服务端只认 'active' 和 'offline'，其它值一律当 'active'；成功后整页重拉（loadAll）。
 * 「下线」只是状态标记，页面和文件都还在，随时可以恢复。
 */
async function setSiteStatus(id, status) {
  try {
    await api('/api/admin/sites/' + id + '/status', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: status }),
    });
    showMsg(true, '已更新');
    await loadAll();
  } catch (err) {
    showMsg(false, err.message);
  }
}

/**
 * 删除一个页面：DELETE /api/admin/sites/:id，删之前先弹 confirm。
 * 只是前端确认，后端不做二次询问，删掉的页面和文件都找不回来。
 */
async function removeSite(site) {
  if (!confirm('确定删除 /' + site.name + ' 吗？删了就找不回来了。')) return;

  try {
    await api('/api/admin/sites/' + site.id, { method: 'DELETE' });
    showMsg(true, '已删除 /' + site.name);
    await loadAll();
  } catch (err) {
    showMsg(false, err.message);
  }
}

/**
 * 拉取后台概览并整体刷新：GET /api/me、/api/admin/users、/api/admin/sites 三个并发，
 * 写顶部统计条和两张表。启动时调一次，之后每次改动成功都会再调一次。
 * 陷阱：/api/me 对匿名请求也返回 200 + user:null，真正拦住非管理员的是后两个接口的
 * 401 / 403，它们让 api() 抛错，结果只剩一条错误提示、两张表保持空白。
 */
async function loadAll() {
  try {
    const results = await Promise.all([
      api('/api/me'),
      api('/api/admin/users'),
      api('/api/admin/sites'),
    ]);

    // results[0] 是 /api/me，用于校验登录态
    const users = results[1];
    const sites = results[2];

    summary.textContent = users.total + ' 个用户 · ' + sites.total + ' 个页面';

    renderUsers(users.users);
    renderSites(sites.sites);
  } catch (err) {
    showMsg(false, err.message);
  }
}

loadAll();
</script>
</body>
</html>
