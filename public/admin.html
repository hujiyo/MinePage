<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理后台 · MinePage</title>
<link rel="stylesheet" href="/_assets/style.css">
</head>
<body>
<main class="page">
  <h1>管理后台</h1>
  <p class="sub" id="summary"></p>

  <section class="panel">
    <h2>首页轮播</h2>
    <p class="muted" style="font-size:13px;margin:0 0 14px">
      最多 <b id="bannerMax">10</b> 个位置，按列表顺序自动轮播。标题和副标题留空就跟随站点自己的标题和简介；
      站点被删除或下线时，这一位自动从首页消失。
    </p>

    <div id="bannersBox" class="bannerRows"></div>

    <form id="bannerForm" novalidate style="margin-top:14px">
      <div class="row" style="gap:10px;flex-wrap:wrap;align-items:flex-end">
        <label class="field" style="flex:1;min-width:240px;margin:0">
          <span class="label">页面</span>
          <select id="bannerSite"></select>
        </label>
        <label class="field" style="flex:1;min-width:180px;margin:0">
          <span class="label">标题（可空）</span>
          <input id="bannerTitle" type="text" maxlength="120" placeholder="跟随站点标题">
        </label>
        <label class="field" style="flex:1;min-width:180px;margin:0">
          <span class="label">副标题（可空）</span>
          <input id="bannerSubtitle" type="text" maxlength="200" placeholder="跟随站点简介">
        </label>
        <button type="submit" id="bannerAdd">添加轮播位</button>
      </div>
    </form>
  </section>

  <section class="panel">
    <h2>用户</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>账号</th>
          <th>角色</th>
          <th>状态</th>
          <th>注册时间</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="usersBody"></tbody>
    </table>
  </section>

  <section class="panel">
    <h2>页面</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>名字</th>
          <th>归属</th>
          <th>大小</th>
          <th>状态</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="sitesBody"></tbody>
    </table>
  </section>

  <div id="msg" class="result" hidden></div>
</main>

<script src="/_assets/app.js"></script>
<script>
MP.topbar({ active: 'create' });

const usersBody = document.getElementById('usersBody');
const sitesBody = document.getElementById('sitesBody');
const summary = document.getElementById('summary');
const msg = document.getElementById('msg');

let hideTimer = null;

/** 造一个只放文本的单元格 `<td>`（className 可选）；返回的元素还没挂进表格，由调用方 append。 */
function td(text, className) {
  const cell = document.createElement('td');
  if (className) cell.className = className;
  cell.textContent = text;
  return cell;
}

/** 造一个状态徽章 `<span class="badge">`；kind 是额外修饰类（'ok' / 'bad' / 'admin'），不传就是朴素徽章。 */
function badge(text, kind) {
  const el = document.createElement('span');
  el.className = 'badge' + (kind ? ' ' + kind : '');
  el.textContent = text;
  return el;
}

/** 造一个小按钮（固定 'tiny' 类 + 传入的额外类），handler 直接挂 click；返回的元素同样还没挂载。 */
function tinyButton(label, className, handler) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'tiny ' + className;
  button.textContent = label;
  button.addEventListener('click', handler);
  return button;
}

/** 后端给的 ISO 时间串转成本地时间显示；空值显示 '—'。 */
const fmtTime = (iso) => (iso ? new Date(iso).toLocaleString('zh-CN') : '—');
/** 文件大小的粗略显示：小于 1 KB 直接用 B，否则折算成 KB（只留一位小数）。 */
const fmtSize = (n) => (n < 1024 ? n + ' B' : (n / 1024).toFixed(1) + ' KB');

/**
 * 在页面底部的结果条里显示一条提示。
 * 副作用：3 秒后自动隐藏；连续调用会重置计时器，所以前一条提示会被后一条顶掉。
 */
function showMsg(ok, text) {
  msg.hidden = false;
  msg.className = 'result ' + (ok ? 'ok' : 'err');
  msg.textContent = text;

  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => { msg.hidden = true; }, 3000);
}

/**
 * 带统一错误处理的请求封装：HTTP 状态码非 2xx，或响应体里 ok !== true，都会抛错。
 * 返回的是整个响应体，管理接口的关键字段在 total / users / sites 上。
 * 注意：响应不是合法 JSON 时（例如网关直接回 HTML 错误页），异常来自 res.json() 本身，
 * 消息不是后端的 message，只会是一句 JSON 解析错误。
 */
async function api(url, options) {
  const res = await fetch(url, options);
  const data = await res.json();
  if (!res.ok || !data.ok) throw new Error(data.message || '请求失败');
  return data;
}

/**
 * 用 GET /api/admin/users 返回的用户数组重建用户表（先清空 tbody，空数组时显示一行「还没有用户」）。
 * 账号列优先显示 username，没有才退回 email；操作按钮按当前状态在「封禁 / 解封」之间切换。
 */
function renderUsers(users) {
  usersBody.textContent = '';

  if (users.length === 0) {
    const row = document.createElement('tr');
    const cell = td('还没有用户');
    cell.colSpan = 6;
    cell.className = 'empty';
    row.appendChild(cell);
    usersBody.appendChild(row);
    return;
  }

  users.forEach((user) => {
    const row = document.createElement('tr');
    row.appendChild(td(String(user.id)));
    row.appendChild(td(user.username || user.email, 'wrap'));

    const roleCell = document.createElement('td');
    roleCell.appendChild(badge(user.isAdmin ? '管理员' : '普通用户', user.isAdmin ? 'admin' : ''));
    row.appendChild(roleCell);

    const statusCell = document.createElement('td');
    statusCell.appendChild(
      badge(user.status === 'active' ? '正常' : '已封禁', user.status === 'active' ? 'ok' : 'bad'),
    );
    row.appendChild(statusCell);

    row.appendChild(td(fmtTime(user.createdAt)));

    const actions = document.createElement('td');
    actions.className = 'actions';
    actions.appendChild(
      tinyButton(
        user.status === 'active' ? '封禁' : '解封',
        user.status === 'active' ? 'danger' : 'ghost',
        () => setUserStatus(user.id, user.status === 'active' ? 'banned' : 'active'),
      ),
    );
    row.appendChild(actions);

    usersBody.appendChild(row);
  });
}

/**
 * 用 GET /api/admin/sites 返回的页面数组重建页面表（空数组时显示一行「还没有页面」）。
 * 归属列取 owner_username / owner_email，都没有时显示「（无归属）」；每行带「下线 / 恢复」和「删除」。
 * 删除按钮把整个 site 对象交给 removeSite —— 那边要用 site.name 拼确认文案，所以不能只传 id。
 */
function renderSites(sites) {
  sitesBody.textContent = '';

  if (sites.length === 0) {
    const row = document.createElement('tr');
    const cell = td('还没有页面');
    cell.colSpan = 6;
    cell.className = 'empty';
    row.appendChild(cell);
    sitesBody.appendChild(row);
    return;
  }

  sites.forEach((site) => {
    const row = document.createElement('tr');
    row.appendChild(td(String(site.id)));

    const nameCell = document.createElement('td');
    const link = document.createElement('a');
    link.href = '/qwq/' + encodeURIComponent(site.owner_username) + '/' + encodeURIComponent(site.name);
    link.target = '_blank';
    link.rel = 'noopener';
    link.textContent = '/' + site.owner_username + '/' + site.name;
    nameCell.appendChild(link);
    row.appendChild(nameCell);

    row.appendChild(td(site.owner_username || site.owner_email || '（无归属）', 'wrap'));
    row.appendChild(td(fmtSize(site.size)));

    const statusCell = document.createElement('td');
    statusCell.appendChild(
      badge(site.status === 'active' ? '正常' : '已下线', site.status === 'active' ? 'ok' : 'bad'),
    );
    row.appendChild(statusCell);

    const actions = document.createElement('td');
    actions.className = 'actions';
    actions.appendChild(
      tinyButton(
        site.status === 'active' ? '下线' : '恢复',
        'ghost',
        () => setSiteStatus(site.id, site.status === 'active' ? 'offline' : 'active'),
      ),
    );
    actions.appendChild(document.createTextNode(' '));
    actions.appendChild(tinyButton('删除', 'danger', () => removeSite(site)));
    row.appendChild(actions);

    sitesBody.appendChild(row);
  });
}

/**
 * 封禁 / 解封一个用户：POST /api/admin/users/:id/status。
 * 服务端只认 'active' 和 'banned'，其它值一律当 'active'；也会拒绝管理员封自己。
 * 成功后整页重拉（loadAll），失败把后端消息交给 showMsg。
 */
async function setUserStatus(id, status) {
  try {
    await api('/api/admin/users/' + id + '/status', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: status }),
    });
    showMsg(true, '已更新');
    await loadAll();
  } catch (err) {
    showMsg(false, err.message);
  }
}

/**
 * 下线 / 恢复一个页面：POST /api/admin/sites/:id/status。
 * 服务端只认 'active' 和 'offline'，其它值一律当 'active'；成功后整页重拉（loadAll）。
 * 「下线」只是状态标记，页面和文件都还在，随时可以恢复。
 */
async function setSiteStatus(id, status) {
  try {
    await api('/api/admin/sites/' + id + '/status', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: status }),
    });
    showMsg(true, '已更新');
    await loadAll();
  } catch (err) {
    showMsg(false, err.message);
  }
}

/**
 * 删除一个页面：DELETE /api/admin/sites/:id，删之前先弹 confirm。
 * 只是前端确认，后端不做二次询问，删掉的页面和文件都找不回来。
 */
async function removeSite(site) {
  if (!confirm('确定删除 /' + site.owner_username + '/' + site.name + ' 吗？删了就找不回来了。')) return;

  try {
    await api('/api/admin/sites/' + site.id, { method: 'DELETE' });
    showMsg(true, '已删除 /' + site.owner_username + '/' + site.name);
    await loadAll();
  } catch (err) {
    showMsg(false, err.message);
  }
}

// ---------------------------------------------------------------- 首页轮播位

const bannersBox = document.getElementById('bannersBox');
const bannerForm = document.getElementById('bannerForm');
const bannerSite = document.getElementById('bannerSite');
const bannerTitle = document.getElementById('bannerTitle');
const bannerSubtitle = document.getElementById('bannerSubtitle');
const bannerAdd = document.getElementById('bannerAdd');
const bannerMax = document.getElementById('bannerMax');

let bannerState = { banners: [], sites: [], max: 10 };

/** 下拉里每个站点一行：/用户名/站名。站点很多时浏览器自带的筛选够用。 */
function renderBannerSiteOptions(sites) {
  bannerSite.textContent = '';
  if (!sites.length) {
    const opt = document.createElement('option');
    opt.value = '';
    opt.textContent = '还没有可选的在线页面';
    bannerSite.appendChild(opt);
    bannerAdd.disabled = true;
    return;
  }
  bannerAdd.disabled = false;
  sites.forEach((s) => {
    const opt = document.createElement('option');
    opt.value = String(s.id);
    opt.textContent = s.label + (s.title ? ' · ' + s.title : '');
    bannerSite.appendChild(opt);
  });
}

/** 一行一个轮播位：顺序、指向的页面、标题覆盖、启用开关、上移下移、删除。 */
function renderBanners() {
  bannersBox.textContent = '';
  bannerMax.textContent = bannerState.max;

  if (!bannerState.banners.length) {
    bannersBox.innerHTML = '<div class="empty" style="padding:16px 0">还没有配置轮播位，首页不会显示轮播。</div>';
    return;
  }

  bannerState.banners.forEach((b, i) => {
    const row = document.createElement('div');
    row.className = 'bannerRow';

    const order = document.createElement('span');
    order.className = 'bOrder';
    order.textContent = String(i + 1);
    row.appendChild(order);

    const main = document.createElement('div');
    main.className = 'bMain';
    const link = document.createElement('a');
    link.href = b.site.url;
    link.target = '_blank';
    link.rel = 'noopener';
    link.textContent = '/' + b.site.owner + '/' + b.site.name;
    main.appendChild(link);

    const meta = document.createElement('div');
    meta.className = 'muted';
    meta.style.fontSize = '12px';
    meta.textContent = (b.title || b.site.title || b.site.name)
      + (b.subtitle || b.site.description ? ' · ' + (b.subtitle || b.site.description) : '')
      + (b.site.status === 'active' ? '' : ' · 站点已下线，首页不显示');
    main.appendChild(meta);
    row.appendChild(main);

    const enabledWrap = document.createElement('label');
    enabledWrap.className = 'bToggle';
    const toggle = document.createElement('input');
    toggle.type = 'checkbox';
    toggle.checked = b.enabled;
    toggle.addEventListener('change', () => saveBanner(b, { enabled: toggle.checked }));
    enabledWrap.appendChild(toggle);
    enabledWrap.appendChild(document.createTextNode(' 启用'));
    row.appendChild(enabledWrap);

    const actions = document.createElement('div');
    actions.className = 'row';
    actions.style.cssText = 'gap:6px;flex:none';

    const up = tinyButton('↑', 'ghost', () => moveBanner(i, -1));
    up.disabled = i === 0;
    const down = tinyButton('↓', 'ghost', () => moveBanner(i, 1));
    down.disabled = i === bannerState.banners.length - 1;
    actions.appendChild(up);
    actions.appendChild(down);
    actions.appendChild(tinyButton('删除', 'danger', () => removeBanner(b)));
    row.appendChild(actions);

    bannersBox.appendChild(row);
  });
}

async function loadBanners() {
  const data = await api('/api/admin/banners');
  bannerState = data;
  renderBannerSiteOptions(data.sites);
  renderBanners();
}

/** 改一条：整条 PUT，字段原样回传（服务端只覆盖传了的字段）。 */
async function saveBanner(banner, patch) {
  try {
    await api('/api/admin/banners/' + banner.id, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        siteId: banner.siteId,
        title: banner.title,
        subtitle: banner.subtitle,
        sortOrder: banner.sortOrder,
        enabled: banner.enabled,
        ...patch,
      }),
    });
    showMsg(true, '已保存');
    await loadBanners();
  } catch (err) {
    showMsg(false, err.message);
  }
}

/** 上移 / 下移：交换 sortOrder 后逐条保存。 */
async function moveBanner(index, delta) {
  const target = index + delta;
  if (target < 0 || target >= bannerState.banners.length) return;

  const list = bannerState.banners.slice();
  [list[index], list[target]] = [list[target], list[index]];

  try {
    await Promise.all(list.map((b, i) => api('/api/admin/banners/' + b.id, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        siteId: b.siteId, title: b.title, subtitle: b.subtitle, sortOrder: i, enabled: b.enabled,
      }),
    })));
    await loadBanners();
  } catch (err) {
    showMsg(false, err.message);
  }
}

async function removeBanner(banner) {
  if (!confirm('确定删除这一位 /' + banner.site.owner + '/' + banner.site.name + ' 的轮播吗？')) return;
  try {
    await api('/api/admin/banners/' + banner.id, { method: 'DELETE' });
    showMsg(true, '已删除这一位');
    await loadBanners();
  } catch (err) {
    showMsg(false, err.message);
  }
}

bannerForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const siteId = Number(bannerSite.value);
  if (!siteId) { showMsg(false, '先选一个页面'); return; }

  bannerAdd.disabled = true;
  try {
    await api('/api/admin/banners', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        siteId,
        title: bannerTitle.value,
        subtitle: bannerSubtitle.value,
        sortOrder: bannerState.banners.length,
        enabled: true,
      }),
    });
    bannerTitle.value = '';
    bannerSubtitle.value = '';
    showMsg(true, '已添加轮播位');
    await loadBanners();
  } catch (err) {
    showMsg(false, err.message);
  } finally {
    bannerAdd.disabled = false;
  }
});

// ---------------------------------------------------------------- 用户 / 站点

/**
 * 拉取后台概览并整体刷新：GET /api/me、/api/admin/users、/api/admin/sites 三个并发，
 * 写顶部统计条和两张表。启动时调一次，之后每次改动成功都会再调一次。
 * 陷阱：/api/me 对匿名请求也返回 200 + user:null，真正拦住非管理员的是后两个接口的
 * 401 / 403，它们让 api() 抛错，结果只剩一条错误提示、两张表保持空白。
 */
async function loadAll() {
  try {
    const results = await Promise.all([
      api('/api/me'),
      api('/api/admin/users'),
      api('/api/admin/sites'),
    ]);

    // results[0] 是 /api/me，用于校验登录态
    const users = results[1];
    const sites = results[2];

    summary.textContent = users.total + ' 个用户 · ' + sites.total + ' 个页面';

    renderUsers(users.users);
    renderSites(sites.sites);
    await loadBanners();
  } catch (err) {
    showMsg(false, err.message);
  }
}

loadAll();
</script>
</body>
</html>
