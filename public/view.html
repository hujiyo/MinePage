<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>观看 · MinePage</title>
<link rel="stylesheet" href="/_assets/style.css">
</head>
<body>
<!-- 全屏宿主：对方的个人网页铺满整个视口，平台不占用正文区域 -->
<div class="viewer" id="viewer">
  <iframe id="frame" referrerpolicy="no-referrer" title="站点内容"></iframe>
</div>

<!-- 站点不存在时的占位 -->
<div class="viewMissing" id="missing" hidden>
  <div class="panel center" style="max-width:380px">
    <h1>没有这个站点</h1>
    <p class="sub" style="margin-bottom:16px">它可能还没发布，或者站名不对。</p>
    <a href="/"><button type="button">回首页逛逛</button></a>
  </div>
</div>

<!-- 底部社区吸附栏（结构由脚本生成） -->
<div class="snapbar" id="snapbar" hidden></div>
<!-- 底栏收起后只剩左下角的小三角形 -->
<button type="button" class="snapHandle" id="snapHandle"></button>

<!-- 评论面板：可拖拽调高，不做暗化遮罩，两边都能照常滚动 -->
<div class="sheet" id="sheet">
  <div class="sheetGrip" id="sheetGrip" title="按住上下拖动，调整评论面板高度"><i></i></div>
  <div class="sheetHead">
    <b>评论 <span class="muted" id="cHead"></span></b>
    <div class="row" style="gap:10px;flex-wrap:nowrap">
      <span class="hint" id="toAuthor" style="font-size:13px"></span>
      <button type="button" class="ghost tiny" id="sheetClose">收起</button>
    </div>
  </div>
  <div class="sheetBody">
    <form id="cForm" style="padding-top:12px">
      <textarea id="cInput" class="area" maxlength="500" placeholder="友善评论，最多 500 字…"></textarea>
      <div class="row" style="justify-content:space-between;margin-top:8px">
        <span class="hint">评论会通知作者。</span>
        <button type="submit">发表评论</button>
      </div>
    </form>
    <div id="cList"></div>
    <div id="cEmpty" class="empty" hidden>还没有评论，来抢沙发。</div>
  </div>
</div>

<script src="/_assets/app.js"></script>
<script>
// /view/:用户名/:站名  ——  全屏看对方的网页，社区功能收进底部吸附栏
MP.topbar({ collapse: true });

const PARTS = location.pathname.replace(/^\/view\//, '').replace(/\/+$/, '').split('/');
const OWNER = decodeURIComponent(PARTS[0] || '');
const SITE = decodeURIComponent(PARTS[1] || '');

const viewer = document.getElementById('viewer');
const missing = document.getElementById('missing');
const snapbar = document.getElementById('snapbar');
const snapHandle = document.getElementById('snapHandle');
const sheet = document.getElementById('sheet');
const sheetGrip = document.getElementById('sheetGrip');
const cHead = document.getElementById('cHead');
const cForm = document.getElementById('cForm');
const cInput = document.getElementById('cInput');
const cList = document.getElementById('cList');
const cEmpty = document.getElementById('cEmpty');

let site = null;        // { name, title, description, tag, status, author: {id,name,username} }
let stats = { views: 0, likes: 0, favorites: 0, comments: 0, liked: false, favorited: false };
let following = false;
let comments = [];
let me = null;

/** 站点接口前缀：/api/sites/<用户名>/<站名> */
const API = '/api/sites/' + encodeURIComponent(OWNER) + '/' + encodeURIComponent(SITE);

/* ---------------------------------------------------------------- 播放区 */

function renderFrame() {
  document.title = (site.title || site.name) + ' · MinePage';
  // 站点页自身带 sandbox CSP；这里只做链接目标，不加 allow-same-origin
  document.getElementById('frame').src =
    '/qwq/' + encodeURIComponent(OWNER) + '/' + encodeURIComponent(SITE) + '/';
}

/* ---------------------------------------------------------------- 底部吸附栏 */

const SNAP_KEY = 'mp_snap_collapsed';
let snapCollapsed = MP.readFlag(SNAP_KEY);
let commentBtn = null;   // 底部栏「评论」按钮，发评论后同步文字与悬浮提示

// 收起后整条栏隐藏，只在左下角留一个小三角形；点它重新展开
snapHandle.innerHTML = MP.icon('triUp', null, 14);

function applySnap() {
  document.body.classList.toggle('snap-collapsed', snapCollapsed);
  snapHandle.title = snapCollapsed ? '展开导航栏' : '收起导航栏';
}

snapHandle.addEventListener('click', () => {
  snapCollapsed = false;
  MP.writeFlag(SNAP_KEY, false);
  applySnap();
});

/** 生成一个吸附栏按钮 / 链接。 */
function makeItem(ic, text, opt) {
  const o = opt || {};
  const el = document.createElement(o.href ? 'a' : 'button');
  el.className = 'snapItem' + (o.on ? ' on' : '');
  if (o.href) el.href = o.href;
  else el.type = 'button';
  el.title = o.title || text;
  el.innerHTML = MP.icon(ic) + '<span class="sText">' + MP.esc(text) + '</span>';
  if (o.click) el.addEventListener('click', o.click);
  return el;
}

/** 需要登录的动作统一走这里：未登录先跳登录页。 */
async function needLogin() {
  if (me) return true;
  MP.toast('登录后才能互动');
  location.href = '/login?next=' + encodeURIComponent(location.pathname);
  return false;
}

/** 重新渲染底部吸附栏（互动状态变化时调用）。 */
function renderBar() {
  if (!site) return;
  const a = site.author;
  const isOwn = Boolean(me && me.id === a.id);

  snapbar.textContent = '';

  // 左组：分享 / 赞 / 收藏
  const gLeft = document.createElement('div');
  gLeft.className = 'sgroup';
  gLeft.appendChild(makeItem('share', '分享', {
    click: () => {
      const url = location.href;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(
          () => MP.toast('链接已复制，去分享给朋友吧'),
          () => MP.toast(url),
        );
      } else {
        MP.toast(url);
      }
    },
  }));
  gLeft.appendChild(makeItem('like', '赞 ' + MP.fmtNum(stats.likes), {
    on: stats.liked,
    click: async () => {
      if (!(await needLogin())) return;
      try {
        const data = await MP.api(API + '/like', { method: stats.liked ? 'DELETE' : 'POST' });
        stats.liked = data.liked;
        stats.likes = data.likes;
        renderBar();
      } catch (err) { MP.toast(err.message); }
    },
  }));
  gLeft.appendChild(makeItem('coin', '投币', {
    // 后端还没有投币接口（见 todo-后端.md），先禁用，别做成假按钮
    title: '投币功能还没上线',
    click: () => MP.toast('投币还没开放'),
  }));
  gLeft.appendChild(makeItem('fav', '收藏 ' + MP.fmtNum(stats.favorites), {
    on: stats.favorited,
    click: async () => {
      if (!(await needLogin())) return;
      try {
        const data = await MP.api(API + '/favorite', { method: stats.favorited ? 'DELETE' : 'POST' });
        stats.favorited = data.favorited;
        stats.favorites = data.favorites;
        renderBar();
      } catch (err) { MP.toast(err.message); }
    },
  }));

  // 中间：收起小三角形（点击整条栏收起，只在左下角留一个小三角形）
  const mid = document.createElement('button');
  mid.type = 'button';
  mid.className = 'snapMid';
  mid.title = '收起导航栏';
  mid.innerHTML = MP.icon('triUp', null, 15);
  mid.addEventListener('click', () => {
    snapCollapsed = true;
    MP.writeFlag(SNAP_KEY, true);
    applySnap();
  });

  // 右组：评论 / 博主头像 / 关注 / 私信
  const gRight = document.createElement('div');
  gRight.className = 'sgroup';
  const btnComment = makeItem('comment', '评论 ' + MP.fmtNum(stats.comments), { click: openSheet });
  commentBtn = btnComment;
  gRight.appendChild(btnComment);

  const avEl = document.createElement('a');
  avEl.className = 'snapItem';
  avEl.href = '/qwq/' + encodeURIComponent(a.username);
  avEl.title = a.name + ' 的主页';
  avEl.innerHTML = '<span class="avatar xs">' + MP.esc(String(a.name || '?').charAt(0)) + '</span>'
    + '<span class="sText">' + MP.esc(a.name) + '</span>';
  gRight.appendChild(avEl);

  if (!isOwn) {
    gRight.appendChild(makeItem(following ? 'check' : 'plus', following ? '已关注' : '关注', {
      on: following,
      click: async () => {
        if (!(await needLogin())) return;
        try {
          const data = await MP.api('/api/users/' + a.id + '/follow', {
            method: following ? 'DELETE' : 'POST',
          });
          following = data.following;
          renderBar();
          MP.toast(following ? '已关注 ' + a.name : '已取消关注');
        } catch (err) { MP.toast(err.message); }
      },
    }));
  }
  gRight.appendChild(makeItem('message', '私信', {
    href: isOwn ? '/messages' : '/messages?to=' + a.id,
  }));

  snapbar.appendChild(gLeft);
  snapbar.appendChild(mid);
  snapbar.appendChild(gRight);
  snapbar.hidden = false;
  applySnap();
}

/* ---------------------------------------------------------------- 评论面板 */

let sheetOpened = false;

function openSheet() {
  sheet.classList.add('open');
  sheetOpened = true;
}

function closeSheet() {
  sheet.classList.remove('open');
  sheetOpened = false;
}

document.getElementById('sheetClose').addEventListener('click', closeSheet);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && sheetOpened) closeSheet(); });

// 拖拽上沿调高：最小约等于底栏高度（只露面板头部），最大铺满整屏
const SHEET_MIN_H = 58;
let gripFrom = null;

function setSheetHeight(px) {
  sheet.style.height = Math.min(Math.max(px, SHEET_MIN_H), window.innerHeight) + 'px';
}

sheetGrip.addEventListener('pointerdown', (e) => {
  gripFrom = { y: e.clientY, h: sheet.getBoundingClientRect().height };
  sheet.classList.add('dragging');
  sheetGrip.setPointerCapture(e.pointerId);
  e.preventDefault();
});

sheetGrip.addEventListener('pointermove', (e) => {
  if (!gripFrom) return;
  setSheetHeight(gripFrom.h + (gripFrom.y - e.clientY));
});

['pointerup', 'pointercancel'].forEach((type) => {
  sheetGrip.addEventListener(type, (e) => {
    if (!gripFrom) return;
    gripFrom = null;
    sheet.classList.remove('dragging');
    if (sheetGrip.hasPointerCapture(e.pointerId)) sheetGrip.releasePointerCapture(e.pointerId);
  });
});

// 窗口变小时把面板压回视口内
window.addEventListener('resize', () => {
  if (sheet.style.height) setSheetHeight(parseFloat(sheet.style.height));
});

function authorNode(author) {
  const a = document.createElement('a');
  a.href = '/qwq/' + encodeURIComponent(author.username);
  a.textContent = author.username;
  return a;
}

function renderComment(c, isTop) {
  const div = document.createElement('div');
  div.className = 'comment';

  const head = document.createElement('div');
  head.className = 'cHead';
  const who = document.createElement('span');
  who.className = 'who';
  who.appendChild(authorNode(c.author));
  head.appendChild(who);

  // 回复：显示在回复谁
  if (c.replyTo != null) {
    const parent = comments.find((x) => x.id === c.replyTo);
    if (parent) {
      const at = document.createElement('span');
      at.className = 'at';
      at.textContent = '回复 @' + parent.author.username;
      head.appendChild(at);
    }
  }

  const time = document.createElement('span');
  time.className = 'time';
  time.textContent = MP.timeAgo(c.createdAt);
  head.appendChild(time);
  div.appendChild(head);

  const body = document.createElement('div');
  body.className = 'cBody';
  body.textContent = c.content;
  div.appendChild(body);

  const ops = document.createElement('div');
  ops.className = 'cOps';

  // 回复按钮：只挂在顶层评论上（回复的回复归到同一父评论）
  if (isTop && me) {
    const replyBtn = document.createElement('button');
    replyBtn.type = 'button';
    replyBtn.textContent = '回复';
    replyBtn.addEventListener('click', () => toggleReplyBox(div, c));
    ops.appendChild(replyBtn);
  }

  // 删除：作者本人或管理员（与后端 handleSiteCommentDelete 的判定一致）
  const mine = me && (c.author.id === me.id || me.isAdmin);
  if (mine) {
    const delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.className = 'del';
    delBtn.textContent = '删除';
    delBtn.addEventListener('click', async () => {
      if (!confirm('确定删除这条评论吗？')) return;
      try {
        await MP.api(API + '/comments/' + c.id, { method: 'DELETE' });
        comments = comments.filter((x) => x.id !== c.id && x.replyTo !== c.id);
        renderComments();
        MP.toast('已删除');
      } catch (err) { MP.toast(err.message); }
    });
    ops.appendChild(delBtn);
  }

  if (ops.children.length > 0) div.appendChild(ops);

  // 挂上一级回复
  if (isTop) {
    const replies = comments.filter((r) => r.replyTo != null && rootOf(r).id === c.id);
    if (replies.length > 0) {
      const box = document.createElement('div');
      box.className = 'replies';
      replies.forEach((r) => box.appendChild(renderComment(r, false)));
      div.appendChild(box);
    }
  }

  return div;
}

/** 沿 replyTo 往上找到顶层评论。 */
function rootOf(c) {
  let cur = c;
  const seen = new Set();
  while (cur.replyTo != null && !seen.has(cur.replyTo)) {
    seen.add(cur.replyTo);
    const parent = comments.find((x) => x.id === cur.replyTo);
    if (!parent) break;
    cur = parent;
  }
  return cur;
}

/** 在评论下面展开 / 收起回复输入框。 */
function toggleReplyBox(commentDiv, parent) {
  const existing = commentDiv.querySelector('.replyBox');
  if (existing) { existing.remove(); return; }

  // 必须是 form：type=submit 按钮与 submit 事件只对 form 生效
  const box = document.createElement('form');
  box.className = 'replyBox';

  const ta = document.createElement('textarea');
  ta.className = 'area';
  ta.maxLength = 500;
  ta.placeholder = '回复 @' + parent.author.username + '（最多 500 字）…';
  box.appendChild(ta);

  const row = document.createElement('div');
  row.className = 'cRow';
  row.style.cssText = 'display:flex;justify-content:flex-end;gap:8px;margin-top:8px';
  const cancel = document.createElement('button');
  cancel.type = 'button';
  cancel.className = 'ghost tiny';
  cancel.textContent = '取消';
  cancel.addEventListener('click', () => box.remove());
  const submit = document.createElement('button');
  submit.type = 'submit';
  submit.textContent = '回复';
  row.appendChild(cancel);
  row.appendChild(submit);
  box.appendChild(row);

  box.addEventListener('submit', async (e) => {
    e.preventDefault();
    const content = ta.value.trim();
    if (content === '') return;
    submit.disabled = true;
    try {
      const data = await MP.api(API + '/comments', {
        method: 'POST',
        body: { content, replyTo: parent.id },
      });
      comments.push(data.comment);
      renderComments();
      MP.toast('回复已发布');
    } catch (err) {
      MP.toast(err.message);
      submit.disabled = false;
    }
  });

  commentDiv.appendChild(box);
  ta.focus();
}

function renderComments() {
  cList.textContent = '';
  const tops = comments.filter((c) => c.replyTo == null);
  cHead.textContent = comments.length;
  cEmpty.hidden = comments.length > 0;
  tops.forEach((c) => cList.appendChild(renderComment(c, true)));

  // 底部栏上的评论数同步（可见文字 + 悬浮提示）
  stats.comments = comments.length;
  if (commentBtn) {
    commentBtn.title = '评论 ' + MP.fmtNum(stats.comments);
    const text = commentBtn.querySelector('.sText');
    if (text) text.textContent = commentBtn.title;
  }
}

cForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const content = cInput.value.trim();
  if (content === '') return;
  if (!(await needLogin())) return;

  const submit = cForm.querySelector('button[type="submit"]');
  submit.disabled = true;
  try {
    const data = await MP.api(API + '/comments', { method: 'POST', body: { content } });
    comments.push(data.comment);
    cInput.value = '';
    renderComments();
    MP.toast('评论已发布');
  } catch (err) {
    MP.toast(err.message);
  } finally {
    submit.disabled = false;
  }
});

/* ---------------------------------------------------------------- 启动 */

(async () => {
  me = await MP.me();

  try {
    const data = await MP.api(API + '/stats');
    site = data.site;
    stats = data.stats;
  } catch (err) {
    viewer.hidden = true;
    snapbar.hidden = true;
    sheet.hidden = true;
    missing.hidden = false;
    return;
  }

  // 关注状态：登录后才查得到
  if (me && me.id !== site.author.id) {
    try {
      const social = await MP.api('/api/users/' + site.author.id + '/social');
      following = social.isFollowing;
    } catch { /* 查不到就当没关注 */ }
  }

  // 进观看页记录一条浏览历史（未登录时服务端会回 401，忽略即可）
  if (me) {
    MP.api('/api/history', { method: 'POST', body: { username: OWNER, site: SITE } })
      .catch(() => { /* 历史记录失败不影响观看 */ });
  }

  const a = site.author;
  document.title = (site.title || site.name) + ' · MinePage';
  document.getElementById('toAuthor').innerHTML =
    '作者 <a href="/qwq/' + encodeURIComponent(a.username) + '">' + MP.esc(a.name) + '</a>';
  renderFrame();
  renderBar();

  // 评论列表
  try {
    const data = await MP.api(API + '/comments');
    comments = data.comments;
    renderComments();
  } catch (err) {
    cEmpty.hidden = false;
    cEmpty.textContent = err.message;
  }
})();
</script>
</body>
</html>
