<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>观看历史 · MinePage</title>
<link rel="stylesheet" href="/_assets/style.css">
</head>
<body>
<main class="page">
  <div class="secHead">
    <h1 style="margin:0">观看历史</h1>
    <button type="button" class="ghost tiny" id="clear">清空历史</button>
  </div>
  <p class="sub" id="sub">最近看过的页面都在这里，最多保留 100 条。</p>

  <div id="groups"></div>
  <div id="empty" class="empty" hidden>还没有观看记录，去 <a href="/">首页</a> 逛逛吧。</div>
</main>

<script src="/_assets/app.js"></script>
<script>
MP.topbar({ active: 'history' });

// 数据全部来自真实接口：
//   GET    /api/history        我的浏览历史（一人一站一条，按时间倒序，最多 100 条）
//   DELETE /api/history/:站名   删单条
//   DELETE /api/history        清空
// 页面要登录才能进（后端 /history 未登录会重定向），所以这里不做未登录分支。
let records = [];

const groupsBox = document.getElementById('groups');
const emptyBox = document.getElementById('empty');
const subBox = document.getElementById('sub');
const clearBtn = document.getElementById('clear');

/** 按时间归到「今天 / 昨天 / 更早」三组。 */
function bucketOf(ts) {
  const d = new Date(ts);
  const today = new Date();
  /** 两个日期是否落在同一天（按浏览器的本地时区判断，不做跨时区处理）。 */
  const sameDay = (a, b) => a.getFullYear() === b.getFullYear()
    && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  if (sameDay(d, today)) return '今天';
  const yesterday = new Date(today.getTime() - 86400e3);
  if (sameDay(d, yesterday)) return '昨天';
  return '更早';
}

/** 把时间戳格式化成「月-日 时:分」，只用于列表右侧那一列显示。 */
function fmtTime(ts) {
  const d = new Date(ts);
  return String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0')
    + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

/**
 * 整体重画：清空容器，按「今天 / 昨天 / 更早」分组渲染记录，并同步副标题条数和空态。
 * 数据源是页内变量 records（启动时从 GET /api/history 拉来）；
 * 删除单条和清空都先调接口，成功后再改数组重画。
 */
function render() {
  groupsBox.textContent = '';
  emptyBox.hidden = records.length > 0;
  subBox.textContent = records.length
    ? '共 ' + records.length + ' 条记录，最多保留 100 条。'
    : '还没有观看记录。';

  ['今天', '昨天', '更早'].forEach((label) => {
    const list = records.filter((r) => bucketOf(r.viewedAt) === label);
    if (!list.length) return;

    const h = document.createElement('h2');
    h.textContent = label;
    h.style.margin = '24px 0 10px';
    groupsBox.appendChild(h);

    const box = document.createElement('div');
    box.className = 'rows';
    list.forEach((r) => box.appendChild(rowItem(r)));
    groupsBox.appendChild(box);
  });
}

/**
 * 造一条观看记录：渐变缩略图 + 标题链接（/view/:name）+ 作者 / 标签 / 浏览数 + 删除按钮。
 * 注意：接口条目就是站点卡片本身加上 viewedAt，**没有 .site 包装** —— 所以直接用 r。
 * 删除先调 DELETE /api/history/:name，成功后才从数组摘掉重画。
 */
function rowItem(r) {
  const s = r;
  const el = document.createElement('div');
  el.className = 'rowItem';
  el.innerHTML =
    '<div class="rthumb" style="background:' + MP.grad(s) + '">' + MP.esc(MP.initial(s)) + '</div>'
    + '<div class="grow">'
    +   '<div class="t"><a href="/view/' + encodeURIComponent(s.name) + '">' + MP.esc(s.title || s.name) + '</a></div>'
    +   '<div class="d">' + MP.esc(s.author.name) + ' · ' + MP.esc(s.tagLabel || MP.tagLabel(s.tag))
    +     ' · ' + MP.fmtNum(s.views) + ' 次浏览</div>'
    + '</div>'
    + '<span class="muted" style="font-size:12px;flex:none">' + fmtTime(r.viewedAt) + '</span>'
    + '<button type="button" class="ghost tiny" title="删除这条记录">删除</button>';

  el.querySelector('button').addEventListener('click', async () => {
    const res = await fetch('/api/history/' + encodeURIComponent(s.name), { method: 'DELETE' });
    if (!res.ok) {
      MP.toast('删除失败，稍后再试');
      return;
    }
    records = records.filter((x) => x.name !== s.name);
    render();
    MP.toast('已删除这条记录');
  });
  return el;
}

clearBtn.addEventListener('click', async () => {
  if (!records.length) return;
  if (!confirm('确定清空全部观看历史吗？')) return;
  const res = await fetch('/api/history', { method: 'DELETE' });
  if (!res.ok) {
    MP.toast('清空失败，稍后再试');
    return;
  }
  records = [];
  render();
  MP.toast('已清空观看历史');
});

/** 启动：拉真实历史。失败时把原因写进副标题（空态不亮，免得误导成"没有记录"）。 */
async function boot() {
  try {
    const res = await fetch('/api/history', { headers: { Accept: 'application/json' } });
    const data = await res.json().catch(() => null);
    if (res.ok && data && data.ok) {
      records = data.sites || [];
      render();
      return;
    }
    subBox.textContent = (data && data.message) || '加载失败，稍后再试。';
  } catch {
    subBox.textContent = '连不上服务器，稍后再试。';
  }
}

boot();
</script>
</body>
</html>
