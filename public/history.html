<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>观看历史 · MinePage</title>
<link rel="stylesheet" href="/_assets/style.css">
</head>
<body>
<main class="page">
  <div class="secHead">
    <h1 style="margin:0">观看历史</h1>
    <button type="button" class="ghost tiny" id="clear">清空历史</button>
  </div>
  <p class="sub" id="sub">最近看过的页面都在这里，只保留最近 30 天。</p>

  <div id="groups"></div>
  <div id="empty" class="empty" hidden>还没有观看记录，去 <a href="/">首页</a> 逛逛吧。</div>
</main>

<script src="/_assets/app.js"></script>
<script>
MP.topbar({ active: 'history' });

let records = [];   // [{ ...site, viewedAt }]

const groupsBox = document.getElementById('groups');
const emptyBox = document.getElementById('empty');
const subBox = document.getElementById('sub');

/** 按时间归到「今天 / 昨天 / 更早」三组。 */
function bucketOf(value) {
  const d = MP.toDate(value);
  if (!d) return '更早';
  const today = new Date();
  const sameDay = (a, b) => a.getFullYear() === b.getFullYear()
    && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  if (sameDay(d, today)) return '今天';
  if (sameDay(d, new Date(today.getTime() - 86400e3))) return '昨天';
  return '更早';
}

function render() {
  groupsBox.textContent = '';
  emptyBox.hidden = records.length > 0;
  subBox.textContent = records.length
    ? '共 ' + records.length + ' 条记录。'
    : '还没有观看记录，去首页逛逛吧。';

  ['今天', '昨天', '更早'].forEach((label) => {
    const list = records.filter((r) => bucketOf(r.viewedAt) === label);
    if (!list.length) return;

    const h = document.createElement('h2');
    h.textContent = label;
    h.style.margin = '24px 0 10px';
    groupsBox.appendChild(h);

    const box = document.createElement('div');
    box.className = 'rows';
    list.forEach((r) => box.appendChild(rowItem(r)));
    groupsBox.appendChild(box);
  });
}

function rowItem(site) {
  const el = document.createElement('div');
  el.className = 'rowItem';
  el.innerHTML =
    '<div class="rthumb" style="background:' + MP.grad(site) + '">' + MP.esc(MP.initial(site)) + '</div>'
    + '<div class="grow">'
    +   '<div class="t"><a href="' + MP.viewUrl(site) + '">' + MP.esc(site.title || site.name) + '</a></div>'
    +   '<div class="d">' + MP.esc(site.author.name) + ' · ' + MP.esc(site.tagLabel || MP.tagLabel(site.tag))
    +     ' · ' + MP.fmtNum(site.views) + ' 次浏览</div>'
    + '</div>'
    + '<span class="muted" style="font-size:12px;flex:none">' + MP.fmtTime(site.viewedAt) + '</span>'
    + '<button type="button" class="ghost tiny" title="删除这条记录">删除</button>';

  el.querySelector('button').addEventListener('click', async () => {
    try {
      // 历史按站点删除：/api/history/<用户名>/<站名>
      await MP.api('/api/history/' + encodeURIComponent(site.author.username)
        + '/' + encodeURIComponent(site.name), { method: 'DELETE' });
      records = records.filter((x) => x !== site);
      render();
      MP.toast('已删除这条记录');
    } catch (err) {
      MP.toast(err.message);
    }
  });
  return el;
}

document.getElementById('clear').addEventListener('click', async () => {
  if (!records.length) return;
  if (!confirm('确定清空全部观看历史吗？')) return;
  try {
    await MP.api('/api/history', { method: 'DELETE' });
    records = [];
    render();
    MP.toast('已清空观看历史');
  } catch (err) {
    MP.toast(err.message);
  }
});

(async () => {
  if (!(await MP.requireLogin())) return;

  try {
    const data = await MP.api('/api/history');
    records = data.sites;
    render();
  } catch (err) {
    emptyBox.hidden = false;
    emptyBox.textContent = err.message;
  }
})();
</script>
</body>
</html>
