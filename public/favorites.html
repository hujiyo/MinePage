<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的收藏 · MinePage</title>
<link rel="stylesheet" href="/_assets/style.css">
</head>
<body>
<main class="page wide">
  <div class="secHead">
    <h1 style="margin:0">我的收藏</h1>
    <a class="more" href="/">去首页发现更多 →</a>
  </div>

  <div class="msgLayout" style="margin-top:16px">
    <!-- 收藏夹分类 -->
    <div>
      <div class="msgList" id="folders"></div>
    </div>

    <!-- 收藏内容 -->
    <div>
      <div class="secHead">
        <h2 id="folderName">全部收藏</h2>
        <span class="muted" style="font-size:13px" id="folderCount"></span>
      </div>
      <div class="cards" id="cards"></div>
    </div>
  </div>
</main>

<script src="/_assets/app.js"></script>
<script>
MP.topbar();

const foldersBox = document.getElementById('folders');
const cardsBox = document.getElementById('cards');
const folderName = document.getElementById('folderName');
const folderCount = document.getElementById('folderCount');

let allSites = [];      // 服务端平铺返回的全部收藏
let folders = [];       // [{ name, sites }]
let cur = -1;           // -1 表示「全部收藏」

/** 按 folder 字段把平铺列表分组。 */
function groupByFolder(sites) {
  const map = new Map();
  sites.forEach((s) => {
    const name = s.folder || '默认收藏夹';
    if (!map.has(name)) map.set(name, []);
    map.get(name).push(s);
  });
  return [...map.entries()].map(([name, list]) => ({ name, sites: list }));
}

function renderFolders() {
  foldersBox.textContent = '';

  const rows = [{ name: '全部收藏', count: allSites.length, index: -1 }]
    .concat(folders.map((f, i) => ({ name: f.name, count: f.sites.length, index: i })));

  rows.forEach((row) => {
    const item = document.createElement('div');
    item.className = 'msgItem' + (row.index === cur ? ' on' : '');
    item.innerHTML = '<span class="avatar sm">' + MP.esc(row.name[0]) + '</span>'
      + '<div class="mi"><div class="nm"><span>' + MP.esc(row.name) + '</span>'
      + '<time>' + row.count + '</time></div></div>';
    item.addEventListener('click', () => { cur = row.index; render(); });
    foldersBox.appendChild(item);
  });
}

function renderCards() {
  const list = cur === -1 ? allSites : folders[cur].sites;
  folderName.textContent = cur === -1 ? '全部收藏' : folders[cur].name;
  folderCount.textContent = '共 ' + list.length + ' 个页面';

  if (!list.length) {
    cardsBox.innerHTML = '<div class="empty" style="grid-column:1/-1">'
      + (allSites.length ? '这个收藏夹还是空的。' : '还没有收藏任何页面。去首页逛逛吧。') + '</div>';
    return;
  }
  // 取消收藏后当前收藏夹可能变空，整页重拉一次（回调由 MP.vcard 的收藏按钮触发）
  MP.renderCards(cardsBox, list, {
    onFavoriteChange: (site) => { if (!site.favorited) load(); },
  });
}

function render() {
  renderFolders();
  renderCards();
}

async function load() {
  cardsBox.innerHTML = '<div class="empty" style="grid-column:1/-1">加载中…</div>';
  try {
    const data = await MP.api('/api/favorites');
    allSites = data.sites;
    folders = groupByFolder(allSites);
    // 默认选中第一个收藏夹；一个都没有时停在「全部收藏」
    cur = folders.length ? Math.min(cur, folders.length - 1) : -1;
    render();
  } catch (err) {
    cardsBox.innerHTML = '<div class="empty" style="grid-column:1/-1">' + MP.esc(err.message) + '</div>';
  }
}

(async () => {
  if (!(await MP.requireLogin())) return;
  await load();
})();
</script>
</body>
</html>
