<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的收藏 · MinePage</title>
<link rel="stylesheet" href="/_assets/style.css">
</head>
<body>
<main class="page wide">
  <div class="secHead">
    <h1 style="margin:0">我的收藏</h1>
    <a class="more" href="/">去首页发现更多 →</a>
  </div>

  <div class="msgLayout" style="margin-top:16px">
    <!-- 收藏夹分类 -->
    <div>
      <div class="msgList" id="folders"></div>
      <div class="panel" style="margin-top:12px">
        <b style="display:block;margin-bottom:6px">新建收藏夹</b>
        <p class="muted" style="font-size:12px;margin:0 0 10px">把喜欢的页面分门别类地收好。</p>
        <button type="button" class="ghost block" id="newFolder">+ 新建收藏夹</button>
      </div>
    </div>

    <!-- 收藏内容 -->
    <div>
      <div class="secHead">
        <h2 id="folderName">默认收藏夹</h2>
        <span class="muted" style="font-size:13px" id="folderCount"></span>
      </div>
      <div class="cards" id="cards"></div>
    </div>
  </div>
</main>

<script src="/_assets/app.js"></script>
<script>
MP.topbar();

// TODO 后端对接：替换为 fetch('/api/favorites')，收藏夹由用户自定义
const FOLDERS = [
  { name: '默认收藏夹', sites: MP.topSites(6) },
  { name: '设计灵感', sites: MP.SITES.filter((s) => s.tag === 'portfolio' || s.tag === 'blog') },
  { name: '前端学习', sites: MP.SITES.filter((s) => s.tag === 'opensource' || s.tag === 'blog') },
  { name: '稍后再看', sites: MP.SITES.slice(0, 3) },
];

let cur = 0;

const foldersBox = document.getElementById('folders');
const cardsBox = document.getElementById('cards');
const folderName = document.getElementById('folderName');
const folderCount = document.getElementById('folderCount');

/**
 * 重建左侧收藏夹列表（当前收藏夹加高亮），预览显示每个夹子里前三位作者名。
 * 数据来自页内常量 FOLDERS，而 FOLDERS 又是 app.js 演示数据（MP.SITES / MP.topSites）
 * 现算出来的：**一次请求都没发**（见文件顶部的 TODO），所以这里的名字、数量跟当前账号
 * 真实的收藏无关，任何登录用户看到的都是同一份内容。
 * 另注：后端 GET /api/favorites 只回一份平铺的收藏站点（服务端注释写着「前端按收藏夹分组」），
 * 收藏夹目前没有服务端模型，想接真实数据还得先定下分组存在哪儿。
 */
function renderFolders() {
  foldersBox.textContent = '';
  FOLDERS.forEach((f, i) => {
    const item = document.createElement('div');
    item.className = 'msgItem' + (i === cur ? ' on' : '');
    item.innerHTML = '<span class="avatar sm">' + MP.esc(f.name[0]) + '</span>'
      + '<div class="mi"><div class="nm"><span>' + MP.esc(f.name) + '</span>'
      + '<time>' + f.sites.length + '</time></div>'
      + '<div class="pv">' + MP.esc(f.sites.map((s) => s.author.name).slice(0, 3).join('、')) + '</div></div>';
    item.addEventListener('click', () => { cur = i; renderFolders(); renderSites(); });
    foldersBox.appendChild(item);
  });
}

/**
 * 刷新右侧「当前收藏夹」的标题、条数和卡片区；卡片交给 app.js 的 MP.renderCards 渲染。
 * 副作用：会清空并重写 cardsBox，传入的站点数组为空时那里会出现一句空态文案。
 */
function renderSites() {
  const f = FOLDERS[cur];
  folderName.textContent = f.name;
  folderCount.textContent = '共 ' + f.sites.length + ' 个页面';
  MP.renderCards(cardsBox, f.sites);
}

document.getElementById('newFolder').addEventListener('click', () => {
  MP.toast('新建收藏夹需要登录后使用');
});

renderFolders();
renderSites();
</script>
</body>
</html>
