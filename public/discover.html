<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MinePage · 首页</title>
<link rel="stylesheet" href="/_assets/style.css">
</head>
<body>
<main class="page wide">
  <div id="bannerArea"></div>

  <div class="homeGrid">
    <div>
      <div class="secHead">
        <h2 id="feedTitle">推荐</h2>
        <a class="more" href="/?sort=rank">按浏览量查看 →</a>
      </div>
      <div class="chips" id="chips" style="margin-bottom:14px"></div>
      <div class="cards" id="cards"></div>
    </div>

    <aside class="homeSide">
      <div>
        <div class="secHead">
          <h2>热门榜单</h2>
          <a class="more" href="/?sort=rank">更多</a>
        </div>
        <div class="rankList" id="rank"></div>
      </div>

      <div>
        <div class="secHead"><h2>热搜</h2></div>
        <div class="rankList" id="hot"></div>
      </div>

      <div class="panel">
        <b style="display:block;margin-bottom:6px">想让更多人看到你的页面？</b>
        <p class="muted" style="font-size:13px;margin:0 0 12px">
          上传一个 HTML，就是一个可被搜索、收藏、评论的站点。
        </p>
        <a href="/sites?tab=upload"><button type="button" class="block">去投稿</button></a>
      </div>
    </aside>
  </div>
</main>

<script src="/_assets/app.js"></script>
<script>
MP.topbar();

const params = new URLSearchParams(location.search);
const q = (params.get('q') || '').trim();
const sortRank = params.get('sort') === 'rank';
let tag = '';

const bannerArea = document.getElementById('bannerArea');
const chipsBox = document.getElementById('chips');
const cardsBox = document.getElementById('cards');
const feedTitle = document.getElementById('feedTitle');
const rankBox = document.getElementById('rank');
const hotBox = document.getElementById('hot');

// ---------------------------------------------------------------- 轮播

/**
 * 在首页顶部挂一张自动轮播的 banner：4.5s 换一张，鼠标移入暂停、移出继续，点整张进 /view/:site。
 * 带搜索词（?q=）时直接不渲染，把版面让给搜索结果。
 * 目前启动处是注释掉的（见文件末尾的说明）：MP.BANNERS 是写死的运营配置，指向的站点在真实库里
 * 都不存在，图片也来自外部地址。
 * 副作用：往 bannerArea 追加节点，并留下一个 4.5s 的 setInterval（页面卸载前不会主动清理）。
 */
function mountBanner() {
  if (q) return; // 搜索结果页不显示轮播，把版面让给结果
  const list = MP.BANNERS;
  const el = document.createElement('div');
  el.className = 'banner';
  let idx = 0;
  let timer = null;

  /**
   * 按当前下标 idx 重画 banner 的图片、文案、左右箭头和圆点。
   * 整块用 innerHTML 重建，所以箭头和圆点的事件必须每次重新绑定——这正是它们写在本函数里、
   * 而不是在 mountBanner 里绑一次的原因。
   */
  function paint() {
    const b = list[idx];
    el.innerHTML =
      '<img src="' + b.img + '" alt="' + MP.esc(b.title) + '">'
      + '<div class="binfo"><b>' + MP.esc(b.title) + '</b><span>' + MP.esc(b.sub) + '</span></div>'
      + '<button type="button" class="bnav prev" title="上一张">' + MP.icon('left') + '</button>'
      + '<button type="button" class="bnav next" title="下一张">' + MP.icon('right') + '</button>'
      + '<div class="bdots">' + list.map((_, i) =>
          '<i class="' + (i === idx ? 'on' : '') + '" data-i="' + i + '"></i>').join('') + '</div>';

    el.querySelector('.prev').addEventListener('click', () => go(idx - 1));
    el.querySelector('.next').addEventListener('click', () => go(idx + 1));
    el.querySelectorAll('.bdots i').forEach((d) => {
      d.addEventListener('click', () => go(Number(d.dataset.i)));
    });
  }

  /**
   * 切到指定下标的 banner：先对 list.length 取模实现首尾回环（传 idx-1 / idx+1 即可左右翻，
   * 越界的负数也会被纠正），再重画并重置自动轮播计时器。
   */
  function go(i) {
    idx = (i + list.length) % list.length;
    paint();
    restart();
  }

  /**
   * 重置自动轮播计时器：先 clearInterval 再重新 setInterval，间隔固定 4.5s。
   * 悬停暂停只是 clearInterval（不把 timer 置空），所以移出时调本函数恢复即可；
   * 重复调用是安全的，不会叠出两个计时器。
   */
  function restart() {
    clearInterval(timer);
    timer = setInterval(() => { idx = (idx + 1) % list.length; paint(); }, 4500);
  }
  el.addEventListener('mouseenter', () => clearInterval(timer));
  el.addEventListener('mouseleave', restart);
  // 整体点击进观看页；导航键与圆点单独响应
  el.addEventListener('click', (e) => {
    if (e.target.closest('.bnav') || e.target.closest('.bdots')) return;
    location.href = '/view/' + encodeURIComponent(list[idx].site);
  });

  paint();
  restart();
  bannerArea.appendChild(el);
}

// ---------------------------------------------------------------- 分类 chips

/**
 * 渲染分类 chips（词表来自 MP.TAGS，其中 '' 是「全部」、'hot' 是伪标签）。
 * 点击会改全局 tag、重绘自身并调用 reload() 重新拉列表——本函数只管视图，
 * 真正带参数的请求在 reload() 里，伪标签 hot 在那里被映射成 sort=views。
 */
function renderChips() {
  chipsBox.textContent = '';
  MP.TAGS.forEach((t) => {
    const el = document.createElement('span');
    el.className = 'chip' + (t.key === tag ? ' active' : '');
    el.textContent = t.label;
    el.addEventListener('click', () => { tag = t.key; renderChips(); reload(); });
    chipsBox.appendChild(el);
  });
}

// ---------------------------------------------------------------- 侧栏

/**
 * 渲染右侧栏两块列表：「热门榜单」点进观看页，「热搜」走 MP.goSearch（跳 /?q=）。
 * 数据源仍是 app.js 里的演示数据 MP.topSites(10) 与 MP.HOT，**不发请求**；
 * 主信息流 reload() 已经换成真实接口，侧栏这两块还没接后端，目前也没有 TODO 标记。
 */
function renderSide() {
  const tops = MP.topSites(10);
  rankBox.textContent = '';
  tops.forEach((s, i) => {
    const row = document.createElement('div');
    row.className = 'rankItem';
    row.innerHTML = '<span class="no">' + (i + 1) + '</span>'
      + '<span class="rw">' + MP.esc(s.title) + '</span>'
      + '<span class="rv">' + MP.fmtNum(s.views) + '</span>';
    row.addEventListener('click', () => { location.href = '/view/' + encodeURIComponent(s.name); });
    rankBox.appendChild(row);
  });

  hotBox.textContent = '';
  MP.HOT.slice(0, 8).forEach((h, i) => {
    const row = document.createElement('div');
    row.className = 'rankItem';
    row.innerHTML = '<span class="no">' + (i + 1) + '</span>'
      + '<span class="rw">' + MP.esc(h.word) + '</span>'
      + '<span class="rv">' + MP.esc(h.val) + '</span>';
    row.addEventListener('click', () => MP.goSearch(h.word));
    hotBox.appendChild(row);
  });
}

// ---------------------------------------------------------------- 列表

/**
 * 数据源：GET /api/discover（真实接口）
 *
 * 参数映射说明 —— 服务端对非法参数**不报错，只静默退化**，
 * 所以这里必须显式映射，不能直接透传：
 *
 *   q                直传
 *   tag=真实标签      直传（服务端白名单校验）
 *   tag='hot'        前端伪标签，服务端 SITE_TAGS 里没有 hot。
 *                    直接透传会被当成"不筛选"而返回全部（看着像成功），
 *                    所以换成 sort=views。「热门」的真正语义待定。
 *   ?sort=rank       服务端排序白名单是 views/likes/favorites/comments/newest，
 *                    **没有 rank**。同样会静默退化为默认排序，所以也映射到 views，
 *                    以保持「排行榜」这个入口原本的可见行为。
 */
async function reload() {
  const sort = (tag === 'hot' || sortRank) ? 'views' : '';
  const query = new URLSearchParams();
  if (q) query.set('q', q);
  if (tag && tag !== 'hot') query.set('tag', tag);
  if (sort) query.set('sort', sort);

  feedTitle.textContent = q ? '搜索：' + q : (tag === 'hot' ? '热门' : '推荐');
  cardsBox.innerHTML = '<div class="empty" style="grid-column:1/-1">加载中…</div>';

  try {
    const res = await fetch('/api/discover?' + query.toString(), { headers: { Accept: 'application/json' } });
    const data = await res.json();
    if (!data.ok) throw new Error(data.message || '加载失败');
    MP.renderCards(cardsBox, data.sites || []);
  } catch (err) {
    cardsBox.innerHTML = '<div class="empty" style="grid-column:1/-1">'
      + '加载失败：' + MP.esc(err.message) + '，刷新试试。</div>';
  }
}

// 轮播位恢复正常渲染。
// 注意：MP.BANNERS 是写死的运营配置（TODO 后端对接：轮播位来自运营配置），
// 它指向 aurora-portfolio / mini-vue / opensource-landing 三个站点。
// 这三个在**演示数据 MP.SITES 里存在**，所以现在点得开；
// 等 view.html 接上真实接口之后它们就不存在了，届时轮播位需要换成真实的运营配置。
// 图片来自外部第三方地址，不受我们控制，加载失败时会是个空框。
mountBanner();
renderChips();
renderSide();
reload();
</script>
</body>
</html>
