<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MinePage · 首页</title>
<link rel="stylesheet" href="/_assets/style.css">
</head>
<body>
<main class="page wide">
  <div id="bannerArea"></div>

  <div class="homeGrid">
    <div>
      <div class="secHead">
        <h2 id="feedTitle">推荐</h2>
        <a class="more" href="/?sort=rank">按浏览量查看 →</a>
      </div>
      <div class="chips" id="chips" style="margin-bottom:14px"></div>
      <div class="cards" id="cards"></div>
      <div class="pager" id="pager" hidden></div>
    </div>

    <aside class="homeSide">
      <div>
        <div class="secHead">
          <h2>热门榜单</h2>
          <a class="more" href="/?sort=rank">更多</a>
        </div>
        <div class="rankList" id="rank"></div>
      </div>

      <div class="panel">
        <b style="display:block;margin-bottom:6px">想让更多人看到你的页面？</b>
        <p class="muted" style="font-size:13px;margin:0 0 12px">
          上传一个 HTML，就是一个可被搜索、收藏、评论的站点。
        </p>
        <a href="/sites?tab=upload"><button type="button" class="block">去投稿</button></a>
      </div>
    </aside>
  </div>
</main>

<script src="/_assets/app.js"></script>
<script>
MP.topbar();

const params = new URLSearchParams(location.search);
const q = (params.get('q') || '').trim();
const sortRank = params.get('sort') === 'rank';
let tag = '';
let page = Math.max(1, Number(params.get('page')) || 1);

const bannerArea = document.getElementById('bannerArea');
const chipsBox = document.getElementById('chips');
const cardsBox = document.getElementById('cards');
const pagerBox = document.getElementById('pager');
const feedTitle = document.getElementById('feedTitle');
const rankBox = document.getElementById('rank');

// ---------------------------------------------------------------- 轮播位
// 内容全部来自管理后台配置（/api/banners）：只返回启用中、且站点仍在线的。
// 只有一条时不自动轮播，也不显示圆点。

async function mountBanner() {
  if (q) return;   // 搜索结果页不显示轮播，把版面让给结果

  let list = [];
  try {
    list = (await MP.api('/api/banners')).banners;
  } catch { return; }
  if (!list.length) return;

  const el = document.createElement('div');
  el.className = 'banner';
  let idx = 0;
  let timer = null;

  /** 轮播封面的取图地址：/api/sites/<用户名>/<站名>/cover。
   *  /api/banners 返回的 site 里只有 owner（用户名），没有 author；拼不出来就返回空串，调用方退回渐变。 */
  function bannerCoverUrl(site) {
    const owner = (site.author && site.author.username) || site.owner || '';
    if (!owner || !site.name) return '';
    return '/api/sites/' + encodeURIComponent(owner) + '/' + encodeURIComponent(site.name) + '/cover';
  }

  function paint() {
    const b = list[idx];
    const title = b.title || b.site.title || b.site.name;
    const sub = b.subtitle || b.site.description || '';
    const coverUrl = b.site.hasCover ? bannerCoverUrl(b.site) : '';
    el.style.background = MP.grad(b.site);
    el.innerHTML =
      '<div class="bcover">'
      + (coverUrl
        ? '<img src="' + MP.esc(coverUrl) + '" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">'
        : '<span class="bchar">' + MP.esc(MP.initial(b.site)) + '</span>')
      + '</div>'
      + '<div class="binfo"><b>' + MP.esc(title) + '</b><span>' + MP.esc(sub) + '</span></div>'
      + (list.length > 1
        ? '<button type="button" class="bnav prev" title="上一张">' + MP.icon('left') + '</button>'
          + '<button type="button" class="bnav next" title="下一张">' + MP.icon('right') + '</button>'
          + '<div class="bdots">' + list.map((_, i) =>
            '<i class="' + (i === idx ? 'on' : '') + '" data-i="' + i + '"></i>').join('') + '</div>'
        : '');

    el.querySelector('.prev')?.addEventListener('click', (e) => { e.stopPropagation(); go(idx - 1); });
    el.querySelector('.next')?.addEventListener('click', (e) => { e.stopPropagation(); go(idx + 1); });
    el.querySelectorAll('.bdots i').forEach((d) => {
      d.addEventListener('click', (e) => { e.stopPropagation(); go(Number(d.dataset.i)); });
    });
    // 图挂了（接口 404 / 站点已下线）就退回渐变 + 站名首字，别留一块空白
    const img = el.querySelector('.bcover img');
    if (img) {
      img.addEventListener('error', () => {
        const s = document.createElement('span');
        s.className = 'bchar';
        s.textContent = MP.initial(b.site);
        img.replaceWith(s);
      });
    }
  }

  function go(i) {
    idx = (i + list.length) % list.length;
    paint();
    restart();
  }
  function restart() {
    if (timer) clearInterval(timer);
    if (list.length < 2) return;
    timer = setInterval(() => { idx = (idx + 1) % list.length; paint(); }, 4500);
  }

  el.addEventListener('mouseenter', () => { if (timer) clearInterval(timer); timer = null; });
  el.addEventListener('mouseleave', restart);
  el.addEventListener('click', () => {
    location.href = '/view/' + encodeURIComponent(list[idx].site.owner)
      + '/' + encodeURIComponent(list[idx].site.name);
  });

  paint();
  restart();
  bannerArea.appendChild(el);
}

// ---------------------------------------------------------------- 分类 chips

function renderChips() {
  chipsBox.textContent = '';
  MP.TAGS.forEach((t) => {
    const el = document.createElement('span');
    el.className = 'chip' + (t.key === tag ? ' active' : '');
    el.textContent = t.label;
    el.addEventListener('click', () => { tag = t.key; page = 1; renderChips(); reload(); });
    chipsBox.appendChild(el);
  });
}

// ---------------------------------------------------------------- 侧栏热门榜单

async function renderRank() {
  rankBox.textContent = '';
  try {
    const data = await MP.api('/api/discover?sort=views&size=10');
    data.sites.forEach((s, i) => {
      const row = document.createElement('div');
      row.className = 'rankItem';
      row.innerHTML = '<span class="no">' + (i + 1) + '</span>'
        + '<span class="rw">' + MP.esc(s.title || s.name) + '</span>'
        + '<span class="rv">' + MP.fmtNum(s.views) + '</span>';
      row.addEventListener('click', () => { location.href = MP.viewUrl(s); });
      rankBox.appendChild(row);
    });
    if (!data.sites.length) {
      rankBox.innerHTML = '<div class="empty">还没有上榜的页面。</div>';
    }
  } catch (err) {
    rankBox.innerHTML = '<div class="empty">' + MP.esc(err.message) + '</div>';
  }
}

// ---------------------------------------------------------------- 翻页

/**
 * 渲染底部翻页器。数据来自接口的 total / page / pages 字段。
 * 只有一页时不渲染任何东西。页码窗口最多 7 个，超出用省略号——
 * 467 个站按 12 条一页有 39 页，直接把页码铺出来会把页面撑爆。
 */
function renderPager(total, pages) {
  pagerBox.textContent = '';
  if (pages <= 1) { pagerBox.hidden = true; return; }
  pagerBox.hidden = false;

  const cur = page;

  const slot = (label, to, opt) => {
    const o = opt || {};
    const el = document.createElement(o.disabled || o.active ? 'span' : 'button');
    if (el.tagName === 'BUTTON') el.type = 'button';
    el.className = 'pg' + (o.active ? ' active' : '') + (o.disabled ? ' disabled' : '');
    el.textContent = label;
    if (!o.disabled && !o.active && to != null) {
      el.addEventListener('click', () => {
        page = to;
        reload();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }
    pagerBox.appendChild(el);
  };
  const dots = () => {
    const s = document.createElement('span');
    s.className = 'pg dots';
    s.textContent = '…';
    pagerBox.appendChild(s);
  };

  slot('上一页', cur - 1, { disabled: cur <= 1 });

  if (pages <= 7) {
    for (let i = 1; i <= pages; i += 1) slot(String(i), i, { active: i === cur });
  } else {
    const start = Math.max(2, cur - 2);
    const end = Math.min(pages - 1, cur + 2);
    slot('1', 1, { active: cur === 1 });
    if (start > 2) dots();
    for (let i = start; i <= end; i += 1) slot(String(i), i, { active: i === cur });
    if (end < pages - 1) dots();
    slot(String(pages), pages, { active: cur === pages });
  }

  slot('下一页', cur + 1, { disabled: cur >= pages });
}

// ---------------------------------------------------------------- 列表

async function reload() {
  feedTitle.textContent = q ? '搜索：' + q : (sortRank ? '按浏览量' : '推荐');
  cardsBox.innerHTML = '<div class="empty" style="grid-column:1/-1">加载中…</div>';

  // 参数映射：服务端对非法参数只静默退化，所以 'hot' 这种前端伪标签必须显式换成 sort=views
  const search = new URLSearchParams();
  if (q) search.set('q', q);
  if (tag && tag !== 'hot') search.set('tag', tag);
  if (tag === 'hot' || sortRank) search.set('sort', 'views');
  search.set('page', String(page));
  search.set('size', '12');

  try {
    const data = await MP.api('/api/discover?' + search.toString());
    // 页码越界（比如从第 5 页切到只有 2 页的标签）时退回第一页
    if (!data.sites.length && page > 1) { page = 1; await reload(); return; }
    if (!data.sites.length) {
      cardsBox.innerHTML = '<div class="empty" style="grid-column:1/-1">没有找到相关页面，换个关键词试试。</div>';
      pagerBox.hidden = true;
      return;
    }
    MP.renderCards(cardsBox, data.sites);
    renderPager(data.total, data.pages);
  } catch (err) {
    cardsBox.innerHTML = '<div class="empty" style="grid-column:1/-1">' + MP.esc(err.message) + '</div>';
    pagerBox.hidden = true;
  }
}

mountBanner();
renderChips();
renderRank();
reload();
</script>
</body>
</html>
