<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MinePage · 首页</title>
<link rel="stylesheet" href="/_assets/style.css">
</head>
<body>
<main class="page wide">
  <div id="bannerArea"></div>

  <div class="homeGrid">
    <div>
      <div class="secHead">
        <h2 id="feedTitle">推荐</h2>
        <a class="more" href="/?sort=rank">按浏览量查看 →</a>
      </div>
      <div class="chips" id="chips" style="margin-bottom:14px"></div>
      <div class="cards" id="cards"></div>
      <div class="pager" id="pager" hidden></div>
    </div>

    <aside class="homeSide">
      <div id="rankSec">
        <div class="secHead">
          <h2>收藏榜</h2>
          <a class="more" href="/?sort=favorites">更多</a>
        </div>
        <div class="rankList" id="rank"></div>
      </div>

      <div class="panel">
        <b style="display:block;margin-bottom:6px">想让更多人看到你的页面？</b>
        <p class="muted" style="font-size:13px;margin:0 0 12px">
          上传一个 HTML，就是一个可被搜索、收藏、评论的站点。
        </p>
        <a href="/sites?tab=upload"><button type="button" class="block">去投稿</button></a>
      </div>
    </aside>
  </div>
</main>

<script src="/_assets/app.js"></script>
<script>
MP.topbar();

const params = new URLSearchParams(location.search);
const q = (params.get('q') || '').trim();
// 对外只有两个排序名：rank = 按浏览量，favorites = 按收藏。其余值都按推荐流。
const sortKind = params.get('sort') === 'rank' ? 'views'
  : params.get('sort') === 'favorites' ? 'favorites' : '';
let tag = '';
let page = Math.max(1, Number(params.get('page')) || 1);

const bannerArea = document.getElementById('bannerArea');
const chipsBox = document.getElementById('chips');
const cardsBox = document.getElementById('cards');
const pagerBox = document.getElementById('pager');
const feedTitle = document.getElementById('feedTitle');
const rankBox = document.getElementById('rank');
const rankSec = document.getElementById('rankSec');

// ---------------------------------------------------------------- 轮播位
// 内容全部来自管理后台配置（/api/banners）：只返回启用中、且站点仍在线的。
// 只有一条时不自动轮播，也不显示圆点。

async function mountBanner() {
  if (q) return;   // 搜索结果页不显示轮播，把版面让给结果

  let list = [];
  try {
    list = (await MP.api('/api/banners')).banners;
  } catch { return; }
  if (!list.length) return;

  const el = document.createElement('div');
  el.className = 'banner';
  let idx = 0;
  let timer = null;
  let resizeTimer = null;

  // 轮播位里显示站点真实首屏：和卡片封面同一套虚拟视口（1280×720，按宽度等比缩放，
  // 多出来的高度由 .banner 的 overflow:hidden 裁掉）。固定 720 是为了让站点的
  // 100vh 全屏首屏按真实尺寸排版——视口高度乱改会让 hero 被压扁或撑出可见区。
  const PREVIEW_W = 1280;
  const PREVIEW_H = 720;

  // 已载入过的轮播项不重复下载：iframe 从 DOM 里摘掉就会销毁浏览上下文，
  // 再插回去等于重新载入整站，所以这里改成「留在 DOM 里、用 hidden 隐藏」。
  // 同时最多留 CACHE_MAX 张，避免十个站点在后台一起跑动画。
  const CACHE_MAX = 3;
  const mounted = []; // 已挂进 el 的 bpreview，按载入先后排序（先进先出淘汰）

  function mountPreview(b, coverUrl) {
    // 换图前先把所有预览藏起来，避免上一张的残影盖在新渐变上；
    // 同时撤掉 hasPreview，新画面出来前先用渐变 + 大字占位。
    mounted.forEach((f) => { f.hidden = true; });
    el.classList.remove('hasPreview');
    syncCover(coverUrl);
    // 没有作者名就拼不出站点地址（老数据 / 站点已删），保持渐变占位即可
    if (!b.site.owner) return;
    const w = el.clientWidth;
    if (!w) return; // 还没布局好（隐藏 / 刚挂载），等 resize 或下一轮再补

    let frame = mounted.find((f) => f.dataset.bid === String(b.id));
    if (!frame) {
      frame = document.createElement('iframe');
      frame.className = 'bpreview';
      frame.dataset.bid = String(b.id);
      frame.referrerPolicy = 'no-referrer';
      // 只给脚本不给同源：站点 JS 照常跑，但摸不到父页面和 cookie
      frame.sandbox = 'allow-scripts';
      frame.setAttribute('scrolling', 'no');
      frame.style.width = PREVIEW_W + 'px';
      frame.style.height = PREVIEW_H + 'px';
      frame.style.transformOrigin = '0 0';
      frame.addEventListener('load', () => {
        frame.dataset.loaded = '1';
        frame.classList.add('loaded');   // 淡入，见 style.css 的 .bpreview
        // 只有当前在用的那张才让大字退场；后台缓存的旧 iframe 晚到时不能抢这个状态
        if (!frame.hidden) el.classList.add('hasPreview');
      }, { once: true });
      // 首屏通常很快画完，不必等整站下完才露脸；到点先显示，没画出来的部分透出渐变占位
      setTimeout(() => {
        if (frame.hidden) return;
        frame.classList.add('loaded');
        el.classList.add('hasPreview');
      }, 900);
      frame.src = '/qwq/' + encodeURIComponent(b.site.owner) + '/'
        + encodeURIComponent(b.site.name) + '/?mpcover=1';
      mounted.push(frame);
      // 超出上限就把最早的那张彻底移除（它的浏览上下文也随之释放）
      while (mounted.length > CACHE_MAX) {
        const old = mounted.shift();
        if (old !== frame) old.remove();
      }
      const info = el.querySelector('.binfo');
      if (info) el.insertBefore(frame, info);
      else el.appendChild(frame);
    }

    // 复用时要按 banner 当前宽度重算缩放（窗口尺寸变了）
    frame.style.transform = 'scale(' + (w / PREVIEW_W) + ')';
    frame.hidden = false;
    if (frame.dataset.loaded === '1') {
      frame.classList.add('loaded');
      el.classList.add('hasPreview');
    }
  }

  // 骨架只搭一次：每次 paint 都重写 innerHTML 会把预览 iframe 一起冲掉，
  // 换一张就得重新载入整站，轮播会一直闪白。所以这里只更新文字、配色和圆点。
  el.innerHTML =
    '<div class="bcover"><span class="bchar"></span>'
    + '<img class="bimg" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" hidden></div>'
    + '<div class="binfo"><b></b><span></span></div>'
    + (list.length > 1
      ? '<button type="button" class="bnav prev" title="上一张">' + MP.icon('left') + '</button>'
        + '<button type="button" class="bnav next" title="下一张">' + MP.icon('right') + '</button>'
        + '<div class="bdots">' + list.map((_, i) =>
          '<i' + (i === idx ? ' class="on"' : '') + ' data-i="' + i + '"></i>').join('') + '</div>'
      : '');

  /** 轮播封面的取图地址：/api/sites/<用户名>/<站名>/cover。
   *  返回的 site 里只有 owner（用户名），没有 author；拼不出来就返回空串，调用方退回渐变。 */
  function bannerCoverUrl(site) {
    const owner = (site.author && site.author.username) || site.owner || '';
    if (!owner || !site.name) return '';
    return '/api/sites/' + encodeURIComponent(owner) + '/' + encodeURIComponent(site.name) + '/cover';
  }

  /**
   * 自定义封面（管理后台给站点设的图）。站点有实时首屏 iframe 时不必要，
   * 只在 iframe 还没出来 / 站点没有作者名时兜一层，图挂了就退回大字。
   */
  function syncCover(url) {
    const img = el.querySelector('.bimg');
    if (!img) return;
    if (!url) {
      img.hidden = true;
      img.removeAttribute('src');
      return;
    }
    if (img.getAttribute('src') !== url) {
      img.onerror = () => { img.hidden = true; };
      img.onload = () => { img.hidden = false; };
      img.src = url;
    } else {
      img.hidden = false;
    }
  }

  el.querySelector('.prev')?.addEventListener('click', (e) => { e.stopPropagation(); go(idx - 1); });
  el.querySelector('.next')?.addEventListener('click', (e) => { e.stopPropagation(); go(idx + 1); });
  el.querySelectorAll('.bdots i').forEach((d) => {
    d.addEventListener('click', (e) => { e.stopPropagation(); go(Number(d.dataset.i)); });
  });

  function paint() {
    const b = list[idx];
    const title = b.title || b.site.title || b.site.name;
    const sub = b.subtitle || b.site.description || '';
    const coverUrl = b.site.hasCover ? bannerCoverUrl(b.site) : '';
    el.style.background = MP.grad(b.site);
    // 大字占位：没有自定义封面时当背景字用，有封面/有实时预览时由 CSS 淡出
    el.querySelector('.bchar').textContent = MP.initial(b.site);
    el.querySelector('.binfo b').textContent = title;
    el.querySelector('.binfo span').textContent = sub;
    el.querySelectorAll('.bdots i').forEach((d, i) => d.classList.toggle('on', i === idx));
    mountPreview(b, coverUrl);
  }

  function go(i) {
    idx = (i + list.length) % list.length;
    paint();
    restart();
  }
  function restart() {
    if (timer) clearInterval(timer);
    if (list.length < 2) return;
    timer = setInterval(() => { idx = (idx + 1) % list.length; paint(); }, 4500);
  }

  el.addEventListener('mouseenter', () => { if (timer) clearInterval(timer); timer = null; });
  el.addEventListener('mouseleave', restart);
  el.addEventListener('click', () => {
    location.href = '/view/' + encodeURIComponent(list[idx].site.owner)
      + '/' + encodeURIComponent(list[idx].site.name);
  });

  // 窗口缩放后 banner 的宽高都变了，缩放比例得重算：等尺寸稳定了再重建一次预览，
  // 否则画面会按旧比例拉伸（拖拽过程中每帧重建代价太高）。
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const b = list[idx];
      mountPreview(b, b.site.hasCover ? bannerCoverUrl(b.site) : '');
    }, 200);
  });

  // 先挂进文档再 paint：mountPreview 要读 clientWidth/Height，挂载前量到的是 0
  bannerArea.appendChild(el);
  paint();
  restart();
}

// ---------------------------------------------------------------- 分类 chips

function renderChips() {
  chipsBox.textContent = '';
  MP.TAGS.forEach((t) => {
    const el = document.createElement('span');
    el.className = 'chip' + (t.key === tag ? ' active' : '');
    el.textContent = t.label;
    el.addEventListener('click', () => { tag = t.key; page = 1; renderChips(); reload(); });
    chipsBox.appendChild(el);
  });
}

// ---------------------------------------------------------------- 侧栏收藏榜

// 数据来自 GET /api/rank/favorites：只收「至少被收藏过一次」的已上线站点，
// 按收藏数排。不够十条就少给几条；一条都没有时整段隐藏，
// 不拿 0 收藏的新站凑满一屏 —— 那等于编一份榜出来。
async function renderRank() {
  rankBox.textContent = '';
  try {
    const data = await MP.api('/api/rank/favorites');
    const list = data.sites || [];
    if (!list.length) { rankSec.hidden = true; return; }
    list.forEach((s, i) => {
      const row = document.createElement('div');
      row.className = 'rankItem';
      row.innerHTML = '<span class="no">' + (i + 1) + '</span>'
        + '<span class="rw">' + MP.esc(s.title || s.name) + '</span>'
        + '<span class="rv" title="' + s.favorites + ' 人收藏">' + MP.fmtNum(s.favorites) + '</span>';
      row.addEventListener('click', () => { location.href = MP.viewUrl(s); });
      rankBox.appendChild(row);
    });
  } catch (err) {
    rankBox.innerHTML = '<div class="empty">' + MP.esc(err.message) + '</div>';
  }
}

// ---------------------------------------------------------------- 翻页

/**
 * 渲染底部翻页器。数据来自接口的 total / page / pages 字段。
 * 只有一页时不渲染任何东西。页码窗口最多 7 个，超出用省略号——
 * 467 个站按 12 条一页有 39 页，直接把页码铺出来会把页面撑爆。
 */
function renderPager(total, pages) {
  pagerBox.textContent = '';
  if (pages <= 1) { pagerBox.hidden = true; return; }
  pagerBox.hidden = false;

  const cur = page;

  const slot = (label, to, opt) => {
    const o = opt || {};
    const el = document.createElement(o.disabled || o.active ? 'span' : 'button');
    if (el.tagName === 'BUTTON') el.type = 'button';
    el.className = 'pg' + (o.active ? ' active' : '') + (o.disabled ? ' disabled' : '');
    el.textContent = label;
    if (!o.disabled && !o.active && to != null) {
      el.addEventListener('click', () => {
        page = to;
        reload();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }
    pagerBox.appendChild(el);
  };
  const dots = () => {
    const s = document.createElement('span');
    s.className = 'pg dots';
    s.textContent = '…';
    pagerBox.appendChild(s);
  };

  slot('上一页', cur - 1, { disabled: cur <= 1 });

  if (pages <= 7) {
    for (let i = 1; i <= pages; i += 1) slot(String(i), i, { active: i === cur });
  } else {
    const start = Math.max(2, cur - 2);
    const end = Math.min(pages - 1, cur + 2);
    slot('1', 1, { active: cur === 1 });
    if (start > 2) dots();
    for (let i = start; i <= end; i += 1) slot(String(i), i, { active: i === cur });
    if (end < pages - 1) dots();
    slot(String(pages), pages, { active: cur === pages });
  }

  slot('下一页', cur + 1, { disabled: cur >= pages });
}

// ---------------------------------------------------------------- 列表

async function reload() {
  feedTitle.textContent = q ? '搜索：' + q
    : sortKind === 'favorites' ? '按收藏'
    : sortKind === 'views' ? '按浏览量' : '推荐';
  cardsBox.innerHTML = '<div class="empty" style="grid-column:1/-1">加载中…</div>';

  // 参数映射：服务端对非法参数只静默退化，所以 'hot' 这种前端伪标签必须显式换成 sort=views
  const search = new URLSearchParams();
  if (q) search.set('q', q);
  if (tag && tag !== 'hot') search.set('tag', tag);
  if (sortKind) search.set('sort', sortKind);
  else if (tag === 'hot') search.set('sort', 'views');
  search.set('page', String(page));
  search.set('size', '12');

  try {
    const data = await MP.api('/api/discover?' + search.toString());
    // 页码越界（比如从第 5 页切到只有 2 页的标签）时退回第一页
    if (!data.sites.length && page > 1) { page = 1; await reload(); return; }
    if (!data.sites.length) {
      cardsBox.innerHTML = '<div class="empty" style="grid-column:1/-1">没有找到相关页面，换个关键词试试。</div>';
      pagerBox.hidden = true;
      return;
    }
    MP.renderCards(cardsBox, data.sites);
    renderPager(data.total, data.pages);
  } catch (err) {
    cardsBox.innerHTML = '<div class="empty" style="grid-column:1/-1">' + MP.esc(err.message) + '</div>';
    pagerBox.hidden = true;
  }
}

mountBanner();
renderChips();
renderRank();
reload();
</script>
</body>
</html>
