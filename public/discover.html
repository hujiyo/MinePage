<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MinePage · 首页</title>
<link rel="stylesheet" href="/_assets/style.css">
</head>
<body>
<main class="page wide">
  <div id="bannerArea"></div>

  <div class="homeGrid">
    <div>
      <div class="secHead">
        <h2 id="feedTitle">推荐</h2>
        <a class="more" href="/?sort=rank">按浏览量查看 →</a>
      </div>
      <div class="chips" id="chips" style="margin-bottom:14px"></div>
      <div class="cards" id="cards"></div>
      <div class="pager" id="pager"></div>
    </div>

    <aside class="homeSide">
      <div>
        <div class="secHead">
          <h2>热门榜单</h2>
          <a class="more" href="/?sort=rank">更多</a>
        </div>
        <div class="rankList" id="rank"></div>
      </div>

      <div>
        <div class="secHead"><h2>热搜</h2></div>
        <div class="rankList" id="hot"></div>
      </div>

      <div class="panel">
        <b style="display:block;margin-bottom:6px">想让更多人看到你的页面？</b>
        <p class="muted" style="font-size:13px;margin:0 0 12px">
          上传一个 HTML，就是一个可被搜索、收藏、评论的站点。
        </p>
        <a href="/sites?tab=upload"><button type="button" class="block">去投稿</button></a>
      </div>
    </aside>
  </div>
</main>

<script src="/_assets/app.js"></script>
<script>
MP.topbar();

const params = new URLSearchParams(location.search);
const q = (params.get('q') || '').trim();
const sortRank = params.get('sort') === 'rank';
let tag = '';
let page = 1;
const SITE_PAGE_SIZE = 10; // 发现流每页卡片数（封面是整站 iframe，页大了首屏会很慢）

const chipsBox = document.getElementById('chips');
const cardsBox = document.getElementById('cards');
const pagerBox = document.getElementById('pager');
const feedTitle = document.getElementById('feedTitle');
const rankBox = document.getElementById('rank');
const hotBox = document.getElementById('hot');

// ---------------------------------------------------------------- 分类 chips

/**
 * 渲染分类 chips（词表来自 MP.TAGS，其中 '' 是「全部」、'hot' 是伪标签）。
 * 点击会改全局 tag、重绘自身并调用 reload() 重新拉列表——本函数只管视图，
 * 真正带参数的请求在 reload() 里，伪标签 hot 在那里被映射成 sort=views。
 */
function renderChips() {
  chipsBox.textContent = '';
  MP.TAGS.forEach((t) => {
    const el = document.createElement('span');
    el.className = 'chip' + (t.key === tag ? ' active' : '');
    el.textContent = t.label;
    el.addEventListener('click', () => { tag = t.key; page = 1; renderChips(); reload(); });
    chipsBox.appendChild(el);
  });
}

// ---------------------------------------------------------------- 侧栏

/**
 * 渲染右侧栏两块列表：「热门榜单」「热搜」。
 * 演示数据已删除：热搜词需要服务端搜索日志聚合（后端暂无接口），
 * 热门榜单后续可用 /api/discover?sort=views 取前 10 接上，前端均未接线，先给空态占位。
 */
function renderSide() {
  rankBox.innerHTML = '<div class="empty">暂无数据</div>';
  hotBox.innerHTML = '<div class="empty">暂无热搜</div>';
}

// ---------------------------------------------------------------- 列表

/**
 * 数据源：GET /api/discover（真实接口）
 *
 * 参数映射说明 —— 服务端对非法参数**不报错，只静默退化**，
 * 所以这里必须显式映射，不能直接透传：
 *
 *   q                直传
 *   tag=真实标签      直传（服务端白名单校验）
 *   tag='hot'        前端伪标签，服务端 SITE_TAGS 里没有 hot。
 *                    直接透传会被当成"不筛选"而返回全部（看着像成功），
 *                    所以换成 sort=views。「热门」的真正语义待定。
 *   ?sort=rank       服务端排序白名单是 views/likes/favorites/comments/newest，
 *                    **没有 rank**。同样会静默退化为默认排序，所以也映射到 views，
 *                    以保持「排行榜」这个入口原本的可见行为。
 */
async function reload() {
  const sort = (tag === 'hot' || sortRank) ? 'views' : '';
  const query = new URLSearchParams();
  if (q) query.set('q', q);
  if (tag && tag !== 'hot') query.set('tag', tag);
  if (sort) query.set('sort', sort);
  query.set('page', String(page));
  query.set('size', SITE_PAGE_SIZE);

  feedTitle.textContent = q ? '搜索：' + q : (tag === 'hot' ? '热门' : '推荐');
  cardsBox.innerHTML = '<div class="empty" style="grid-column:1/-1">加载中…</div>';
  pagerBox.textContent = '';

  try {
    const res = await fetch('/api/discover?' + query.toString(), { headers: { Accept: 'application/json' } });
    const data = await res.json();
    if (!data.ok) throw new Error(data.message || '加载失败');
    MP.renderCards(cardsBox, data.sites || []);
    renderPager(data);
  } catch (err) {
    cardsBox.innerHTML = '<div class="empty" style="grid-column:1/-1">'
      + '加载失败：' + MP.esc(err.message) + '，刷新试试。</div>';
  }
}

/**
 * 渲染底部翻页器。数据来自接口的 total / page / pages 字段。
 * 只有一页时不渲染任何东西。页码窗口最多 7 个，超出用省略号——
 * 467 个站按 10 条一页有 47 页，直接把页码铺出来会把页面撑爆。
 */
function renderPager(data) {
  pagerBox.textContent = '';
  const pages = data.pages || 1;
  const cur = data.page || 1;
  if (pages <= 1) return;

  const slot = (label, to, opt) => {
    const o = opt || {};
    const el = document.createElement(o.disabled || o.active ? 'span' : 'button');
    if (el.tagName === 'BUTTON') el.type = 'button';
    el.className = 'pg' + (o.active ? ' active' : '') + (o.disabled ? ' disabled' : '');
    el.textContent = label;
    if (!o.disabled && !o.active && to != null) {
      el.addEventListener('click', () => { page = to; reload(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
    }
    pagerBox.appendChild(el);
  };
  const dots = () => {
    const s = document.createElement('span');
    s.className = 'pg dots';
    s.textContent = '…';
    pagerBox.appendChild(s);
  };

  slot('上一页', cur - 1, { disabled: cur <= 1 });

  if (pages <= 7) {
    for (let i = 1; i <= pages; i += 1) slot(String(i), i, { active: i === cur });
  } else {
    const start = Math.max(2, cur - 2);
    const end = Math.min(pages - 1, cur + 2);
    slot('1', 1, { active: cur === 1 });
    if (start > 2) dots();
    for (let i = start; i <= end; i += 1) slot(String(i), i, { active: i === cur });
    if (end < pages - 1) dots();
    slot(String(pages), pages, { active: cur === pages });
  }

  slot('下一页', cur + 1, { disabled: cur >= pages });
}

// 轮播位（bannerArea）已留空：Banner 属运营配置，后端暂无接口，等配置接口就绪后再挂载。
renderChips();
renderSide();
reload();
</script>
</body>
</html>
