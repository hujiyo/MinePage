<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · MinePage</title>
<link rel="stylesheet" href="/_assets/style.css">
</head>
<body>
<main class="page narrow">
  <div class="panel" style="max-width:440px;margin:26px auto">
    <h1 class="center" style="margin:0 0 20px">登录 MinePage</h1>
    <div id="authForm"></div>
  </div>
</main>

<script src="/_assets/app.js"></script>
<script>
// 表单本身来自 app.js 的共享组件：弹窗与这个页面用的是同一份实现，
// 所以两边的校验、倒计时、错误提示不可能出现不一致。
MP.topbar({ active: '' });

MP.auth.mountForm(document.getElementById('authForm'), {
  initialTab: location.search.includes('tab=register') ? 'register' : 'login',
  /** 登录 / 注册成功后的去处：管理员进后台，普通用户回首页。 */
  onSuccess(user) {
    location.href = user && user.isAdmin ? '/admin' : '/';
  },
});
</script>
</body>
</html>
