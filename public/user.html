<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>创作者主页 · MinePage</title>
<link rel="stylesheet" href="/_assets/style.css">
</head>
<body>
<main class="page wide">
  <div id="notFound" class="empty" hidden>
    没有这个创作者。TA 可能还没设置用户名，或者账号已注销。<br><br><a href="/">回社区逛逛</a>
  </div>
  <div id="loadError" class="empty" hidden></div>

  <div id="page" hidden>
    <section class="uspace">
      <div class="ucover"></div>
      <div class="uinfo">
        <div class="avatar xl" id="avatar"></div>
        <div class="uwho">
          <b id="pName"></b>
          <div class="usub" id="pStats"></div>
        </div>
        <div class="ubtns" id="actions"></div>
      </div>
      <div class="utabs" id="utabs">
        <a data-tab="works" class="on">作品</a>
        <a data-tab="about">关于</a>
      </div>
    </section>

    <section id="tabWorks">
      <div class="chips" id="chips" style="margin:16px 0 4px"></div>
      <div class="cards" id="cards"></div>
    </section>

    <section id="tabAbout" hidden>
      <div class="panel" style="margin-top:16px">
        <h2>个人简介</h2>
        <p id="aboutBio" style="margin:0 0 16px"></p>
        <div class="stats" style="margin:0" id="aboutStats"></div>
      </div>
    </section>
  </div>
</main>

<script src="/_assets/app.js"></script>
<script>
MP.topbar();

// URL 里的用户名：/u/:用户名
const USERNAME = decodeURIComponent(location.pathname.replace(/^\/u\//, '').replace(/\/+$/, ''));

const notFoundBox = document.getElementById('notFound');
const loadErrorBox = document.getElementById('loadError');
const pageBox = document.getElementById('page');
const avatarBox = document.getElementById('avatar');
const nameBox = document.getElementById('pName');
const statsBox = document.getElementById('pStats');
const actionsBox = document.getElementById('actions');
const chipsBox = document.getElementById('chips');
const cardsBox = document.getElementById('cards');
const aboutBio = document.getElementById('aboutBio');
const aboutStats = document.getElementById('aboutStats');

let profile = null;   // 当前创作者
let tag = '';         // 作品标签筛选
let following = false;
let isOwn = false;
let followPending = false;

/**
 * 拉取真实创作者资料；404 表示用户不存在，其他错误交给启动流程显示。
 */
async function loadProfile() {
  const res = await fetch('/api/u/' + encodeURIComponent(USERNAME) + '/profile', {
    headers: { Accept: 'application/json' },
  });
  const data = await res.json().catch(() => null);
  if (res.status === 404) return null;
  if (!res.ok || !data?.ok || !data.user || !Array.isArray(data.sites)) {
    throw new Error(data?.message || '创作者资料加载失败，稍后再试。');
  }
  return data;
}

// ---------------------------------------------------------------- 头部

/**
 * 渲染创作者主页的头部与「关于」页：页面标题、头像首字、展示名、简介、统计条和关于页的数字。
 * 只处理头部与关于页；作品由 renderWorks 渲染。
 */
function renderProfile() {
  const { user, stats } = profile;
  const name = user.username;

  document.title = name + ' · MinePage';
  avatarBox.textContent = name.charAt(0).toUpperCase();
  nameBox.textContent = name;
  document.getElementById('aboutBio').textContent = user.bio || '这个人很懒，什么都没写。';

  statsBox.innerHTML = [
    ['粉丝', MP.fmtNum(stats.followers)],
    ['关注', stats.following],
    ['作品', stats.sites],
    ['总浏览', MP.fmtNum(stats.views)],
  ].map(([label, val]) => '<span><b>' + val + '</b> ' + label + '</span>').join('');

  renderActions();

  aboutStats.innerHTML = [
    ['粉丝', MP.fmtNum(stats.followers)],
    ['总浏览', MP.fmtNum(stats.views)],
    ['作品数', stats.sites],
  ].map(([label, val]) => '<div class="stat"><b>' + val + '</b><span>' + label + '</span></div>').join('');
}

/**
 * 重建头部操作区：自己的主页显示编辑资料，别人的主页显示真实关注状态。
 */
function renderActions() {
  actionsBox.textContent = '';

  if (isOwn) {
    const edit = document.createElement('a');
    edit.href = '/account';
    edit.innerHTML = MP.icon('edit') + ' 编辑资料';
    edit.className = 'badge';
    edit.style.padding = '6px 14px';
    actionsBox.appendChild(edit);
    return;
  }

  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = following ? 'ghost' : '';
  btn.textContent = following ? '已关注' : '+ 关注';
  btn.disabled = followPending;
  btn.addEventListener('click', async () => {
    if (followPending) return;
    followPending = true;
    btn.disabled = true;
    try {
      if (!(await MP.me())) {
        MP.auth.openLogin({});
        return;
      }
      const res = await fetch('/api/users/' + profile.user.id + '/follow', {
        method: following ? 'DELETE' : 'POST',
      });
      const data = await res.json().catch(() => null);
      if (!res.ok || !data?.ok) {
        if (res.status === 401) {
          MP.forgetSession();
          MP.auth.openLogin({});
        } else {
          MP.toast(data?.message || '操作失败，稍后再试');
        }
        return;
      }
      following = data.following === true;
      profile.stats.followers = data.followers;
      followPending = false;
      renderProfile();
      MP.toast(following ? '已关注' : '已取消关注');
    } catch {
      MP.toast('连不上服务器，稍后再试');
    } finally {
      followPending = false;
      btn.disabled = false;
    }
  });
  actionsBox.appendChild(btn);

  const message = document.createElement('a');
  message.href = '/messages?to=' + profile.user.id;
  message.className = 'badge';
  message.style.padding = '6px 14px';
  message.textContent = '私信';
  actionsBox.appendChild(message);
}

// ---------------------------------------------------------------- 作品

/**
 * 重建作品标签筛选条：只列出这个创作者真的有作品的标签（带条数），并高亮当前选中的 tag。
 * 点击会先改全局 tag，再同时重绘筛选条和作品列表——只重绘其中一个会让选中态和列表对不上。
 */
function renderChips() {
  chipsBox.textContent = '';
  chipsBox.appendChild(chip('全部 ' + profile.sites.length, tag === '', () => {
    tag = ''; renderChips(); renderWorks();
  }));
  MP.TAGS.forEach((t) => {
    const count = profile.sites.filter((s) => s.tag === t.key).length;
    if (!count) return;
    chipsBox.appendChild(chip(t.label + ' ' + count, tag === t.key, () => {
      tag = t.key; renderChips(); renderWorks();
    }));
  });
}

/**
 * 造一个可点的筛选标签（span.chip，active 控制高亮），返回未挂载的节点给调用方插入。
 * 文字用 textContent 写入，不必再转义；点击行为完全由 onClick 参数决定。
 */
function chip(label, active, onClick) {
  const el = document.createElement('span');
  el.className = 'chip' + (active ? ' active' : '');
  el.textContent = label;
  el.addEventListener('click', onClick);
  return el;
}

/**
 * 把当前创作者的作品按 tag 过滤后交给 MP.renderCards 渲染（tag 是空串表示不筛选）。
 * 依赖全局 profile 已就绪；过滤后为空时由 MP.renderCards 自己渲染「没有找到相关页面」占位。
 */
function renderWorks() {
  const sites = tag ? profile.sites.filter((s) => s.tag === tag) : profile.sites;
  if (!sites.length && !tag) {
    cardsBox.innerHTML = '<div class="empty" style="grid-column:1/-1">还没有公开作品</div>';
    return;
  }
  const { id, username } = profile.user;
  MP.renderCards(cardsBox, sites.map((site) => ({
    ...site,
    author: { id, name: username, username },
  })));
}

// ---------------------------------------------------------------- Tab 切换

document.getElementById('utabs').addEventListener('click', (e) => {
  const a = e.target.closest('a[data-tab]');
  if (!a) return;
  document.querySelectorAll('#utabs a').forEach((x) => x.classList.toggle('on', x === a));
  const tab = a.dataset.tab;
  document.getElementById('tabWorks').hidden = tab !== 'works';
  document.getElementById('tabAbout').hidden = tab !== 'about';
});

// ---------------------------------------------------------------- 启动

async function boot() {
  try {
    profile = await loadProfile();
    if (!profile) {
      notFoundBox.hidden = false;
      return;
    }
    isOwn = profile.isOwn === true;
    following = profile.isFollowing === true;
    pageBox.hidden = false;
    renderProfile();
    renderChips();
    renderWorks();
  } catch (error) {
    loadErrorBox.textContent = error.message || '创作者资料加载失败，稍后再试。';
    loadErrorBox.hidden = false;
  }
}

boot();
</script>
</body>
</html>
