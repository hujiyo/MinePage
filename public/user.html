<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>创作者主页 · MinePage</title>
<link rel="stylesheet" href="/_assets/style.css">
</head>
<body>
<main class="page wide">
  <div id="notFound" class="empty" hidden>
    没有这个创作者。TA 可能还没设置用户名，或者账号已注销。<br><br><a href="/">回社区逛逛</a>
  </div>

  <div id="page" hidden>
    <section class="uspace">
      <div class="ucover"></div>
      <div class="uinfo">
        <div class="avatar xl" id="avatar"></div>
        <div class="uwho">
          <b id="pName"></b>
          <div class="usub" id="pStats"></div>
        </div>
        <div class="ubtns" id="actions"></div>
      </div>
      <div class="utabs" id="utabs">
        <a data-tab="works" class="on">作品</a>
        <a data-tab="favs">收藏</a>
        <a data-tab="about">关于</a>
      </div>
    </section>

    <section id="tabWorks">
      <div class="chips" id="chips" style="margin:16px 0 4px"></div>

      <!-- 自己的作品可以批量删除；别人的主页不显示这一排 -->
      <div class="row" id="workOps" hidden style="margin-top:6px;gap:8px">
        <button class="tiny ghost" type="button" id="selectBtn">批量操作</button>
      </div>
      <div class="selBar" id="selBar" hidden>
        <label class="selItem"><input type="checkbox" id="pickAll"> 全选</label>
        <button class="selItem" type="button" id="batchDeleteBtn">删除</button>
        <span class="selCount" id="pickCount">已选择 0 个作品</span>
        <button class="selItem done" type="button" id="doneBtn">完成</button>
      </div>

      <div class="cards" id="cards"></div>
    </section>

    <section id="tabFavs" hidden>
      <div class="chips" id="favChips" style="margin:16px 0 4px"></div>
      <div class="cards" id="favCards"></div>
    </section>

    <section id="tabAbout" hidden>
      <div class="panel" style="margin-top:16px">
        <h2>个人简介</h2>
        <p id="aboutBio" style="margin:0 0 16px"></p>
        <div class="stats" style="margin:0" id="aboutStats"></div>
      </div>
    </section>
  </div>
</main>

<script src="/_assets/app.js"></script>
<script>
MP.topbar();

// URL 里的用户名：/qwq/:用户名（用户空间入口就是主页，没有 /u/ 这层）
const USERNAME = decodeURIComponent(location.pathname.split('/').filter(Boolean)[1] || '');

const notFoundBox = document.getElementById('notFound');
const pageBox = document.getElementById('page');
const avatarBox = document.getElementById('avatar');
const nameBox = document.getElementById('pName');
const statsBox = document.getElementById('pStats');
const actionsBox = document.getElementById('actions');
const chipsBox = document.getElementById('chips');
const cardsBox = document.getElementById('cards');
const workOps = document.getElementById('workOps');
const selBar = document.getElementById('selBar');
const pickAll = document.getElementById('pickAll');
const pickCount = document.getElementById('pickCount');
const batchDeleteBtn = document.getElementById('batchDeleteBtn');
const favTab = document.querySelector('#utabs a[data-tab="favs"]');
const favChipsBox = document.getElementById('favChips');
const favCardsBox = document.getElementById('favCards');
const aboutStats = document.getElementById('aboutStats');

let profile = null;   // 当前创作者（服务端返回的资料 + 站点）
let me = null;        // 当前登录用户（可能为 null）
let tag = '';         // 作品标签筛选
let favFolders = [];  // 自己的收藏夹（按后端 folder 分组）
let favFolder = 0;
let selecting = false;     // 作品是否处于批量操作模式（默认不显示勾选框）
const picked = new Set();  // 已勾选的作品站名

const sum = (list, key) => list.reduce((n, s) => n + (s[key] || 0), 0);

// ---------------------------------------------------------------- 头部

function renderProfile() {
  const { user, stats, sites } = profile;
  const isOwn = Boolean(me && me.id === user.id);

  document.title = user.username + ' · MinePage';
  avatarBox.textContent = String(user.username || '?').charAt(0).toUpperCase();
  nameBox.textContent = user.username;
  document.getElementById('aboutBio').textContent = user.bio || '这个人很懒，什么都没写。';

  statsBox.innerHTML = [
    ['粉丝', MP.fmtNum(stats.followers)],
    ['关注', MP.fmtNum(stats.following)],
    ['作品', stats.sites],
    ['总浏览', MP.fmtNum(stats.views)],
  ].map(([label, val]) => '<span><b>' + val + '</b> ' + label + '</span>').join('');

  renderActions(isOwn);

  // 点赞 / 被收藏没有聚合接口，按 TA 的公开站点求和（同一份数据，不额外请求）
  aboutStats.innerHTML = [
    ['获得点赞', MP.fmtNum(sum(sites, 'likes'))],
    ['被收藏', MP.fmtNum(sum(sites, 'favorites'))],
    ['作品数', stats.sites],
  ].map(([label, val]) => '<div class="stat"><b>' + val + '</b><span>' + label + '</span></div>').join('');

  // 收藏夹是私密的，只有本人能看；别人的主页不显示这个标签
  favTab.hidden = !isOwn;
  // 批量操作只对自己有用，别人的主页连入口都不显示
  if (!isOwn) {
    selecting = false;
    picked.clear();
  }
  syncWorksChrome();
}

function renderActions(isOwn) {
  actionsBox.textContent = '';

  if (isOwn) {
    const edit = document.createElement('a');
    edit.href = '/account';
    edit.innerHTML = MP.icon('edit') + ' 编辑资料';
    edit.className = 'badge';
    edit.style.padding = '6px 14px';
    actionsBox.appendChild(edit);
    return;
  }

  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = profile.isFollowing ? 'ghost' : '';
  btn.textContent = profile.isFollowing ? '已关注' : '+ 关注';
  btn.addEventListener('click', async () => {
    if (!(await MP.me())) {
      location.href = '/login?next=' + encodeURIComponent(location.pathname);
      return;
    }
    btn.disabled = true;
    try {
      const { following, followers } = await MP.api('/api/users/' + profile.user.id + '/follow', {
        method: profile.isFollowing ? 'DELETE' : 'POST',
      });
      profile.isFollowing = following;
      profile.stats.followers = followers;
      renderProfile();
      MP.toast(following ? '已关注' : '已取消关注');
    } catch (err) {
      MP.toast(err.message);
    } finally {
      btn.disabled = false;
    }
  });
  actionsBox.appendChild(btn);

  const msg = document.createElement('a');
  msg.href = '/messages?to=' + profile.user.id;
  msg.innerHTML = '<button type="button" class="ghost">' + MP.icon('message') + ' 私信</button>';
  actionsBox.appendChild(msg);
}

// ---------------------------------------------------------------- 作品

function chip(label, active, onClick) {
  const el = document.createElement('span');
  el.className = 'chip' + (active ? ' active' : '');
  el.textContent = label;
  el.addEventListener('click', onClick);
  return el;
}

function renderChips() {
  chipsBox.textContent = '';
  const sites = profile.sites;
  chipsBox.appendChild(chip('全部 ' + sites.length, tag === '', () => {
    tag = ''; picked.clear(); renderChips(); renderWorks();
  }));
  MP.TAGS.forEach((t) => {
    if (!t.key) return;
    const count = sites.filter((s) => s.tag === t.key).length;
    if (!count) return;
    chipsBox.appendChild(chip(t.label + ' ' + count, tag === t.key, () => {
      tag = t.key; picked.clear(); renderChips(); renderWorks();
    }));
  });
}

function renderWorks() {
  const sites = tag ? profile.sites.filter((s) => s.tag === tag) : profile.sites;
  const isOwn = Boolean(me && me.id === profile.user.id);
  if (!sites.length) {
    // 筛选后可能一个都不剩，勾选集合要跟着清掉，避免对不存在的作品操作
    picked.clear();
    cardsBox.innerHTML = '<div class="empty" style="grid-column:1/-1">'
      + (tag ? '这个标签下还没有页面。' : '还没有发布任何页面。') + '</div>';
    syncWorksChrome();
    renderPickBar(sites);
    return;
  }
  // 自己的主页多一排「编辑 / 删除」，别人看到的是普通卡片
  MP.renderCards(cardsBox, sites, isOwn ? { manage: true, onDelete: afterDelete } : undefined);
  if (isOwn && selecting) mountPickers(sites);
  syncWorksChrome();
  renderPickBar(sites);
}

/** 切换「批量操作」入口和批量操作条：批量模式下才显示勾选框和工具栏。 */
function syncWorksChrome() {
  const isOwn = Boolean(profile && me && me.id === profile.user.id);
  // 一个作品都没有时不给入口，省得点进去只有一个空态
  const canSelect = isOwn && profile.sites.length > 0;
  workOps.hidden = !canSelect || selecting;
  selBar.hidden = !(canSelect && selecting);
}

/** 刷新批量操作条：已选数量、全选状态、按钮可用性。 */
function renderPickBar(sites) {
  pickCount.textContent = '已选择 ' + picked.size + ' 个作品';
  pickAll.checked = sites.length > 0 && picked.size === sites.length;
  pickAll.indeterminate = picked.size > 0 && picked.size < sites.length;
  pickAll.disabled = sites.length === 0;
  batchDeleteBtn.disabled = picked.size === 0;
}

/** 给卡片挂勾选框（renderCards 不支持扩展，渲染完再补）。 */
function mountPickers(sites) {
  const cards = cardsBox.querySelectorAll('.vcard');
  sites.forEach((s, i) => {
    const card = cards[i];
    if (!card) return;
    card.classList.toggle('picked', picked.has(s.name));

    const label = document.createElement('label');
    label.className = 'pick';
    label.title = '选中后可批量删除';
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = picked.has(s.name);
    box.addEventListener('change', () => {
      if (box.checked) picked.add(s.name);
      else picked.delete(s.name);
      card.classList.toggle('picked', box.checked);
      renderPickBar(sites);
    });
    label.appendChild(box);
    card.appendChild(label);
  });
}

/** 删除成功后本地同步：列表、作品数、标签筛选一起刷新，不重新请求接口。 */
function afterDelete(site) {
  profile.sites = profile.sites.filter((s) => s !== site);
  profile.stats.sites = Math.max(0, (profile.stats.sites || 1) - 1);
  picked.delete(site.name);
  // 当前筛选的标签下已经没有作品了就退回「全部」
  if (tag && !profile.sites.some((s) => s.tag === tag)) tag = '';
  renderProfile();
  renderChips();
  renderWorks();
}

// ---------------------------------------------------------------- 作品批量操作

document.getElementById('selectBtn').addEventListener('click', () => {
  selecting = true;
  picked.clear();
  renderWorks();
  MP.toast('勾选要删除的作品，或点「全选」');
});

document.getElementById('doneBtn').addEventListener('click', () => {
  selecting = false;
  picked.clear();
  renderWorks();
});

pickAll.addEventListener('change', () => {
  const sites = tag ? profile.sites.filter((s) => s.tag === tag) : profile.sites;
  picked.clear();
  if (pickAll.checked) sites.forEach((s) => picked.add(s.name));
  renderWorks();
});

batchDeleteBtn.addEventListener('click', async () => {
  if (!picked.size) return;
  if (!window.confirm('确定删除选中的 ' + picked.size + ' 个作品？删了就找不回来了。')) return;
  // 逐个调已有的删除接口：中途失败也能知道哪些已经删掉了
  const failed = [];
  const done = [];
  batchDeleteBtn.disabled = true;
  for (const name of Array.from(picked)) {
    const site = profile.sites.find((s) => s.name === name);
    if (!site) { picked.delete(name); continue; }
    try {
      await MP.api(MP.siteApi(site), { method: 'DELETE' });
      done.push(site);
      picked.delete(name);
    } catch {
      failed.push(site.title || name);
    }
  }
  batchDeleteBtn.disabled = false;

  if (done.length) {
    done.forEach((site) => {
      profile.sites = profile.sites.filter((s) => s !== site);
    });
    profile.stats.sites = Math.max(0, (profile.stats.sites || done.length) - done.length);
    if (tag && !profile.sites.some((s) => s.tag === tag)) tag = '';
    if (!profile.sites.length) selecting = false;
    renderProfile();
    renderChips();
    renderWorks();
  }

  if (failed.length) MP.toast('删除失败：' + failed.join('、'));
  else if (done.length) MP.toast('已删除 ' + done.length + ' 个作品');
});

// ---------------------------------------------------------------- 我的收藏

async function loadFavs() {
  try {
    const data = await MP.api('/api/favorites');
    // 后端平铺返回，按 folder 字段分组
    const map = new Map();
    data.sites.forEach((s) => {
      const name = s.folder || '默认收藏夹';
      if (!map.has(name)) map.set(name, []);
      map.get(name).push(s);
    });
    favFolders = [...map.entries()].map(([name, sites]) => ({ name, sites }));
    if (!favFolders.length) favFolders = [{ name: '默认收藏夹', sites: [] }];
    renderFavs();
  } catch (err) {
    favCardsBox.innerHTML = '<div class="empty">' + MP.esc(err.message) + '</div>';
  }
}

function renderFavs() {
  favChipsBox.textContent = '';
  favFolders.forEach((f, i) => {
    favChipsBox.appendChild(chip(f.name + ' ' + f.sites.length, favFolder === i, () => {
      favFolder = i; renderFavs();
    }));
  });
  const sites = favFolders[favFolder]?.sites ?? [];
  if (!sites.length) {
    favCardsBox.innerHTML = '<div class="empty" style="grid-column:1/-1">这个收藏夹还是空的。</div>';
    return;
  }
  MP.renderCards(favCardsBox, sites);
}

// ---------------------------------------------------------------- Tab 切换

document.getElementById('utabs').addEventListener('click', (e) => {
  const a = e.target.closest('a[data-tab]');
  if (!a || a.hidden) return;
  document.querySelectorAll('#utabs a').forEach((x) => x.classList.toggle('on', x === a));
  const tab = a.dataset.tab;
  document.getElementById('tabWorks').hidden = tab !== 'works';
  document.getElementById('tabFavs').hidden = tab !== 'favs';
  document.getElementById('tabAbout').hidden = tab !== 'about';
  if (tab === 'favs' && !favFolders.length) loadFavs();
});

// ---------------------------------------------------------------- 启动

(async () => {
  me = await MP.me();

  try {
    profile = await MP.api('/api/u/' + encodeURIComponent(USERNAME) + '/profile');
  } catch (err) {
    notFoundBox.hidden = false;
    return;
  }

  pageBox.hidden = false;
  renderProfile();
  renderChips();
  renderWorks();
})();
</script>
</body>
</html>
