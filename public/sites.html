<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>创作中心 · MinePage</title>
<link rel="stylesheet" href="/_assets/style.css">
</head>
<body>
<main class="page">
  <div class="secHead">
    <h1 style="margin:0">创作中心</h1>
    <a href="/upload"><button type="button" class="tiny">+ 投稿新页面</button></a>
  </div>
  <p class="sub">这里是你发布过的所有页面，可以访问、编辑或删除。</p>

  <!-- 统计条 -->
  <div class="stats">
    <div class="stat"><b id="statSites">–</b><span>站点</span></div>
    <div class="stat"><b id="statFiles">–</b><span>文件</span></div>
    <div class="stat"><b id="statSize">–</b><span>总大小</span></div>
  </div>

  <div class="rows" id="siteList" style="margin-top:16px"></div>
  <div id="sitesEmpty" class="empty" hidden>还没有页面，去 <a href="/upload">上传站点</a>。</div>

  <div id="msg" class="result" hidden></div>
</main>

<script src="/_assets/app.js"></script>
<script>
MP.topbar({ active: 'upload' });

const msg = document.getElementById('msg');

function fmtSize(n) {
  if (n >= 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + ' MB';
  if (n >= 1024) return (n / 1024).toFixed(1) + ' KB';
  return n + ' B';
}

function showMsg(ok, text) {
  msg.hidden = false;
  msg.className = 'result ' + (ok ? 'ok' : 'err');
  msg.textContent = text;
}

// ---------------------------------------------------------------- 站点列表

function renderSites(sites) {
  const wrap = document.getElementById('siteList');
  const empty = document.getElementById('sitesEmpty');
  wrap.textContent = '';
  empty.hidden = sites.length !== 0;

  let files = 0;
  let size = 0;

  sites.forEach((site) => {
    files += site.fileCount;
    size += site.totalSize;

    const row = document.createElement('div');
    row.className = 'rowItem';

    // 缩略图：渐变 + 标题首字
    const thumb = document.createElement('div');
    thumb.className = 'rthumb';
    thumb.style.background = MP.grad(site);
    thumb.textContent = MP.initial(site);
    row.appendChild(thumb);

    const grow = document.createElement('div');
    grow.className = 'grow';

    const t = document.createElement('div');
    t.className = 't';
    const a = document.createElement('a');
    a.href = '/view/' + encodeURIComponent(site.name);
    a.textContent = site.title || '/' + site.name;
    t.appendChild(a);
    t.appendChild(document.createTextNode(' '));

    if (site.tag) {
      const tagTag = document.createElement('span');
      tagTag.className = 'badge tag';
      tagTag.textContent = site.tagLabel;
      t.appendChild(tagTag);
      t.appendChild(document.createTextNode(' '));
    }
    const statusTag = document.createElement('span');
    statusTag.className = 'badge' + (site.status === 'active' ? ' ok' : ' bad');
    statusTag.textContent = site.status === 'active' ? '正常' : '已下线';
    t.appendChild(statusTag);
    grow.appendChild(t);

    const d = document.createElement('div');
    d.className = 'd';
    d.textContent = (site.kind === 'multi' ? '多页 · ' + site.fileCount + ' 个文件' : '单页')
      + ' · ' + fmtSize(site.totalSize)
      + ' · 更新于 ' + new Date(site.updatedAt).toLocaleString('zh-CN');
    grow.appendChild(d);

    row.appendChild(grow);

    const actions = document.createElement('div');
    actions.className = 'row';
    actions.style.cssText = 'gap:8px;flex:none';

    const view = document.createElement('a');
    view.href = '/' + site.name;
    view.target = '_blank';
    view.rel = 'noopener';
    view.innerHTML = '<button type="button" class="ghost tiny">访问</button>';
    actions.appendChild(view);

    const edit = document.createElement('a');
    edit.href = '/edit/' + site.name;
    edit.innerHTML = '<button type="button" class="ghost tiny">编辑</button>';
    actions.appendChild(edit);

    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'danger tiny';
    del.textContent = '删除';
    del.addEventListener('click', async () => {
      if (!confirm('确定删除 /' + site.name + ' ？删了就找不回来了。')) return;
      const res = await fetch('/api/sites/' + site.name, { method: 'DELETE' });
      const data = await res.json();
      if (data.ok) {
        showMsg(true, '已删除 /' + site.name);
        loadSites();
      } else {
        showMsg(false, data.message || '删除失败');
      }
    });
    actions.appendChild(del);
    row.appendChild(actions);

    wrap.appendChild(row);
  });

  document.getElementById('statSites').textContent = sites.length;
  document.getElementById('statFiles').textContent = files;
  document.getElementById('statSize').textContent = fmtSize(size);
}

async function loadSites() {
  try {
    const res = await fetch('/api/sites');
    const data = await res.json();
    if (data.ok) renderSites(data.sites);
  } catch { /* 静默：统计保持占位符 */ }
}

// ---------------------------------------------------------------- 启动

MP.me().then((me) => {
  if (!me) { location.href = '/login'; return; }
  loadSites();
});
</script>
</body>
</html>
