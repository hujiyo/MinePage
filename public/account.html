<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人中心 · MinePage</title>
<link rel="stylesheet" href="/_assets/style.css">
<link rel="stylesheet" href="/_assets/account.css">
</head>
<body>
<main class="page">
  <h1>个人中心</h1>
  <p class="sub">管理你的账号信息。页面在 <a href="/sites">页面管理</a> 里。</p>

  <!-- 身份卡片 -->
  <div class="panel">
    <div class="profile">
      <div class="avatar lg" id="avatar">?</div>
      <div class="who">
        <b><span id="whoName">…</span> <span class="badge admin" id="whoAdmin" hidden>管理员</span></b>
        <span id="whoEmail"></span> · <span id="whoSince" class="muted"></span>
        <div id="whoBio" class="bio" hidden></div>
      </div>
    </div>
  </div>

  <section class="panel" id="coinSection">
    <h2>硬币</h2>
    <p class="muted" style="font-size:13px">
      每天第一次打开网站会自动领到硬币，可以投给别人的页面（每人每页最多 2 枚）。
      投出去的币会等额进入作者余额，作者可以再拿它换更多站点名额。
    </p>
    <div class="coinBox">
      <div class="coinBig"><b id="coinBalance">0</b><span>枚硬币</span></div>
      <div class="coinMeta">
        <div>站点配额：<b id="coinQuota">–</b></div>
        <div>累计获赠：<b id="coinReceived">0</b> 枚</div>
      </div>
    </div>
    <div class="coinActs">
      <button type="button" id="redeemQuota" class="ghost">花 5 枚换 +1 个站点名额</button>
      <span class="hint" id="redeemHint"></span>
    </div>
    <h3 class="coinLedgerTitle">最近流水</h3>
    <ul class="coinLedger" id="coinLedger"><li class="empty">还没有流水。</li></ul>
  </section>

  <section class="panel">
    <h2>个人简介</h2>
    <form id="bioForm" novalidate>
      <label class="field">
        <span class="label">简介 / 想说的话</span>
        <textarea id="bioInput" class="area" maxlength="200"
                  placeholder="向大家介绍一下自己，或写点想说的话"></textarea>
        <span class="hint">最多 200 字，之后会展示在社区里；留空表示清除</span>
      </label>
      <button type="submit" id="bioSubmit">保存简介</button>
    </form>
  </section>

  <section class="panel">
    <h2>用户名</h2>
    <form id="nameForm" novalidate>
      <label class="field">
        <span class="label">用户名</span>
        <input id="nameInput" type="text" autocomplete="off" spellcheck="false" maxlength="32">
        <span class="hint">小写字母、数字、连字符，3–32 位。你所有页面的地址都是 /qwq/<b>用户名</b>/站名，
          主页地址为 /qwq/用户名。<b>改用户名后所有依赖旧名字的链接都会失效</b>，旧链接直接 404。</span>
      </label>
      <button type="submit" id="nameSubmit">保存用户名</button>
    </form>
  </section>

  <section class="panel">
    <h2>注销账号</h2>
    <p class="muted" style="font-size:13px">
      注销后账号和你名下的<b>所有页面、文件、评论、私信、MCP 密钥</b>都会被永久删除，找不回来。
    </p>
    <form id="deleteForm" novalidate>
      <label class="field">
        <span class="label">输入密码确认</span>
        <input id="deletePass" type="password" autocomplete="current-password">
      </label>
      <button type="submit" class="danger" id="deleteSubmit">永久注销账号</button>
    </form>
  </section>

  <section class="panel">
    <h2>修改密码</h2>
    <form id="passForm" novalidate>
      <label class="field">
        <span class="label">当前密码</span>
        <input id="oldPass" type="password" autocomplete="current-password">
      </label>
      <label class="field">
        <span class="label">新密码</span>
        <input id="newPass" type="password" autocomplete="new-password">
        <span class="hint">至少 6 位。带邮箱验证码的更安全的方式在 <a href="/settings">账号设置</a> 里。</span>
      </label>
      <button type="submit" id="passSubmit">修改密码</button>
    </form>
  </section>

  <div id="msg" class="result" hidden></div>
</main>

<script src="/_assets/app.js"></script>
<script>
MP.topbar();

const msg = document.getElementById('msg');

/**
 * 在页面底部显示一条结果（ok 决定绿色 / 红色配色），纯文本写入，每次调用覆盖上一条。
 */
function showMsg(ok, text) {
  msg.hidden = false;
  msg.className = 'result ' + (ok ? 'ok' : 'err');
  msg.textContent = text;
}

/**
 * POST JSON 的薄封装：把 payload 序列化成请求体，返回解析后的响应 JSON。
 * 不看 HTTP 状态码、也不吞异常，所以调用方要用 try/catch 兜网络错，
 * 并靠返回体里的 ok 字段判断成功与否（服务端即使 400 也会带 ok:false 和 message）。
 */
async function postJson(url, payload) {
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  return res.json();
}

// ---------------------------------------------------------------- 身份

/**
 * 把 /api/me 拿到的用户渲染进身份卡片（头像首字、展示名、管理员角标、邮箱、注册时间、简介），
 * 并回填用户名和简介两个表单的初值。
 * 只读参数、不发请求；头像取 username，没设置过就退回邮箱；用户名输入框的 placeholder
 * 会按「已设置 / 未设置」切换措辞。
 */
function renderMe(me) {
  const label = me.username || me.email;
  document.getElementById('avatar').textContent = label.charAt(0).toUpperCase();
  document.getElementById('whoName').textContent = me.username;
  document.getElementById('whoAdmin').hidden = !me.isAdmin;
  document.getElementById('whoEmail').textContent = me.email;
  document.getElementById('whoSince').textContent =
    '注册于 ' + new Date(me.createdAt).toLocaleDateString('zh-CN');
  document.getElementById('nameInput').value = me.username || '';
  document.getElementById('bioInput').value = me.bio || '';

  const bioEl = document.getElementById('whoBio');
  bioEl.hidden = !me.bio;
  bioEl.textContent = me.bio || '';
}

// ---------------------------------------------------------------- 账号设置

document.getElementById('nameForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const button = document.getElementById('nameSubmit');
  button.disabled = true;

  try {
    const data = await postJson('/api/account/username', {
      username: document.getElementById('nameInput').value,
    });
    if (data.ok) {
      showMsg(true, '用户名已保存：' + data.username + '。旧地址已经失效，记得更新分享出去的链接。');
      const me = await (await fetch('/api/me')).json();
      if (me.user) renderMe(me.user, me.unread);
      MP.toast('已保存');
    } else {
      showMsg(false, data.message || '保存失败');
    }
  } catch (err) {
    showMsg(false, '网络出问题了：' + err.message);
  } finally {
    button.disabled = false;
  }
});

document.getElementById('bioForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const button = document.getElementById('bioSubmit');
  button.disabled = true;

  try {
    const data = await postJson('/api/account/bio', {
      bio: document.getElementById('bioInput').value,
    });
    if (data.ok) {
      showMsg(true, data.bio ? '简介已保存' : '简介已清除');
      const bioEl = document.getElementById('whoBio');
      bioEl.hidden = !data.bio;
      bioEl.textContent = data.bio || '';
      MP.toast('已保存');
    } else {
      showMsg(false, data.message || '保存失败');
    }
  } catch (err) {
    showMsg(false, '网络出问题了：' + err.message);
  } finally {
    button.disabled = false;
  }
});

document.getElementById('passForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const button = document.getElementById('passSubmit');
  button.disabled = true;

  try {
    const data = await postJson('/api/account/password', {
      currentPassword: document.getElementById('oldPass').value,
      newPassword: document.getElementById('newPass').value,
    });
    if (data.ok) {
      showMsg(true, '密码已修改');
      document.getElementById('passForm').reset();
    } else {
      showMsg(false, data.message || '修改失败');
    }
  } catch (err) {
    showMsg(false, '网络出问题了：' + err.message);
  } finally {
    button.disabled = false;
  }
});

document.getElementById('deleteForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!confirm('确定注销账号吗？你名下所有页面和文件都会被永久删除，找不回来。')) return;

  const button = document.getElementById('deleteSubmit');
  button.disabled = true;

  try {
    const data = await postJson('/api/account/delete', {
      password: document.getElementById('deletePass').value,
    });
    if (data.ok) {
      alert('账号已注销。');
      location.href = '/';
    } else {
      showMsg(false, data.message || '注销失败');
    }
  } catch (err) {
    showMsg(false, '网络出问题了：' + err.message);
  } finally {
    button.disabled = false;
  }
});

// ---------------------------------------------------------------- 硬币

const LEDGER_TEXT = {
  register: '注册赠送',
  signin: '每日签到',
  received: '页面收到投币',
  charge: '给别的页面投币',
  quota: '兑换站点名额',
};

/** 把 /api/coins 的余额 / 配额 / 流水渲染进硬币面板。 */
function renderCoins(data) {
  document.getElementById('coinBalance').textContent = MP.fmtNum(data.balance ?? 0);
  document.getElementById('coinQuota').textContent = data.quota ?? '–';
  document.getElementById('coinReceived').textContent = MP.fmtNum(data.received ?? 0);

  const list = document.getElementById('coinLedger');
  list.textContent = '';
  const rows = data.ledger ?? [];
  if (!rows.length) {
    const li = document.createElement('li');
    li.className = 'empty';
    li.textContent = '还没有流水。';
    list.appendChild(li);
    return;
  }
  rows.forEach((row) => {
    const li = document.createElement('li');
    const sign = row.delta > 0 ? '+' : '';
    const cls = row.delta > 0 ? 'plus' : 'minus';
    li.innerHTML = '<span class="why">' + MP.esc(LEDGER_TEXT[row.reason] || row.reason) + '</span>'
      + '<span class="amt ' + cls + '">' + sign + row.delta + '</span>'
      + '<span class="when">' + MP.timeAgo(row.at) + '</span>';
    list.appendChild(li);
  });

  // 余额不够就禁用兑换按钮，把原因写在旁边
  const redeem = document.getElementById('redeemQuota');
  const hint = document.getElementById('redeemHint');
  redeem.disabled = (data.balance ?? 0) < 5;
  hint.textContent = redeem.disabled ? '硬币还不够 5 枚' : '';
}

async function loadCoins() {
  try {
    const res = await fetch('/api/coins');
    const data = await res.json();
    if (data.ok) renderCoins(data);
  } catch { /* 拉不到就保持面板初始的空态 */ }
}

document.getElementById('redeemQuota').addEventListener('click', async () => {
  const button = document.getElementById('redeemQuota');
  button.disabled = true;
  try {
    const data = await postJson('/api/coins/quota', {});
    if (data.ok) {
      MP.toast('兑换成功，现在可以建 ' + data.quota + ' 个页面了');
      await loadCoins();
    } else {
      MP.toast(data.message || '兑换失败');
    }
  } catch (err) {
    MP.toast('网络出问题了：' + err.message);
  } finally {
    button.disabled = false;
  }
});

// ---------------------------------------------------------------- 启动

(async () => {
  let me = null;
  try {
    const data = await (await fetch('/api/me')).json();
    me = data.user;
  } catch { me = null; }

  if (!me) {
    location.href = '/login';
    return;
  }

  renderMe(me);
  await loadCoins();
})();
</script>
</body>
</html>
