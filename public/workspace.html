<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作区 · MinePage</title>
<link rel="stylesheet" href="/_assets/style.css">
</head>
<body class="wsBody">
<main class="wsShell">
  <header class="wsHead">
    <div class="wsHeadL">
      <a class="wsBack" href="/sites" title="回创作页">←</a>
      <span class="wsTitle" id="wsTitle">草稿</span>
      <span class="badge" id="wsBadge">草稿</span>
    </div>
    <div class="wsHeadR">
      <button type="button" class="ghost tiny" id="openDraft">打开草稿</button>
      <button type="button" class="ghost tiny" id="exportBtn">导出</button>
      <button type="button" class="ghost tiny" id="historyBtn">历史</button>
      <button type="button" class="wsPub" id="publish">发布</button>
    </div>
  </header>

  <div class="wsMain">
    <aside class="wsSide" id="wsSide">
      <div class="wsSideHead">
        <span>会话</span>
        <button type="button" class="tiny ghost" id="newThread" title="开一个新对话">＋ 新对话</button>
      </div>
      <div class="wsThreadList" id="threadList"></div>
    </aside>

    <div class="wsGrip" id="gripSide" role="separator" aria-orientation="vertical"
         title="拖动调整会话栏宽度，双击恢复默认"></div>

    <aside class="wsChat" id="wsChat">
      <div class="wsChatHead">
        <button type="button" class="wsToggle" id="sideToggle" title="收起会话栏 Ctrl+B" aria-label="收起会话栏">
          <span class="wsToggleIcon" aria-hidden="true"></span>
        </button>
        <span class="wsChatTitle" id="chatTitle">对话</span>
        <button type="button" class="wsChatMore" id="chatMore" title="当前对话的更多操作"
                aria-label="当前对话的更多操作" aria-haspopup="menu">
          <span aria-hidden="true">···</span>
        </button>
      </div>
      <div class="wsMsgs" id="msgs"></div>
      <div class="wsComposer">
        <!-- 待发送的图片：粘进来 / 选进来就挂在这条里，对话区被往上顶 -->
        <div class="wsAttachBar" id="attachBar" hidden>
          <div class="wsAttachList" id="attachList"></div>
          <div class="wsAttachHint" id="attachHint"></div>
        </div>
        <textarea id="input" rows="1" placeholder="说说要改什么…（可以直接粘贴图片）"></textarea>
        <div class="wsBar">
          <button type="button" class="iconBtn" id="plus" title="添加图片（也可以直接粘贴）">＋</button>
          <input type="file" id="filePick" accept="image/png,image/jpeg,image/webp,image/gif"
                 multiple hidden>
          <!-- 模型与模式是两个独立的上拉框，各自管各自的，不掺在一个弹窗里 -->
          <button type="button" class="wsPick" id="modelPick" title="选择模型" aria-haspopup="listbox">
            <span class="wsPickLabel" id="modelPickLabel">未接模型</span>
            <span class="wsPickCaret" aria-hidden="true">⌃</span>
          </button>
          <button type="button" class="wsPick" id="modePick" title="选择模式" aria-haspopup="listbox">
            <span class="wsPickLabel" id="modePickLabel">编码</span>
            <span class="wsPickCaret" aria-hidden="true">⌃</span>
          </button>
          <button type="button" class="miniChip" id="skill">技能</button>
          <span class="spacer"></span>
          <button type="button" class="sendBtn" id="send" title="发送（Enter）">↑</button>
        </div>
      </div>
    </aside>

    <div class="wsGrip" id="gripChat" role="separator" aria-orientation="vertical"
         title="拖动调整对话栏宽度，双击恢复默认"></div>

    <section class="wsPane">
      <div class="wsTabs">
        <div class="wsTabBtns">
          <button type="button" class="wsTab on" data-tab="preview">预览</button>
          <button type="button" class="wsTab" data-tab="code">代码</button>
        </div>
        <button type="button" class="wsReload" id="reload" title="刷新预览">↻</button>
      </div>

      <div class="wsView" id="viewPreview">
        <iframe id="frame" class="wsFrame" sandbox="allow-scripts allow-forms allow-popups"
                referrerpolicy="no-referrer" title="草稿预览"></iframe>
      </div>

      <div class="wsView" id="viewCode" hidden>
        <div class="wsCode">
          <div class="wsFiles">
            <div class="wsFilesHead">文件</div>
            <div class="wsFileList" id="fileList"></div>
          </div>
          <div class="wsEditor">
            <div class="wsEditHead">
              <span class="wsEditPath" id="editPath">未选择文件</span>
              <span class="spacer"></span>
              <span class="muted wsEditState" id="editState"></span>
              <button type="button" class="tiny" id="saveFile" disabled>保存</button>
            </div>
            <div class="wsEditBody" id="editBody">
              <div class="wsEditEmpty" id="editEmpty">从左边的文件列表里选一个文件</div>
              <div class="wsCodeWrap" id="codeWrap" hidden>
                <pre class="wsGutter" id="gutter" aria-hidden="true"></pre>
                <textarea id="code" spellcheck="false" wrap="off" aria-label="文件内容"></textarea>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
</main>

<script src="/_assets/app.js"></script>
<script src="/_assets/studio.js"></script>
<script>
const NAME = decodeURIComponent(location.pathname.split('/').pop());
let USERNAME = '';
let SITE = { name: NAME, status: 'draft', title: '' };
let FILES = [];
let currentPath = '';
let savedText = '';
let dirty = false;
let sending = false;

// 会话
let THREADS = [];
let threadId = 0;          // 当前会话；0 表示还没选（首次进来自动落到最近一个）

const msgs = document.getElementById('msgs');
const input = document.getElementById('input');
const send = document.getElementById('send');
const frame = document.getElementById('frame');
const fileList = document.getElementById('fileList');
const code = document.getElementById('code');
const gutter = document.getElementById('gutter');
const editPath = document.getElementById('editPath');
const editState = document.getElementById('editState');
const saveFile = document.getElementById('saveFile');
const codeWrap = document.getElementById('codeWrap');
const editEmpty = document.getElementById('editEmpty');
const threadList = document.getElementById('threadList');
const modelPick = document.getElementById('modelPick');
const modelPickLabel = document.getElementById('modelPickLabel');
const modePick = document.getElementById('modePick');
const modePickLabel = document.getElementById('modePickLabel');
const attachBar = document.getElementById('attachBar');
const attachList = document.getElementById('attachList');
const attachHint = document.getElementById('attachHint');
const plus = document.getElementById('plus');
const filePick = document.getElementById('filePick');
const wsSide = document.getElementById('wsSide');
const wsChat = document.getElementById('wsChat');
const gripSide = document.getElementById('gripSide');
const gripChat = document.getElementById('gripChat');
const sideToggle = document.getElementById('sideToggle');
const chatTitle = document.getElementById('chatTitle');
const chatMore = document.getElementById('chatMore');

if (!/^[a-z0-9-]+$/.test(NAME)) location.href = '/sites';

MP.topbar({ active: 'create' });
MP.autoGrow(input);

/* ---------------------------------------------------------------- 三栏宽度与折叠 */

// 三块区域的宽度记在 localStorage：同一台机器上换个草稿进来还是自己调好的比例。
// 只存 px 不存百分比：窗口缩放时按百分比换算会让「我调好的对话栏」忽然变宽变窄。
const LAYOUT_KEY = 'mp.wsLayout';
const LAYOUT_DEFAULT = { side: 200, chat: 380, sideHidden: false };
const SIDE_MIN = 140;
const CHAT_MIN = 280;
const PANE_MIN = 320;   // 预览区至少留这么宽，否则调宽度时会把预览挤没

let layout = { ...LAYOUT_DEFAULT };

function readLayout() {
  try {
    const raw = JSON.parse(localStorage.getItem(LAYOUT_KEY) || '{}');
    const pick = (v, def, min) => (Number.isFinite(v) ? Math.max(min, Math.round(v)) : def);
    return {
      side: pick(raw.side, LAYOUT_DEFAULT.side, SIDE_MIN),
      chat: pick(raw.chat, LAYOUT_DEFAULT.chat, CHAT_MIN),
      sideHidden: Boolean(raw.sideHidden),
    };
  } catch {
    return { ...LAYOUT_DEFAULT };
  }
}

function saveLayout() {
  try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(layout)); } catch { /* 无痕模式等 */ }
}

/** 把当前 layout 应用到 DOM 上。折叠时侧栏宽度归零、拖条一起藏起来。 */
function applyLayout() {
  document.querySelector('.wsMain').classList.toggle('sideHidden', layout.sideHidden);
  wsSide.style.width = layout.sideHidden ? '0px' : layout.side + 'px';
  wsChat.style.width = layout.chat + 'px';
  gripSide.hidden = layout.sideHidden;
  syncToggle();
}

function syncToggle() {
  sideToggle.classList.toggle('collapsed', layout.sideHidden);
  const label = layout.sideHidden ? '展开会话栏 Ctrl+B' : '收起会话栏 Ctrl+B';
  sideToggle.title = label;
  sideToggle.setAttribute('aria-label', label);
}

function setSideHidden(hidden) {
  layout.sideHidden = hidden;
  applyLayout();
  saveLayout();
}

sideToggle.addEventListener('click', () => setSideHidden(!layout.sideHidden));

document.addEventListener('keydown', (e) => {
  // Ctrl+B / Cmd+B：和大多数编辑器一致
  if ((e.ctrlKey || e.metaKey) && (e.key === 'b' || e.key === 'B')) {
    e.preventDefault();
    setSideHidden(!layout.sideHidden);
  }
});

/**
 * 给一根拖条装上左右拖动。
 * @param {HTMLElement} grip 拖条
 * @param {HTMLElement} target 要改宽度的栏
 * @param {'side'|'chat'} key layout 里对应的字段
 * @param {number} min 这栏的最小宽度
 * @param {(delta:number)=>number} maxOf 这栏最多能拉多宽（要扣掉旁边几栏）
 */
function bindGrip(grip, target, key, min, maxOf) {
  let dragging = false;
  let startX = 0;
  let startW = 0;

  const onMove = (e) => {
    if (!dragging) return;
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    const next = Math.min(Math.max(startW + (x - startX), min), maxOf(x));
    target.style.width = next + 'px';
    layout[key] = Math.round(next);
    // 拖动过程中实时重算预览缩放
    frame.classList.add('resizing');
  };

  const onUp = () => {
    if (!dragging) return;
    dragging = false;
    grip.classList.remove('on');
    document.body.classList.remove('dragging');
    frame.classList.remove('resizing');
    saveLayout();
  };

  const onDown = (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    dragging = true;
    startX = e.touches ? e.touches[0].clientX : e.clientX;
    startW = target.getBoundingClientRect().width;
    grip.classList.add('on');
    document.body.classList.add('dragging');
    e.preventDefault();
  };

  grip.addEventListener('mousedown', onDown);
  grip.addEventListener('touchstart', onDown, { passive: false });
  document.addEventListener('mousemove', onMove);
  document.addEventListener('touchmove', onMove, { passive: false });
  document.addEventListener('mouseup', onUp);
  document.addEventListener('touchend', onUp);

  // 双击恢复默认宽度
  grip.addEventListener('dblclick', () => {
    layout[key] = LAYOUT_DEFAULT[key];
    applyLayout();
    saveLayout();
  });
}

function initLayout() {
  layout = readLayout();
  applyLayout();

  bindGrip(gripSide, wsSide, 'side', SIDE_MIN, () => {
    // 会话栏最多拉到「整个主区减去对话栏最小值、预览最小值、两根拖条」
    const total = document.querySelector('.wsMain').getBoundingClientRect().width;
    return Math.max(SIDE_MIN, total - layout.chat - PANE_MIN - 12);
  });

  bindGrip(gripChat, wsChat, 'chat', CHAT_MIN, () => {
    const total = document.querySelector('.wsMain').getBoundingClientRect().width;
    const sideW = layout.sideHidden ? 0 : layout.side;
    return Math.max(CHAT_MIN, total - sideW - PANE_MIN - 12);
  });

  // 窗口变小有可能把预览挤到看不见：收一下对话栏，别去动用户主动调的会话栏
  window.addEventListener('resize', () => {
    const total = document.querySelector('.wsMain').getBoundingClientRect().width;
    const sideW = layout.sideHidden ? 0 : layout.side;
    const avail = total - sideW - PANE_MIN - 12;
    if (layout.chat > avail && avail >= CHAT_MIN) {
      layout.chat = Math.round(avail);
      applyLayout();
    }
  });
}

/* ---------------------------------------------------------------- 顶栏与预览 */

function reload() {
  frame.src = MP.draftUrl(USERNAME, NAME) + '?t=' + Date.now();
}

function setTitle() {
  const t = SITE.title || NAME;
  document.getElementById('wsTitle').textContent = t;
  document.title = t + ' · 工作区';
}

/** 草稿打开后先把预览挂上，不等对话记录。 */
async function boot() {
  const me = await MP.me();
  if (!me) {
    location.href = '/login?next=' + encodeURIComponent('/workspace/' + NAME);
    return;
  }
  USERNAME = me.username;

  // 用站点详情确认归属与状态（草稿/正式站都能进工作区，草稿才是主场景）
  try {
    const data = await MP.api(MP.siteApiOf(USERNAME, NAME, ''));
    SITE = Object.assign({}, data.site, { name: NAME });
    setTitle();
    document.getElementById('wsBadge').textContent = SITE.status === 'draft' ? '草稿' : '已发布';
  } catch (e) {
    MP.alert(e.message || '打不开这个站点');
    location.href = '/sites';
    return;
  }

  reload();
  loadFiles();
  await loadThreads();
  await loadModels();

  // 从 /new 带过来的第一条消息：草稿已经建好，这里补发一次
  const first = sessionStorage.getItem('mp:firstMessage:' + NAME);
  if (first) {
    sessionStorage.removeItem('mp:firstMessage:' + NAME);
    sendMessage(first);
  }
}

/* ---------------------------------------------------------------- 模型 */

// 模型清单只在进页面时拿一次；切换会话时按会话上记的 model 同步显示
let MODELS = [];
let DEFAULT_MODEL = '';
let MODES = [];

async function loadModels() {
  try {
    const data = await MP.api('/api/agent/tools');
    MODELS = data.models || [];
    DEFAULT_MODEL = data.defaultModel || '';
    MODES = data.modes || [];
  } catch {
    MODELS = [];
    DEFAULT_MODEL = '';
    MODES = [];
  }
  syncModelLabel();
}

/** 当前会话的模型 id（没设就用默认的可用模型）。 */
function currentModelId() {
  const t = THREADS.find((x) => x.id === threadId);
  const wanted = (t && t.model) || DEFAULT_MODEL;
  const m = MODELS.find((x) => x.id === wanted) || MODELS.find((x) => x.ready);
  return m ? m.id : '';
}

/** 当前会话的模式（chat / code）。 */
function currentMode() {
  const t = THREADS.find((x) => x.id === threadId);
  return (t && t.mode) || 'code';
}

/**
 * 底部两个上拉框：各自独立显示和选择。
 * 没配 key 时模型框置灰不可点，模式框照常可用。
 */
function syncModelLabel() {
  const id = currentModelId();
  const m = MODELS.find((x) => x.id === id);
  const mode = currentMode();
  const modeInfo = MODES.find((x) => x.id === mode);

  // 模型框
  if (!m) {
    modelPickLabel.textContent = '未接模型';
    modelPick.title = '服务器还没配置模型，先在环境变量里加 LLM_API_KEY';
    modelPick.classList.add('off');
    modelPick.disabled = true;
  } else {
    modelPickLabel.textContent = m.label;
    modelPick.title = `${m.provider} / ${m.model}`;
    modelPick.classList.remove('off');
    modelPick.disabled = false;
  }

  // 模式框
  modePickLabel.textContent = modeInfo ? modeInfo.label : '编码';
  modePick.title = modeInfo ? modeInfo.hint : '可以读写文件';
  modePick.classList.toggle('isChat', mode === 'chat');
}

/** 把改动落到当前会话上。 */
async function patchThread(patch) {
  const t = THREADS.find((x) => x.id === threadId);
  if (!t) {
    MP.toast('先建一个会话');
    return false;
  }
  try {
    await MP.api(api('/threads/' + threadId), { method: 'PUT', body: patch });
    Object.assign(t, patch);
    syncModelLabel();
    syncChatTitle();
    return true;
  } catch (e) {
    MP.toast(e.message || '切换失败');
    return false;
  }
}

/* ---------------------------------------------------------------- 上拉框（下拉面板） */

// 当前打开的面板；同一时间只允许一个
let openSheet = null;

/** 关掉当前面板。 */
function closeSheet() {
  if (!openSheet) return;
  openSheet.remove();
  openSheet = null;
  document.removeEventListener('click', onDocClick, true);
  document.removeEventListener('keydown', onDocKey);
  document.removeEventListener('scroll', onDocScroll, true);
}

function onDocClick(e) {
  if (!openSheet) return;
  if (openSheet.contains(e.target)) return;

  // 点在「打开它的那个按钮」上时不要在这里关：
  // 捕获阶段会比按钮自己的 click 先跑，这里关了、按钮那个处理器又会立刻重新打开，
  // 结果就是「再点一次同一按钮关不掉」。toggle 交给按钮自己处理。
  const holder = document.getElementById(openSheet.dataset.for);
  if (holder && (holder === e.target || holder.contains(e.target))) return;

  closeSheet();
}
function onDocKey(e) {
  if (e.key === 'Escape') closeSheet();
}

// 面板刚滚过之后的短时间内，忽略页面滚动 —— 见下面 onDocScroll 的说明
let sheetScrollGuardUntil = 0;

/**
 * 页面滚动时收起面板（它用 fixed 定位，页面一滚就贴不住了）。
 *
 * 但**面板自己内部的滚动不算**：拖滑条、滚轮翻选项都会产生 scroll 事件，
 * 早先这里一律 closeSheet，结果「一滚鼠标就关掉」——这是必须区分开的。
 */
function onDocScroll(e) {
  if (!openSheet) return;
  // 滚的是面板本身（拖内部滑条）：不关
  if (e.target === openSheet || openSheet.contains(e.target)) return;
  // 滚轮滚到面板边界后会「滚动链」到页面，这时 target 变成 document，
  // 但用户其实是在操作面板 —— 用一个小时间窗兜住
  if (Date.now() < sheetScrollGuardUntil) return;
  closeSheet();
}

/**
 * 在某个按钮上方弹一个上拉面板（就是图 3 / 图 4 那种）。
 *
 * 为什么不用 `<select>`：原生 select 没法显示副标题、没法做主题样式；
 * 这里自己画一个 fixed 面板，行为对得上（点外面关、Esc 关、选中即关）。
 *
 * @param {HTMLElement} anchor 触发按钮
 * @param {object} opt
 *   items: [{ value, label, hint, active }]
 *   onPick(value)
 */
function openListSheet(anchor, { items, onPick }) {
  // 再点同一个按钮就是收起
  if (openSheet && openSheet.dataset.for === anchor.id) {
    closeSheet();
    return;
  }
  closeSheet();

  const sheet = document.createElement('div');
  sheet.className = 'wsSheet';
  sheet.dataset.for = anchor.id;
  sheet.setAttribute('role', 'listbox');

  items.forEach((item) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'wsSheetItem' + (item.active ? ' on' : '');
    btn.setAttribute('role', 'option');
    btn.setAttribute('aria-selected', item.active ? 'true' : 'false');

    const title = document.createElement('b');
    title.textContent = item.label;
    btn.appendChild(title);

    if (item.hint) {
      const hint = document.createElement('span');
      hint.textContent = item.hint;
      btn.appendChild(hint);
    }

    // 当前选中项右侧打勾
    if (item.active) {
      const tick = document.createElement('i');
      tick.className = 'wsSheetTick';
      tick.textContent = '✓';
      btn.appendChild(tick);
    }

    btn.addEventListener('click', () => {
      closeSheet();
      onPick(item.value);
    });
    sheet.appendChild(btn);
  });

  document.body.appendChild(sheet);

  // 贴着按钮**上方**弹出（底部输入区，往上翻才不会挡输入框）
  const r = anchor.getBoundingClientRect();
  const w = sheet.offsetWidth;
  const h = sheet.offsetHeight;
  let left = r.left;
  if (left + w > window.innerWidth - 8) left = window.innerWidth - w - 8;
  if (left < 8) left = 8;
  let top = r.top - h - 6;
  if (top < 8) top = r.bottom + 6;   // 上面放不下就翻到下面
  sheet.style.left = Math.round(left) + 'px';
  sheet.style.top = Math.round(top) + 'px';

  openSheet = sheet;

  // 面板内部滚动（拖滑条 / 滚轮翻选项）时，刷新时间窗，
  // 让随后可能发生的「滚动链到页面」不被当成「用户滚了页面」
  sheet.addEventListener('scroll', () => {
    sheetScrollGuardUntil = Date.now() + 260;
  }, { passive: true });

  // 滚轮在面板里滚动时，如果面板已经到头了，浏览器会把滚动传给页面（滚动链）。
  // 这里直接拦掉：面板开着的时候，滚轮只在面板内部生效，不带动背景页面。
  sheet.addEventListener('wheel', (e) => {
    const atTop = sheet.scrollTop <= 0;
    const atBottom = sheet.scrollTop + sheet.clientHeight >= sheet.scrollHeight - 1;
    const scrollingUp = e.deltaY < 0;
    // 还能滚就让它自己滚；滚到头了也别传给页面，否则面板会被关掉
    if ((scrollingUp && atTop) || (!scrollingUp && atBottom)) e.preventDefault();
    sheetScrollGuardUntil = Date.now() + 260;
  }, { passive: false });

  // 用捕获阶段：按钮自己的 click 先跑完再判断，避免刚开就被关掉
  setTimeout(() => {
    document.addEventListener('click', onDocClick, true);
    document.addEventListener('keydown', onDocKey);
    document.addEventListener('scroll', onDocScroll, true);
  }, 0);
}

// 模型框：只列真正可用的（有 key + 支持工具）
modelPick.addEventListener('click', (e) => {
  e.stopPropagation();

async function loadThreads() {
  try {
    const data = await MP.api(api('/threads'));
    THREADS = data.threads || [];
  } catch {
    THREADS = [];
  }

  // 没有任何会话时自动建一个，避免用户面对一个空下拉无从下手
  if (!THREADS.length) {
    try {
      const created = await MP.api(api('/threads'), { method: 'POST', body: {} });
      THREADS = [created.thread];
    } catch { /* 建不出来就保持空列表，下面会显示提示 */ }
  }

  // 首次进入：落到最近更新的那个会话
  if (!threadId && THREADS.length) threadId = THREADS[0].id;

  renderThreads();
  await loadMessages();
}

function renderThreads() {
  threadList.textContent = '';

  if (!THREADS.length) {
    const tip = document.createElement('div');
    tip.className = 'wsThreadEmpty';
    tip.textContent = '还没有会话';
    threadList.appendChild(tip);
    syncChatTitle();
    return;
  }

  THREADS.forEach((t) => {
    const row = document.createElement('div');
    row.className = 'wsThread' + (t.id === threadId ? ' on' : '');
    row.dataset.id = String(t.id);

    const name = document.createElement('button');
    name.type = 'button';
    name.className = 'wsThreadName';
    name.textContent = t.title || '未命名会话';
    name.title = (t.title || '未命名会话') + '（' + (t.msg_count || 0) + ' 条消息）';
    name.addEventListener('click', () => selectThread(t.id));
    row.appendChild(name);

    // 更多操作收进一个「⋯」按钮：以后加功能只往菜单里塞，列表行不会被撑爆
    const more = document.createElement('button');
    more.type = 'button';
    more.className = 'wsThreadMore';
    more.title = '更多操作';
    more.setAttribute('aria-label', '更多操作');
    more.setAttribute('aria-haspopup', 'menu');
    more.innerHTML = '<span aria-hidden="true">···</span>';
    more.addEventListener('click', (e) => {
      e.stopPropagation();
      openThreadMenu(more, t);
    });
    row.appendChild(more);

    threadList.appendChild(row);
  });

  // 会话标题变了、切换了，顶部导航栏的标题要跟着走
  syncChatTitle();
}

/* ---------------------------------------------------------------- 会话的「更多」菜单 */

let openMenuEl = null;

/** 关掉当前打开的菜单（如果点的是菜单自己就跳过）。 */
function closeThreadMenu() {
  if (openMenuEl) {
    openMenuEl.remove();
    openMenuEl = null;
  }
}

/**
 * 在按钮旁边弹出操作菜单。
 * @param {HTMLElement} anchor 「⋯」按钮
 * @param {object} thread 对应的会话
 */
function openThreadMenu(anchor, thread) {
  // 再点同一个按钮就是收起
  if (openMenuEl && openMenuEl.dataset.for === String(thread.id)) {
    closeThreadMenu();
    return;
  }
  closeThreadMenu();

  const menu = document.createElement('div');
  menu.className = 'wsMenu';
  menu.dataset.for = String(thread.id);
  menu.setAttribute('role', 'menu');

  const item = (label, danger, onClick) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'wsMenuItem' + (danger ? ' danger' : '');
    btn.textContent = label;
    btn.setAttribute('role', 'menuitem');
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      closeThreadMenu();
      onClick();
    });
    menu.appendChild(btn);
  };

  item('重命名', false, () => renameThread(thread));
  item('删除', true, () => removeThread(thread));

  document.body.appendChild(menu);

  // 贴着按钮定位，超出视口就往回收
  const r = anchor.getBoundingClientRect();
  const mw = menu.offsetWidth;
  const mh = menu.offsetHeight;
  let left = r.right - mw;
  let top = r.bottom + 4;
  if (left < 8) left = 8;
  if (left + mw > window.innerWidth - 8) left = window.innerWidth - mw - 8;
  if (top + mh > window.innerHeight - 8) top = r.top - mh - 4;
  menu.style.left = left + 'px';
  menu.style.top = Math.max(8, top) + 'px';

  openMenuEl = menu;
}

// 点别处 / 按 Esc / 滚动 / 改窗口大小都收起菜单

/** 对话栏顶部的标题跟着当前会话说：显示会话名，没会话时显示「对话」。
 *  对话模式的会话名后面挂个「对话」小标，和编码会话区分开。 */
function syncChatTitle() {
  const t = THREADS.find((x) => x.id === threadId);
  const title = (t && t.title) || '对话';
  const isChat = t && t.mode === 'chat';
  chatTitle.textContent = isChat ? `${title} · 对话` : title;
  chatTitle.title = t
    ? `${title}（${Number(t.msg_count ?? t.msgCount ?? 0)} 条消息，${isChat ? '只聊天不改文件' : '可改文件'}）`
    : '当前对话';
  syncModelLabel();
}

async function selectThread(id) {
  if (id === threadId) return;
  if (sending) {
    MP.toast('等这条回复出来再切会话');
    return;
  }
  threadId = id;
  renderThreads();
  await loadMessages();
}

async function renameThread(t) {
  const next = await MP.prompt({
    text: '给这个会话起个名字',
    value: t.title || '',
    placeholder: '比如：改配色、加导航',
  });
  if (next === null) return;
  const title = String(next).trim();
  if (!title) return;
  try {
    await MP.api(api('/threads/' + t.id), { method: 'PUT', body: { title } });
    t.title = title;
    renderThreads();
  } catch (e) {
    MP.toast(e.message || '改名失败');
  }
}

async function removeThread(t) {
  const ok = await MP.ask({
    text: '删掉会话「' + (t.title || '未命名会话') + '」？里面的对话记录会一起删掉，删了不能恢复。',
    buttons: [
      { key: 'cancel', label: '取消' },
      { key: 'delete', label: '删除', primary: true },
    ],
  });
  if (ok !== 'delete') return;

  try {
    await MP.api(api('/threads/' + t.id), { method: 'DELETE' });
    THREADS = THREADS.filter((x) => x.id !== t.id);
    if (threadId === t.id) threadId = THREADS.length ? THREADS[0].id : 0;
    if (!THREADS.length) {
      await loadThreads();   // 删光了就再建一个默认的
      return;
    }
    renderThreads();
    await loadMessages();
  } catch (e) {
    MP.toast(e.message || '删除失败');
  }
}

document.getElementById('newThread').addEventListener('click', async () => {

    MP.toast('等这条回复出来再开新对话');
    return;
  }
  try {
    const created = await MP.api(api('/threads'), { method: 'POST', body: {} });
    THREADS.unshift(created.thread);
    threadId = created.thread.id;
    renderThreads();

    input.focus();

});

/* ---------------------------------------------------------------- 消息 */

async function loadMessages() {
  if (!threadId) {
    MP.renderMessages(msgs, [], '还没有会话，点左上角「新对话」开始。');
    return;
  }
  try {
    const data = await MP.api(api('/threads/' + threadId + '/messages'));
    MP.renderMessages(msgs, data.messages || [], '有什么想改的，直接说。');
  } catch {
    MP.renderMessages(msgs, [], '对话记录加载失败，可以继续发消息。');
  }
}

// 当前这轮 agent 的取消句柄。
// 必须放在模块作用域：点击处理器和 Esc 监听都在 sendMessage 外面，
// 早先把它写在函数里，外面读不到直接抛 ReferenceError，点发送毫无反应。
let activeCancel = null;

async function sendMessage(text) {
  if (sending) return;
  const content = String(text == null ? input.value : text).trim();
  // 只有图没有文字也算合法：「照这个图改」经常懒得打字
  const readyImages = PENDING_IMAGES.filter((img) => img.id);
  if (!content && !readyImages.length) return;
  if (!threadId) {
    MP.toast('先建一个会话');
    return;
  }
  // 还有图在上传：等它传完，不然会发出一条「少一张图」的消息
  if (PENDING_IMAGES.some((img) => img.uploading)) {
    MP.toast('图片还在上传，稍等一下');
    return;
  }

  sending = true;
  send.disabled = true;
  if (text == null) input.value = '';
  MP.autoGrow(input)();

  // 发送前把图片 id 抓下来：发完要清空待发送区
  const attachIds = readyImages.map((img) => img.id);

  // 跑的过程中发送按钮变成「停止」：同一个按钮两种状态，
  // 用户不用去找另一个停的地方（这也是 ChatGPT / Cursor 的做法）
  const enterRunning = () => {
    send.disabled = false;
    send.classList.add('stopping');
    send.textContent = '■';
    send.title = '停止生成（Esc）';
  };
  const exitRunning = () => {
    send.classList.remove('stopping');
    send.textContent = '↑';
    send.title = '发送（Enter）';
    send.disabled = false;
    activeCancel = null;
  };

  try {
    await MP.pushMessage({
      list: msgs,
      username: USERNAME,
      name: NAME,
      content,
      threadId,
      attachIds,
      // 任务开跑：按钮切成停止态；模型框同步成实际用的那个
      //（服务端可能因为原模型连不上而降级到别的，这里要跟上）
      onStarted: (data, ctl) => {
        activeCancel = ctl;
        enterRunning();
        // 消息已经发出去了：立刻清空待发送区。
        // 不能等整轮跑完再清 —— 生成要几十秒，图一直挂在那儿会让人以为没发出去。
        clearImages();
        if (data.model && data.model.id) {
          modelPickLabel.textContent = data.model.label || data.model.id;
        }
        // 服务端说这个模型看不了图：提醒一句，但不要拦（用户可能就是想试试）
        if (attachIds.length && data.vision === false) {
          MP.toast('当前模型看不了图片，换 Claude Haiku 5.5 / GPT-6 Luna / GLM 试试');
        }
      },
      onReply: () => {
        // 第一条消息自动给会话起名，列表里不再全是「新对话」。
        // 注意字段来源有两处：接口列表是 msg_count（下划线），新建返回的是 msgCount，
        // 两个都要认，否则自动改名永远不触发。
        const t = THREADS.find((x) => x.id === threadId);
        const count = t ? Number(t.msg_count ?? t.msgCount ?? 0) : 0;
        if (t && (!t.title || t.title === '新对话') && count === 0) {
          // 只有图没文字时，用「[图片]」当标题，别留空
          const title = content.slice(0, 20) || (attachIds.length ? '[图片]' : '');
          if (title) {
            MP.api(api('/threads/' + threadId), { method: 'PUT', body: { title } })
              .then(() => {
                t.title = title;
                t.msg_count = 2;
                renderThreads();
              })
              .catch(() => {});
          }
        }
        // agent 改了文件，预览要跟着刷新
        reload();
        loadFiles();
      },
    });
  } catch (e) {
    MP.toast(e.message || '发送失败');
  } finally {
    sending = false;
    exitRunning();
    input.focus();
  }
}

// 发送键兼任停止键
send.addEventListener('click', () => {
  if (activeCancel) { activeCancel.cancel(); return; }
  sendMessage(null);
});

// Esc 也能停：手在键盘上时不用去够按钮
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && activeCancel) {
    e.preventDefault();
    activeCancel.cancel();
  }
});
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    sendMessage(null);
  }
});
/* ---------------------------------------------------------------- 图片附件 */

// 待发送的图片。{ id, mime, size, url }
// id 是服务端返回的附件 id，url 是本地 blob 预览（发送成功后释放）
let PENDING_IMAGES = [];
const MAX_IMAGES = 4;
const MAX_IMAGE_BYTES = 4 * 1024 * 1024;

/** 刷新图片条：有条就显示、把对话区往上顶；没有就收起。 */
function renderAttachBar() {
  attachList.textContent = '';
  const n = PENDING_IMAGES.length;
  if (!n) {
    attachBar.hidden = true;
    attachHint.textContent = '';
    return;
  }
  attachBar.hidden = false;

  PENDING_IMAGES.forEach((img, i) => {
    const box = document.createElement('div');
    box.className = 'wsAttach';
    box.title = `${img.mime} · ${formatSize(img.size)}`;

    const el = document.createElement('img');
    el.src = img.url;
    el.alt = '待发送图片';
    box.appendChild(el);

    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'wsAttachDel';
    del.textContent = '×';
    del.title = '移除这张图';
    del.addEventListener('click', () => removeImage(i));
    box.appendChild(del);

    attachList.appendChild(box);
  });

  // 模型看不了图时提前提醒，别等它回一句「我看不到图片」
  const m = MODELS.find((x) => x.id === currentModelId());
  if (m && !m.supportsVision) {
    attachHint.textContent = `${m.label} 看不了图片，换 Claude Haiku 5.5 / GPT-6 Luna / GLM 选一个`;
    attachHint.classList.add('warn');
  } else {
    attachHint.textContent = `${n}/${MAX_IMAGES} 张`;
    attachHint.classList.remove('warn');
  }
}

function formatSize(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(0) + ' KB';
  return (n / 1024 / 1024).toFixed(1) + ' MB';
}

function removeImage(index) {
  const [gone] = PENDING_IMAGES.splice(index, 1);
  if (gone && gone.url) URL.revokeObjectURL(gone.url);
  renderAttachBar();
}

function clearImages() {
  PENDING_IMAGES.forEach((img) => { if (img.url) URL.revokeObjectURL(img.url); });
  PENDING_IMAGES = [];
  renderAttachBar();
}

/**
 * 加一张图：先本地预览（立刻可见），再传到服务端拿 id。
 * 上传失败就把这张撤掉，别留一个「看着在但其实发不出去」的图。
 */
async function addImage(file) {
  if (!file) return;
  if (PENDING_IMAGES.length >= MAX_IMAGES) {
    MP.toast(`最多 ${MAX_IMAGES} 张图`);
    return;
  }
  if (!/^image\/(png|jpeg|webp|gif)$/.test(file.type)) {
    MP.toast('只支持 PNG / JPEG / WEBP / GIF');
    return;
  }
  if (file.size > MAX_IMAGE_BYTES) {
    MP.toast(`图片太大，单张上限 ${MAX_IMAGE_BYTES / 1024 / 1024} MB`);
    return;
  }
  if (!threadId) {
    MP.toast('先建一个会话');
    return;
  }

  const entry = {
    id: null,
    mime: file.type,
    size: file.size,
    url: URL.createObjectURL(file),
    uploading: true,
  };
  PENDING_IMAGES.push(entry);
  renderAttachBar();

  try {
    const buf = await file.arrayBuffer();
    const res = await fetch(api('/attachments?threadId=' + threadId), {
      method: 'POST',
      headers: { 'content-type': file.type },
      body: buf,
      credentials: 'same-origin',
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) throw new Error(data.message || '上传失败');
    entry.id = data.attachment.id;
    entry.mime = data.attachment.mime;
    entry.size = data.attachment.size;
    entry.uploading = false;
    renderAttachBar();
  } catch (e) {
    const i = PENDING_IMAGES.indexOf(entry);
    if (i >= 0) removeImage(i);
    MP.toast(e.message || '图片上传失败');
  }
}

/** 从剪贴板 / 拖拽里的 File 列表批量加图。 */
function addImageFiles(files) {
  const list = [...(files || [])].filter((f) => f && /^image\//.test(f.type));
  if (!list.length) return false;
  list.slice(0, MAX_IMAGES - PENDING_IMAGES.length).forEach((f) => addImage(f));
  return true;
}

// ＋ 按钮：打开系统文件选择
plus.addEventListener('click', () => filePick.click());
filePick.addEventListener('change', () => {
  addImageFiles(filePick.files);
  filePick.value = '';   // 清空，同一张图能再选一次
});

// 直接粘贴：Ctrl+V 把截图贴进对话栏
input.addEventListener('paste', (e) => {
  const items = e.clipboardData?.items;
  if (!items) return;
  const files = [];
  for (const item of items) {
    if (item.kind === 'file' && /^image\//.test(item.type)) {
      const f = item.getAsFile();
      if (f) files.push(f);
    }
  }
  if (files.length) {
    e.preventDefault();    // 别把剪贴板里的二进制当文本塞进输入框
    addImageFiles(files);
  }
});

// 拖拽进来也能加
const composer = input.closest('.wsComposer');
composer.addEventListener('dragover', (e) => {
  if (![...(e.dataTransfer?.types || [])].includes('Files')) return;
  e.preventDefault();
  composer.classList.add('dragOver');
});
composer.addEventListener('dragleave', (e) => {
  if (e.relatedTarget && composer.contains(e.relatedTarget)) return;
  composer.classList.remove('dragOver');
});
composer.addEventListener('drop', (e) => {
  composer.classList.remove('dragOver');
  if (!e.dataTransfer?.files?.length) return;
  e.preventDefault();
  addImageFiles(e.dataTransfer.files);
});

/* ---------------------------------------------------------------- 文件列表 */

async function loadFiles() {
  try {
    const data = await MP.api(api('/files'));
    FILES = data.files || [];
    fileList.textContent = '';
    if (!FILES.length) {
      const tip = document.createElement('div');
      tip.className = 'wsFilesEmpty';
      tip.textContent = '这个草稿还没有文件';
      fileList.appendChild(tip);
      return;
    }
    FILES.forEach((f) => fileList.appendChild(fileRow(f)));
    // 默认打开入口页
    if (!currentPath) {
      const entry = FILES.find((f) => f.path === 'index.html') || FILES[0];
      if (entry) loadFile(entry.path);
    }
  } catch (e) {
    fileList.textContent = '';
    const tip = document.createElement('div');
    tip.className = 'wsFilesEmpty';
    tip.textContent = e.message || '文件列表加载失败';
    fileList.appendChild(tip);
  }
}

function fileRow(f) {
  const el = document.createElement('button');
  el.type = 'button';
  el.className = 'wsFile' + (f.path === currentPath ? ' on' : '');
  el.dataset.path = f.path;
  el.innerHTML = '<span class="wsFileName"></span><span class="wsFileSize"></span>';
  el.querySelector('.wsFileName').textContent = f.path;
  el.querySelector('.wsFileSize').textContent = fmtSize(f.size);
  el.addEventListener('click', () => loadFile(f.path));
  return el;
}

function fmtSize(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1024 / 1024).toFixed(1) + ' MB';
}

function markFileRow(path) {
  fileList.querySelectorAll('.wsFile').forEach((el) => {
    el.classList.toggle('on', el.dataset.path === path);
  });
}

/* ---------------------------------------------------------------- 编辑器 */

/** 行号栏跟着内容重画（行数与 textarea 的行数一致）。 */
function drawGutter() {
  const lines = code.value.split('\n').length;
  const parts = [];
  for (let i = 1; i <= lines; i += 1) parts.push(i);
  gutter.textContent = parts.join('\n');
  gutter.scrollTop = code.scrollTop;
}

function setDirty(v) {
  dirty = v;
  editState.textContent = v ? '未保存' : '';
  editState.classList.toggle('warn', v);
  saveFile.disabled = !v;
}

async function loadFile(path) {
  if (!path) return;
  if (dirty) {
    const ok = await MP.ask({
      text: '当前文件还没保存，切换后会丢掉改动。',
      buttons: [
        { key: 'drop', label: '丢弃改动', primary: true },
        { key: 'stay', label: '留在这里' },
      ],
    });
    if (ok !== 'drop') return;
  }
  currentPath = path;
  markFileRow(path);
  editPath.textContent = path;

  try {
    const data = await MP.api(api('/files/content?path=' + encodeURIComponent(path)));
    if (data.binary) {
      codeWrap.hidden = true;
      editEmpty.hidden = false;
      editEmpty.textContent = '这是二进制文件，不能在线编辑';
      savedText = '';
      setDirty(false);
      return;
    }
    savedText = data.content;
    code.value = data.content;
    codeWrap.hidden = false;
    editEmpty.hidden = true;
    setDirty(false);
    drawGutter();
  } catch (e) {
    codeWrap.hidden = true;
    editEmpty.hidden = false;
    editEmpty.textContent = e.message || '读取失败';
  }
}

code.addEventListener('input', () => {
  setDirty(code.value !== savedText);
  drawGutter();
});
code.addEventListener('scroll', () => { gutter.scrollTop = code.scrollTop; });
code.addEventListener('keydown', (e) => {
  // Tab 插入两个空格，别把焦点跳走
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = code.selectionStart;
    const t = code.selectionEnd;
    code.value = code.value.slice(0, s) + '  ' + code.value.slice(t);
    code.selectionStart = code.selectionEnd = s + 2;
    setDirty(code.value !== savedText);
    drawGutter();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    saveCurrent();
  }
});

async function saveCurrent() {
  if (!currentPath || !dirty) return;
  saveFile.disabled = true;
  saveFile.textContent = '保存中…';
  try {
    // 文件接口按原始字节存，这里直接传文本
    await fetch(api('/files?path=' + encodeURIComponent(currentPath)), {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain; charset=utf-8' },
      body: code.value,
    }).then(async (res) => {
      if (!res.ok) {
        const data = await res.json().catch(() => null);
        throw new Error((data && data.message) || '保存失败');
      }
    });
    savedText = code.value;
    setDirty(false);
    MP.toast('已保存');
    reload();
  } catch (e) {
    MP.toast(e.message || '保存失败');
    saveFile.disabled = !dirty;
  } finally {
    saveFile.textContent = '保存';
  }
}

saveFile.addEventListener('click', saveCurrent);

// 有未保存改动时离开页面先拦一下
window.addEventListener('beforeunload', (e) => {
  if (!dirty) return;
  e.preventDefault();
  e.returnValue = '';
});

/* ---------------------------------------------------------------- 历史与回滚 */

let snapshots = [];

async function openHistory() {
  try {
    const data = await MP.api(api('/snapshots'));
    snapshots = data.snapshots || [];
  } catch (e) {
    MP.alert(e.message || '读不到历史');
    return;
  }

  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  const card = document.createElement('div');
  card.className = 'modal historyModal';
  card.innerHTML = ''
    + '<button type="button" class="modal-x" aria-label="关闭">×</button>'
    + '<h2 class="modal-title">改动历史</h2>'
    + '<p class="hint" style="margin:0 0 12px">'
    +   '每次改动前会自动存一份快照，点「还原」就能退回去。只记录被改动的那几个文件。'
    + '</p>'
    + '<div class="historyList"></div>';

  const list = card.querySelector('.historyList');
  if (!snapshots.length) {
    const empty = document.createElement('div');
    empty.className = 'historyEmpty';
    empty.textContent = '还没有改动记录。';
    list.appendChild(empty);
  } else {
    snapshots.forEach((s) => list.appendChild(historyRow(s, card)));
  }

  const close = () => mask.remove();
  card.querySelector('.modal-x').addEventListener('click', close);
  mask.addEventListener('click', (e) => { if (e.target === mask) close(); });
  document.addEventListener('keydown', function onEsc(e) {
    if (e.key !== 'Escape') return;
    document.removeEventListener('keydown', onEsc);
    close();
  });

  mask.appendChild(card);
  document.body.appendChild(mask);
}

function historyRow(s, card) {
  const row = document.createElement('div');
  row.className = 'historyRow';

  const info = document.createElement('div');
  info.className = 'historyInfo';
  const title = document.createElement('b');
  title.textContent = s.label || '改动';
  const meta = document.createElement('span');
  meta.className = 'muted';
  meta.textContent = fmtTime(s.created_at) + ' · ' + fmtSize(s.size);
  info.appendChild(title);
  info.appendChild(meta);
  row.appendChild(info);

  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'tiny ghost';
  btn.textContent = '还原';
  btn.addEventListener('click', () => restore(s, btn, card));
  row.appendChild(btn);

  return row;
}

function fmtTime(iso) {
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso || '';
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

async function restore(snap, btn, card) {
  const ok = await MP.ask({
    text: '还原到「' + (snap.label || '这次改动') + '」之前的状态？\n'
      + '当前状态会先自动存一份，点错了还能退回来。',
    buttons: [
      { key: 'cancel', label: '取消' },
      { key: 'restore', label: '还原', primary: true },
    ],
  });
  if (ok !== 'restore') return;

  btn.disabled = true;
  btn.textContent = '还原中…';
  try {
    const data = await MP.api(api('/snapshots/' + snap.id + '/restore'), { method: 'POST' });
    card.remove();
    document.querySelector('.modal-mask')?.remove();
    MP.toast('已还原，刷新预览看看');
    reload();
    loadFiles();
  } catch (e) {
    btn.disabled = false;
    btn.textContent = '还原';
    MP.alert(e.message || '还原失败');
  }
}

document.getElementById('historyBtn').addEventListener('click', openHistory);

/* ---------------------------------------------------------------- 导出 */

document.getElementById('exportBtn').addEventListener('click', () => {
  if (dirty) {
    MP.alert('先把代码保存了再导出');
    return;
  }
  // 走浏览器原生下载：后端已经设了 Content-Disposition: attachment
  location.href = api('/export');
});

/* ---------------------------------------------------------------- 发布 */

document.getElementById('publish').addEventListener('click', () => {
  if (dirty) {
    MP.alert('先把代码保存了再发布');
    return;
  }
  MP.publishDialog({
    username: USERNAME,
    draft: { name: NAME, title: SITE.title, description: SITE.description, tag: SITE.tag },
    onPublished: () => {
      SITE.status = 'active';
      document.getElementById('wsBadge').textContent = '已发布';
    },
  });
});

document.getElementById('openDraft').addEventListener('click', () => {
  window.open(MP.draftUrl(USERNAME, NAME), '_blank', 'noopener');
});

initLayout();
boot();
</script>
</body>
</html>
