<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>通知 · MinePage</title>
<link rel="stylesheet" href="/_assets/style.css">
</head>
<body>
<main class="page">
  <div class="secHead">
    <h1 style="margin:0">通知</h1>
    <button type="button" class="ghost tiny" id="seen">全部标为已读</button>
  </div>

  <div class="chips" id="tabs" style="margin:16px 0 4px"></div>

  <div class="rows" id="list"></div>
  <div id="empty" class="empty" hidden>这里还没有消息。有人赞、评论、收藏你的页面，或者关注你的时候，就会出现在这里。</div>
</main>

<script src="/_assets/app.js"></script>
<script>
MP.topbar({ active: 'dynamic' });

const TABS = [
  { key: 'all', label: '全部' },
  { key: 'comment', label: '回复我的' },
  { key: 'interact', label: '赞与收藏投币' },
  { key: 'follow', label: '新增关注' },
];

const TYPE_TEXT = {
  like: '赞了你的页面',
  comment: '评论了你的页面',
  favorite: '收藏了你的页面',
  coin: '给你的页面投了币',
  follow: '关注了你',
};

let tab = 'all';
let items = [];

const tabsBox = document.getElementById('tabs');
const listBox = document.getElementById('list');
const emptyBox = document.getElementById('empty');

/** 服务端每条通知已带 unread（按 notify_seen_at 算），前端不再自己猜。 */

function match(it) {
  if (tab === 'all') return true;
  if (tab === 'interact') return it.type === 'like' || it.type === 'favorite' || it.type === 'coin';
  return it.type === tab;
}

function renderTabs() {
  tabsBox.textContent = '';
  TABS.forEach((t) => {
    const el = document.createElement('span');
    el.className = 'chip' + (t.key === tab ? ' active' : '');
    el.textContent = t.label;
    el.addEventListener('click', () => { tab = t.key; renderTabs(); render(); });
    tabsBox.appendChild(el);
  });
}

function renderItem(it) {
  const el = document.createElement('div');
  el.className = 'rowItem' + (it.unread ? ' unread' : '');

  const av = document.createElement('span');
  av.className = 'avatar sm';
  av.textContent = String(it.actor || '?').charAt(0);

  const grow = document.createElement('div');
  grow.className = 'grow';

  const t = document.createElement('div');
  t.className = 't';

  if (it.type === 'system') {
    t.textContent = it.actor;
  } else {
    if (it.actorUsername) {
      const a = document.createElement('a');
      a.href = '/qwq/' + encodeURIComponent(it.actorUsername);
      a.textContent = it.actor;
      a.style.color = 'var(--muted2)';
      t.appendChild(a);
    } else {
      t.appendChild(document.createTextNode(it.actor));
    }
    t.appendChild(document.createTextNode(' ' + (TYPE_TEXT[it.type] || '和你互动了')));
    // 投币的 snippet 存的是枚数，读起来要带单位
    if (it.type === 'coin' && it.snippet) {
      t.appendChild(document.createTextNode(' ' + it.snippet + ' 枚'));
    }
    if (it.type !== 'follow' && it.siteName) {
      const s = document.createElement('a');
      s.href = MP.viewUrl({ name: it.siteName, author: { username: it.siteOwner } });
      s.textContent = '「' + (it.siteTitle || it.siteName) + '」';
      s.style.color = 'var(--pink)';
      t.appendChild(document.createTextNode(' '));
      t.appendChild(s);
    }
  }
  grow.appendChild(t);

  // coin 的 snippet 是枚数，上面已经拼进标题行了，不再单独占一行
  if (it.snippet && it.type !== 'coin') {
    const d = document.createElement('div');
    d.className = 'd';
    d.textContent = it.snippet;
    grow.appendChild(d);
  }

  el.appendChild(av);
  el.appendChild(grow);

  const time = document.createElement('span');
  time.className = 'muted';
  time.style.cssText = 'font-size:12px;flex:none';
  time.textContent = MP.timeAgo(it.at);
  el.appendChild(time);

  return el;
}

function render() {
  listBox.textContent = '';
  const list = items.filter(match);
  emptyBox.hidden = list.length > 0;
  list.forEach((it) => listBox.appendChild(renderItem(it)));
  listBox.hidden = list.length === 0;
}

document.getElementById('seen').addEventListener('click', async () => {
  try {
    await MP.api('/api/notifications/seen', { method: 'POST' });
    items = items.map((it) => ({ ...it, unread: false }));
    render();
    MP.toast('已全部标为已读');
  } catch (err) {
    MP.toast(err.message);
  }
});

(async () => {
  const me = await MP.requireLogin();
  if (!me) return;

  renderTabs();

  try {
    const data = await MP.api('/api/notifications');
    items = data.items;
    // 列表接口已经把已读游标推到本批最新一条，顶栏那个红点当场就过期了。
    document.querySelector('.tact[href="/notifications"] .dot')?.remove();
    render();
  } catch (err) {
    emptyBox.hidden = false;
    emptyBox.textContent = err.message;
  }
})();
</script>
</body>
</html>
