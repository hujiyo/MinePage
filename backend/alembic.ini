# Alembic 配置。
# 连接串不写在这里 —— 由 alembic/env.py 从 app.core.config.settings 读，
# 这样只有一个来源（环境变量 DATABASE_URL），不会出现"两处配置不一致"。

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

[post_write_hooks]
# 生成迁移后自动格式化，保持和 ruff 的格式一致
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
